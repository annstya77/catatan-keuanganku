    function buildBackupPayload() {
      return {
        app: 'CatatanKeuanganPersonal',
        version: '3.0',
        exportedAt: new Date().toISOString(),
        data: db
      };
    }

    function exportBackupJSON() {
      try {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const dateTag = new Date().toISOString().slice(0, 10);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-keuangan-${dateTag}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File backup JSON berhasil diunduh');
      } catch (err) {
        showToast('Gagal membuat file backup', 'error');
      }
    }

    function copyBackupToClipboard() {
      try {
        const jsonStr = JSON.stringify(buildBackupPayload());
        const ta = document.createElement('textarea');
        ta.value = jsonStr;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Data backup berhasil disalin ke clipboard');
      } catch (err) {
        showToast('Gagal menyalin backup', 'error');
      }
    }

    function openRestoreModal() {
      ui.pendingRestoreData = null;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-medium uppercase text-ink">RESTORE / PULIHKAN DATA</h3>
              <p class="text-xs text-slate-500">Pilih file backup (.json) atau tempel teks JSON</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-slate-500">✕</button>
          </div>

          <div class="space-y-3">
            <label class="block w-full p-4 rounded-2xl border-2 border-dashed border-stone-300 bg-creamCard hover:border-ink text-center cursor-pointer transition-colors">
              <span class="text-xs font-medium text-ink block">Pilih File Backup (.json)</span>
              <span class="text-[11px] text-slate-400 mt-0.5 block">Ketuk untuk mencari file dari penyimpanan perangkat</span>
              <input type="file" accept=".json,application/json" onchange="handleRestoreFileSelect(event)" class="hidden" />
            </label>

            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Atau Tempel Teks JSON Backup</label>
              <textarea id="restore-json-text" rows="3" oninput="previewRestoreFromText(this.value)"
                placeholder='{"app":"CatatanKeuanganPersonal", ...}'
                class="w-full p-3 rounded-2xl bg-creamCard border border-stone-200 text-[11px] font-mono focus:outline-none focus:border-ink"></textarea>
            </div>

            <div id="restore-preview-box" class="hidden bg-sageLight/70 border border-sage/30 rounded-2xl p-3 text-xs space-y-1">
              <div class="font-medium text-sage">✓ File Backup Valid & Siap Dipulihkan</div>
              <div id="restore-preview-stats" class="text-ink"></div>
            </div>

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-medium">Batal</button>
              <button type="button" id="btn-confirm-restore" onclick="executeRestoreData()" disabled
                class="flex-1 py-3 rounded-2xl bg-ink disabled:bg-stone-300 text-white text-xs font-medium shadow-md transition-colors">
                Pulihkan Sekarang
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function validateAndParseBackup(rawText) {
      const parsed = JSON.parse(rawText);
      const candidate = parsed.data ? parsed.data : parsed;
      if (!candidate || !Array.isArray(candidate.accounts) || !Array.isArray(candidate.categories)) {
        throw new Error('Struktur JSON tidak sesuai');
      }
      const def = getDefaultData();
      return {
        security: candidate.security || db.security || def.security,
        exchangeRates: { ...def.exchangeRates, ...(candidate.exchangeRates || {}) },
        exchangeRateMeta: candidate.exchangeRateMeta || def.exchangeRateMeta,
        categories: candidate.categories,
        accounts: candidate.accounts,
        transactions: Array.isArray(candidate.transactions) ? candidate.transactions : [],
        debts: Array.isArray(candidate.debts) ? candidate.debts : [],
        savingsGoals: Array.isArray(candidate.savingsGoals) ? candidate.savingsGoals : []
      };
    }

    function showRestorePreview(validDb) {
      ui.pendingRestoreData = validDb;
      const box = document.getElementById('restore-preview-box');
      const stats = document.getElementById('restore-preview-stats');
      const btn = document.getElementById('btn-confirm-restore');
      if (box && stats && btn) {
        box.classList.remove('hidden');
        stats.innerHTML = `
          • ${validDb.accounts.length} Akun & ${validDb.transactions.length} Transaksi<br/>
          • ${validDb.categories.length} Kategori, ${validDb.savingsGoals.length} Target Tabungan, ${validDb.debts.length} Catatan Hutang
        `;
        btn.disabled = false;
      }
    }

    function handleRestoreFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const text = ev.target.result;
          const ta = document.getElementById('restore-json-text');
          if (ta) ta.value = text;
          const validDb = validateAndParseBackup(text);
          showRestorePreview(validDb);
        } catch (err) {
          ui.pendingRestoreData = null;
          showToast('Format file JSON tidak valid', 'error');
        }
      };
      reader.readAsText(file);
    }

    function previewRestoreFromText(text) {
      if (!text.trim()) {
        ui.pendingRestoreData = null;
        document.getElementById('restore-preview-box')?.classList.add('hidden');
        const btn = document.getElementById('btn-confirm-restore');
        if (btn) btn.disabled = true;
        return;
      }
      try {
        const validDb = validateAndParseBackup(text);
        showRestorePreview(validDb);
      } catch (err) {
        ui.pendingRestoreData = null;
        document.getElementById('restore-preview-box')?.classList.add('hidden');
        const btn = document.getElementById('btn-confirm-restore');
        if (btn) btn.disabled = true;
      }
    }

    function executeRestoreData() {
      if (!ui.pendingRestoreData) return;
      db = ui.pendingRestoreData;
      ui.pendingRestoreData = null;
      saveData();
      closeModal();
      showToast('Data berhasil dipulihkan dari backup!');
      render();
    }

    // =========================================================================
    // 11. MAIN RENDER LOOP
    // =========================================================================
    function render() {
      renderBottomNav();
      const mainEl = document.getElementById('main-content');

      switch (ui.activeTab) {
        case 'transaksi':
          mainEl.innerHTML = renderTransaksiView();
          break;
        case 'statistik':
          mainEl.innerHTML = renderStatistikView();
          break;
        case 'akun':
          mainEl.innerHTML = renderAkunView();
          break;
        case 'tabungan':
          mainEl.innerHTML = renderTabunganView();
          break;
        case 'hutang':
          mainEl.innerHTML = renderHutangView();
          break;
        case 'pengaturan':
          mainEl.innerHTML = renderPengaturanView();
          break;
        default:
          mainEl.innerHTML = renderAkunView();
      }
      updateLockScreenVisibility();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPWAAssets();
      render();
      updateLockScreenVisibility();
      fetchLiveExchangeRates(true);
    });
  </script>
</body>
</html>
