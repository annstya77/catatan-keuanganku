    * {

    }
    body {
      background-color: #EFECE6;
      color: #1A2433;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(26, 36, 51, 0.15);
      border-radius: 999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>

    function loadData() {

        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.accounts && parsed.categories) {
            const def = getDefaultData();
            if (!parsed.savingsGoals) parsed.savingsGoals = def.savingsGoals;
            if (!parsed.exchangeRateMeta) parsed.exchangeRateMeta = def.exchangeRateMeta;
            parsed.exchangeRates = { ...def.exchangeRates, ...(parsed.exchangeRates || {}) };
            return parsed;
          }
        }
      } catch (e) {
        console.error('Gagal memuat data:', e);
      }
      const def = getDefaultData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(def));
      return def;

    // =========================================================================
    // LIVE EXCHANGE RATE DARI INTERNET (OPEN.ER-API / EXCHANGERATE-API)
    // =========================================================================
    async function fetchLiveExchangeRates(silent = false) {
      if (isFetchingRates) return;
      isFetchingRates = true;
      if (!silent) render();

      const endpoints = [
        'https://open.er-api.com/v6/latest/IDR',
        'https://api.exchangerate-api.com/v4/latest/IDR'
      ];

      let success = false;
      for (const url of endpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 7000);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) continue;
          const data = await res.json();
          if (data && data.rates) {
            Object.keys(CURRENCY_META).forEach(code => {
              if (code === 'IDR') {
                db.exchangeRates.IDR = 1;
              } else if (data.rates[code] && data.rates[code] > 0) {
                const idrPerUnit = 1 / Number(data.rates[code]);
                db.exchangeRates[code] = idrPerUnit >= 100
                  ? Math.round(idrPerUnit)
                  : Number(idrPerUnit.toFixed(2));
              }
            });
            db.exchangeRateMeta = {
              source: 'live',
              lastUpdated: new Date().toLocaleString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })
            };
            saveData();
            success = true;
            break;
          }
        } catch (err) {
          // Lanjut ke endpoint cadangan
        }
      }

      isFetchingRates = false;
      if (success) {
        if (!silent) showToast('Kurs mata uang asing berhasil diperbarui dari internet');
      } else {
        if (!db.exchangeRateMeta) db.exchangeRateMeta = { source: 'offline', lastUpdated: null };
        db.exchangeRateMeta.source = 'offline';
        saveData();
        if (!silent) showToast('Gagal terhubung ke server kurs, menggunakan kurs tersimpan', 'error');
      }
      render();
    }

    // =========================================================================
    // 3. HELPER FORMATTER & KALKULASI
    // =========================================================================
    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || CURRENCY_META.IDR;
      const isNeg = amount < 0;
      const absVal = Math.abs(Number(amount) || 0);
      const formatted = absVal.toLocaleString('id-ID', {
        minimumFractionDigits: meta.decimals,
        maximumFractionDigits: meta.decimals
      });
      return `${isNeg ? '-' : ''}${meta.symbol} ${formatted}`;
    }

    function formatShortRupiah(amount) {
      const abs = Math.abs(amount);
      if (abs >= 1000000) {
        return (amount / 1000000).toFixed(1).replace(/\.0$/, '') + 'jt';
      }
      if (abs >= 1000) {
        return Math.round(amount / 1000) + 'k';
      }
      return amount.toString();
    }

    function toIDR(amount, currency) {
      const rate = db.exchangeRates[currency] || 1;
      return Math.round((Number(amount) || 0) * rate);
    }

    function getAccountTotalBalance(account) {
      if (!account || !account.pockets) return 0;
      return account.pockets.reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    function getTotalNetWorthIDR() {
      return db.accounts.reduce((sum, acc) => {
        const accBal = getAccountTotalBalance(acc);
        return sum + toIDR(accBal, acc.currency);
      }, 0);
    }

    function getColorObj(colorId) {
      return ACCOUNT_COLORS.find(c => c.id === colorId) || ACCOUNT_COLORS[0];
    }

    function getCategoryLimit(cat) {
      if (!cat) return 0;
      if (cat.subcategories && cat.subcategories.length > 0) {
        const subTotal = cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
        // Jika subkategori memiliki limit (> 0), total limit kategori adalah penjumlahan subkategori.
        // Jika semua subkategori limitnya 0 namun kategori induk memiliki directLimit, gunakan directLimit.
        return subTotal > 0 ? subTotal : (Number(cat.directLimit) || 0);
      }
      return Number(cat.directLimit) || 0;
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const iconEl = document.getElementById('toast-icon');
      const msgEl = document.getElementById('toast-msg');
      iconEl.innerHTML = type === 'error'
        ? `<span class="w-2 h-2 rounded-full bg-coral inline-block"></span>`
        : `<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>`;
      msgEl.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    function shiftPeriod(target, delta) {
      if (target === 'stat') {
        if (ui.statPeriodMode === 'yearly') {
          ui.statYear += delta;
        } else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear--; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear++; }
        }
      } else if (target === 'akun') {
        if (ui.akunPeriodMode === 'yearly') {
          ui.akunYear += delta;
        } else {
          ui.akunMonth += delta;
          if (ui.akunMonth < 0) { ui.akunMonth = 11; ui.akunYear--; }
          if (ui.akunMonth > 11) { ui.akunMonth = 0; ui.akunYear++; }
        }
      }
      render();
    }

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(tx => {
        if (!tx.date) return false;
        const [y, m] = tx.date.split('-').map(Number);
        if (mode === 'yearly') {
          return y === year;
        }
        return y === year && (m - 1) === month;
      });
    }

    function renderBudgetEvaluationSection() {
      const expenseCats = db.categories.filter(c => c.type === 'expense');
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense');

      const multiplier = ui.statPeriodMode === 'yearly' ? 12 : 1;

      let totalBudgetAll = 0;
      let totalSpentAll = 0;

      const cardsData = expenseCats.map(cat => {
        const monthlyLimit = getCategoryLimit(cat);
        const totalLimit = monthlyLimit * multiplier;
        const catTxs = periodTxs.filter(t => t.categoryId === cat.id);
        const spent = catTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);

        totalBudgetAll += totalLimit;
        totalSpentAll += spent;

        const subItems = (cat.subcategories || []).map(sub => {
          const subLimit = (Number(sub.limit) || 0) * multiplier;
          const subSpent = catTxs
            .filter(t => t.subcategoryId === sub.id)
            .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
          const subPct = subLimit > 0 ? Math.round((subSpent / subLimit) * 100) : (subSpent > 0 ? 100 : 0);
          return { ...sub, limit: subLimit, spent: subSpent, pct: subPct };
        });

        const pct = totalLimit > 0 ? Math.round((spent / totalLimit) * 100) : (spent > 0 ? 100 : 0);
        return { cat, totalLimit, spent, pct, subItems };
      });

    function buildCategoryTrendPoints(catId, subFilterId) {
      const points = [];
      if (ui.statPeriodMode === 'yearly') {
        for (let offset = 4; offset >= 0; offset--) {
          const y = ui.statYear - offset;
          const total = db.transactions
            .filter(t => t.type === 'expense' && t.categoryId === catId)
            .filter(t => {
              if (subFilterId === 'ALL') return true;
              if (subFilterId === 'NONE') return !t.subcategoryId;
              return t.subcategoryId === subFilterId;
            })
            .filter(t => Number(t.date.split('-')[0]) === y)
            .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
          points.push({ label: String(y), value: total });
        }
      } else {
        // 8 bulan terakhir sampai ui.statMonth / ui.statYear (misal Apr - Nov)
        for (let offset = 7; offset >= 0; offset--) {
          let m = ui.statMonth - offset;
          let y = ui.statYear;
          while (m < 0) { m += 12; y--; }
          const total = db.transactions
            .filter(t => t.type === 'expense' && t.categoryId === catId)
            .filter(t => {
              if (subFilterId === 'ALL') return true;
              if (subFilterId === 'NONE') return !t.subcategoryId;
              return t.subcategoryId === subFilterId;
            })
            .filter(t => {
              const [ty, tm] = t.date.split('-').map(Number);
              return ty === y && (tm - 1) === m;
            })
            .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
          points.push({ label: MONTH_NAMES_ID[m], value: total });
        }
      }
      return points;
    }

    function renderTrendLineChartSVG(points) {
      const width = 360;
      const height = 165;
      const padLeft = 44;
      const padRight = 14;
      const padTop = 16;
      const padBottom = 26;
      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const rawMax = Math.max(...points.map(p => p.value), 100000);
      // Bulatkan skala atas agar bersih (kelipatan 500k atau 100k)
      const stepUnit = rawMax > 1000000 ? 500000 : rawMax > 200000 ? 100000 : 50000;
      const maxVal = Math.ceil(rawMax / stepUnit) * stepUnit;
      const midVal = maxVal / 2;

      const coords = points.map((p, i) => {
        const x = padLeft + (points.length > 1 ? (i / (points.length - 1)) * chartW : chartW / 2);
        const y = padTop + chartH - (p.value / maxVal) * chartH;
        return { x, y, label: p.label, value: p.value };
      });

      const polyPoints = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-auto overflow-visible select-none">
          <!-- Grid Horizontal -->
          <line x1="${padLeft}" y1="${padTop}" x2="${width - padRight}" y2="${padTop}" stroke="#E5E7EB" stroke-width="1" />
          <line x1="${padLeft}" y1="${padTop + chartH / 2}" x2="${width - padRight}" y2="${padTop + chartH / 2}" stroke="#E5E7EB" stroke-width="1" />
          <line x1="${padLeft}" y1="${padTop + chartH}" x2="${width - padRight}" y2="${padTop + chartH}" stroke="#D1D5DB" stroke-width="1" />
          <line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${padTop + chartH}" stroke="#D1D5DB" stroke-width="1" />

          <!-- Y Axis Labels -->
          <text x="${padLeft - 6}" y="${padTop + 4}" text-anchor="end" fill="#9CA3AF" font-size="9.5" font-weight="600">${formatShortRupiah(maxVal)}</text>
          <text x="${padLeft - 6}" y="${padTop + chartH / 2 + 3}" text-anchor="end" fill="#9CA3AF" font-size="9.5" font-weight="600">${formatShortRupiah(midVal)}</text>
          <text x="${padLeft - 6}" y="${padTop + chartH + 3}" text-anchor="end" fill="#9CA3AF" font-size="9.5" font-weight="600">0</text>

          <!-- Line Path -->
          <polyline fill="none" stroke="#EF5350" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polyPoints}" />

          <!-- Data Dots & X Axis Labels -->
          ${coords.map((c, idx) => `
            <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="#EF5350" stroke="#FFFFFF" stroke-width="1.5" />
            <text x="${c.x.toFixed(1)}" y="${height - 6}" text-anchor="middle" fill="${idx === coords.length - 1 ? '#1A2433' : '#9CA3AF'}" font-size="10" font-weight="${idx === coords.length - 1 ? '700' : '500'}">
              ${c.label}
            </text>
          `).join('')}
        </svg>
      `;
    }

    function groupTransactionsByDate(txs) {
      const sorted = [...txs].sort((a, b) => b.date.localeCompare(a.date));
      const map = new Map();

      sorted.forEach(tx => {
        if (!map.has(tx.date)) {
          const [y, m, d] = tx.date.split('-').map(Number);
          const dt = new Date(y, m - 1, d);
          map.set(tx.date, {
            date: tx.date,
            dayNum: String(d).padStart(2, '0'),
            dayName: DAY_NAMES_ID[dt.getDay()],
            monthYear: `${String(m).padStart(2, '0')}.${y}`,
            dayTotal: 0,
            items: []
          });
        }
        const g = map.get(tx.date);
        g.dayTotal += toIDR(tx.amount, getTxCurrency(tx));
        g.items.push(tx);
      });

      return Array.from(map.values());
    }

                  <!-- Header Akun -->
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shadow-sm shrink-0" style="background-color: ${color.hex};">
                        ${iconSvg}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                          <h3 class="text-base font-extrabold text-ink truncate">${acc.name}</h3>
                          <span class="px-1.5 py-0.5 rounded-md text-[10px] font-extrabold bg-white/80 text-ink border border-black/5">
                            ${acc.currency}
                          </span>
                        </div>
                        <div class="mt-0.5">
                          <span class="text-base font-extrabold" style="color: ${color.text};">
                            ${formatCurrency(totalAccBal, acc.currency)}
                          </span>
                          ${isForeign ? `
                            <span class="block text-xs font-semibold text-slate-600">
                              (${formatCurrency(convertedIDR, 'IDR')})
                            </span>
                            <span class="inline-block text-[10px] font-medium text-slate-500 bg-white/70 px-1.5 py-0.5 rounded mt-0.5">
                              1 ${acc.currency} = ${formatCurrency(db.exchangeRates[acc.currency] || 0, 'IDR')}
                            </span>
                          ` : ''}
                        </div>
                      </div>
                    </div>

                    <!-- Tombol Edit Akun & Tambah Pocket -->
                    <div class="flex items-center gap-1 shrink-0">
                      <button onclick="openPocketModal('${acc.id}')" title="Tambah Pocket"
                        class="px-2.5 py-1.5 rounded-xl bg-white/90 hover:bg-white text-xs font-bold text-ink shadow-xs border border-black/5">
                        + Pocket
                      </button>
                      <button onclick="openAccountModal('${acc.id}')" title="Edit Akun"
                        class="p-2 rounded-xl bg-white/90 hover:bg-white text-slate-600 shadow-xs border border-black/5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                      </button>
                    </div>
                  </div>

                  <!-- Daftar Pocket di Dalam Akun -->
                  <div class="mt-3.5 space-y-2">
                    ${(acc.pockets || []).map(pkt => {
                      const pktIDR = toIDR(pkt.balance, acc.currency);
                      // Hitung arus kas pocket pada periode terpilih
                      const pktTxs = periodTxs.filter(t =>
                        (t.accountId === acc.id && t.pocketId === pkt.id) ||
                        (t.type === 'transfer' && t.toAccountId === acc.id && t.toPocketId === pkt.id)
                      );
                      return `
                        <div class="bg-white/95 hover:bg-white rounded-2xl p-3 border border-black/5 flex items-center justify-between gap-2 shadow-2xs transition-all">
                          <!-- Klik Pocket untuk Detail Bulanan, Transaksi & Transfer -->
                          <button onclick="openPocketDetail('${acc.id}', '${pkt.id}')" class="flex-1 text-left min-w-0 group">
                            <div class="flex items-center gap-1.5">
                              <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${color.hex};"></span>
                              <span class="text-sm font-bold text-ink group-hover:underline truncate">${pkt.name}</span>
                              <span class="text-[10px] text-slate-400">(${pktTxs.length} tx)</span>
                            </div>
                            <div class="mt-0.5 pl-3.5">
                              <span class="text-sm font-extrabold text-ink">${formatCurrency(pkt.balance, acc.currency)}</span>
                              ${isForeign ? `
                                <span class="text-[11px] font-medium text-slate-500 ml-1">(${formatCurrency(pktIDR, 'IDR')})</span>
                              ` : ''}
                            </div>
                          </button>

                          <!-- Tombol Edit Saldo Pocket Langsung -->
                          <div class="flex items-center gap-1 shrink-0">
                            <button onclick="openPocketModal('${acc.id}', '${pkt.id}')" title="Edit Pocket"
                              class="px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-[11px] font-bold text-slate-700">
                              Edit
                            </button>
                            <button onclick="openPocketDetail('${acc.id}', '${pkt.id}')" title="Detail Pocket"
                              class="p-1.5 rounded-xl hover:bg-stone-100 text-slate-400">
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                            </button>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setAkunPeriodMode(mode) {
      ui.akunPeriodMode = mode;
      render();
    }

    function openPocketDetail(accountId, pocketId) {
      ui.selectedPocketDetail = { accountId, pocketId };
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePocketDetail() {
      ui.selectedPocketDetail = null;
      render();
    }

    // -------------------------------------------------------------------------
    // 6B. DETAIL POCKET (RINCIAN NOMINAL PER BULAN, TRANSAKSI, TRANSFER & TAMBAH)
    // -------------------------------------------------------------------------
    function renderPocketDetailView() {
      const { accountId, pocketId } = ui.selectedPocketDetail;
      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);

      if (!acc || !pkt) {
        ui.selectedPocketDetail = null;
        return renderAkunView();
      }

      const color = getColorObj(acc.colorId);
      const isForeign = acc.currency !== 'IDR';

      // Semua transaksi yang melibatkan pocket ini
      const relatedTxs = db.transactions.filter(t =>
        (t.accountId === accountId && t.pocketId === pocketId) ||
        (t.type === 'transfer' && t.toAccountId === accountId && t.toPocketId === pocketId)
      ).sort((a, b) => b.date.localeCompare(a.date));

      // Rincian Nominal per Bulan (6 bulan terakhir)
      const monthlySummaries = [];
      for (let i = 0; i < 6; i++) {
        let m = ui.akunMonth - i;
        let y = ui.akunYear;
        while (m < 0) { m += 12; y--; }

        let masuk = 0;
        let keluar = 0;

        relatedTxs.forEach(t => {
          const [ty, tm] = t.date.split('-').map(Number);
          if (ty === y && (tm - 1) === m) {
            if (t.type === 'income') {
              masuk += Number(t.amount) || 0;
            } else if (t.type === 'expense') {
              keluar += Number(t.amount) || 0;
            } else if (t.type === 'transfer') {
              if (t.accountId === accountId && t.pocketId === pocketId) {
                keluar += Number(t.amount) || 0;
              }
              if (t.toAccountId === accountId && t.toPocketId === pocketId) {
                masuk += Number(t.amount) || 0;
              }
            }
          }
        });

        monthlySummaries.push({
          label: `${MONTH_NAMES_ID[m]} ${y}`,
          masuk,
          keluar,
          net: masuk - keluar
        });
      }

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">
          <!-- Header -->
          <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <button onclick="closePocketDetail()" class="p-1.5 -ml-1.5 rounded-xl hover:bg-stone-100 text-ink">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              </button>
              <div class="truncate">
                <div class="text-[11px] font-bold uppercase tracking-wider" style="color: ${color.hex};">${acc.name}</div>
                <h1 class="text-base font-extrabold text-ink truncate">${pkt.name}</h1>
              </div>
            </div>
            <button onclick="openPocketModal('${acc.id}', '${pkt.id}')" class="px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-xs font-bold text-ink">
              Edit Pocket
            </button>
          </div>

          <div class="p-4 space-y-4">
            <!-- Kartu Saldo Pocket & Tombol Tambah Transaksi / Transfer -->
            <div class="rounded-3xl p-5 text-white shadow-md" style="background-color: ${color.hex};">
              <span class="text-xs font-semibold text-white/80">Saldo Pocket Saat Ini</span>
              <div class="text-3xl font-extrabold mt-1">
                ${formatCurrency(pkt.balance, acc.currency)}
              </div>
              ${isForeign ? `
                <div class="text-xs font-semibold text-white/90 mt-0.5">
                  (${formatCurrency(toIDR(pkt.balance, acc.currency), 'IDR')})
                </div>
              ` : ''}

              <div class="grid grid-cols-2 gap-2.5 mt-4 pt-3 border-t border-white/20">
                <button onclick="openTxModal({ defaultType: 'expense', accountId: '${acc.id}', pocketId: '${pkt.id}' })"
                  class="py-2.5 px-3 rounded-2xl bg-white text-ink text-xs font-extrabold shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center gap-1.5">
                  <span>+ Transaksi</span>
                </button>
                <button onclick="openTxModal({ defaultType: 'transfer', accountId: '${acc.id}', pocketId: '${pkt.id}' })"
                  class="py-2.5 px-3 rounded-2xl bg-black/25 text-white text-xs font-extrabold hover:bg-black/35 active:scale-95 transition-all flex items-center justify-center gap-1.5">
                  <span>⇄ Transfer</span>
                </button>
              </div>
            </div>

            <!-- Rincian Nominal Per Bulan -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <h2 class="text-sm font-extrabold text-ink mb-3">Rincian Nominal Per Bulan</h2>
              <div class="divide-y divide-stone-100">
                ${monthlySummaries.map(ms => `
                  <div class="py-2.5 flex items-center justify-between text-xs">
                    <span class="font-bold text-ink w-20">${ms.label}</span>
                    <div class="flex items-center gap-3">
                      <span class="text-sage font-semibold">+${formatCurrency(ms.masuk, acc.currency)}</span>
                      <span class="text-coral font-semibold">-${formatCurrency(ms.keluar, acc.currency)}</span>
                    </div>
                    <span class="font-extrabold ${ms.net >= 0 ? 'text-ink' : 'text-coral'}">
                      ${ms.net >= 0 ? '+' : ''}${formatCurrency(ms.net, acc.currency)}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Riwayat Transaksi & Transfer pada Pocket Ini -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <h2 class="text-sm font-extrabold text-ink mb-3">Riwayat Transaksi & Transfer (${relatedTxs.length})</h2>
              ${relatedTxs.length === 0 ? `
                <div class="py-8 text-center text-xs text-slate-400">Belum ada transaksi di pocket ini.</div>
              ` : `
                <div class="divide-y divide-stone-100">
                  ${relatedTxs.map(tx => renderTransactionRow(tx, { accountId, pocketId })).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 7. VIEW 3: TRANSAKSI (RIWAYAT LENGKAP & PENCARIAN)
    // =========================================================================
    function renderTransaksiView() {
      const filtered = db.transactions
        .filter(t => {
          if (ui.txTypeFilter !== 'all' && t.type !== ui.txTypeFilter) return false;
          if (ui.txSearch.trim()) {
            const q = ui.txSearch.toLowerCase();
            const cat = db.categories.find(c => c.id === t.categoryId);
            const matchTitle = (t.title || '').toLowerCase().includes(q);
            const matchCat = (cat?.name || '').toLowerCase().includes(q);
            return matchTitle || matchCat;
          }
          return true;
        })
        .sort((a, b) => b.date.localeCompare(a.date));

      return `
        <div class="p-4 space-y-4">
          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-xl font-extrabold text-ink tracking-tight">Riwayat Transaksi</h1>
                <p class="text-xs text-slate-500">Semua pemasukan, pengeluaran & transfer</p>
              </div>
              <button onclick="openTxModal()" class="px-3.5 py-2 rounded-2xl bg-coral text-white text-xs font-bold shadow-sm hover:opacity-95">
                + Catat
              </button>
            </div>

            <!-- Search & Type Filter -->
            <input type="text" value="${ui.txSearch}" oninput="updateTxSearch(this.value)"
              placeholder="Cari judul transaksi atau kategori..."
              class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200/80 text-xs font-medium focus:outline-none focus:border-ink" />

            <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
              ${[
                { id: 'all', label: 'Semua' },
                { id: 'expense', label: 'Pengeluaran' },
                { id: 'income', label: 'Pemasukan' },
                { id: 'transfer', label: 'Transfer' }
              ].map(f => `
                <button onclick="setTxTypeFilter('${f.id}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${ui.txTypeFilter === f.id ? 'bg-ink text-white' : 'bg-stone-100 text-slate-600'}">
                  ${f.label}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
            ${filtered.length === 0 ? `
              <div class="py-10 text-center text-xs text-slate-400">Tidak ada transaksi ditemukan.</div>
            ` : `
              <div class="divide-y divide-stone-100">
                ${filtered.map(tx => renderTransactionRow(tx)).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function updateTxSearch(val) {
      ui.txSearch = val;
      render();
    }

    function setTxTypeFilter(val) {
      ui.txTypeFilter = val;
      render();
    }

    function getTxCurrency(tx) {
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc ? acc.currency : 'IDR';
    }

    function renderTransactionRow(tx, contextPocket = null) {
      const acc = db.accounts.find(a => a.id === tx.accountId);
      const pkt = acc?.pockets?.find(p => p.id === tx.pocketId);
      const cur = acc ? acc.currency : 'IDR';

      if (tx.type === 'transfer') {
        const toAcc = db.accounts.find(a => a.id === tx.toAccountId);
        const toPkt = toAcc?.pockets?.find(p => p.id === tx.toPocketId);
        const isIncomingToPocket = contextPocket && tx.toAccountId === contextPocket.accountId && tx.toPocketId === contextPocket.pocketId;

        return `
          <div class="py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0">
                ⇄
              </div>
              <div class="min-w-0">
                <div class="text-sm font-bold text-ink truncate">${tx.title || 'Transfer Saldo'}</div>
                <div class="text-[11px] text-slate-400 truncate">
                  ${pkt?.name || acc?.name || '-'} → ${toPkt?.name || toAcc?.name || '-'} • ${tx.date}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-sm font-extrabold ${isIncomingToPocket ? 'text-sage' : 'text-blue-600'}">
                ${isIncomingToPocket ? '+' : ''}${formatCurrency(tx.amount, cur)}
              </span>
              <button onclick="deleteTransaction('${tx.id}')" title="Hapus" class="text-slate-300 hover:text-coral p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>
        `;
      }

      const cat = db.categories.find(c => c.id === tx.categoryId);
      const sub = cat?.subcategories?.find(s => s.id === tx.subcategoryId);
      const isIncome = tx.type === 'income';

      return `
        <div class="py-3 flex items-center justify-between gap-2">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-9 h-9 rounded-2xl ${isIncome ? 'bg-sageLight text-sage' : 'bg-coralLight text-coral'} flex items-center justify-center font-extrabold text-xs shrink-0">
              ${isIncome ? '↓' : '↑'}
            </div>
            <div class="min-w-0">
              <div class="text-sm font-bold text-ink truncate">${tx.title || cat?.name || 'Transaksi'}</div>
              <div class="text-[11px] text-slate-400 truncate">
                ${cat?.name || 'Umum'}${sub ? ` (${sub.name})` : ''} • ${pkt?.name || acc?.name || '-'} • ${tx.date}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-sm font-extrabold ${isIncome ? 'text-sage' : 'text-coral'}">
              ${isIncome ? '+' : '-'}${formatCurrency(tx.amount, cur)}
            </span>
            <button onclick="deleteTransaction('${tx.id}')" title="Hapus" class="text-slate-300 hover:text-coral p-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. VIEW 4: HUTANG & PIUTANG (TERINTEGRASI LANGSUNG KE SALDO AKUN)
    // =========================================================================
    function renderHutangView() {
      const totalPayable = db.debts
        .filter(d => d.type === 'payable')
        .reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);

      const totalReceivable = db.debts
        .filter(d => d.type === 'receivable')
        .reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);

      const list = db.debts.filter(d => {
        if (ui.debtFilter === 'all') return true;
        return d.type === ui.debtFilter;
      });

      return `
        <div class="p-4 space-y-4">
          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-xl font-extrabold text-ink tracking-tight">Hutang & Piutang</h1>
                <p class="text-xs text-slate-500">Otomatis menambah/mengurangi saldo akun terkait</p>
              </div>
              <button onclick="openDebtModal()" class="px-3.5 py-2 rounded-2xl bg-ink text-white text-xs font-bold shadow-sm hover:bg-slate-800">
                + Catat
              </button>
            </div>

            <!-- Ringkasan Hutang & Piutang -->
            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <div class="bg-coralLight rounded-2xl p-3 border border-coral/20">
                <span class="text-[11px] font-bold text-coral">Sisa Hutang Saya</span>
                <div class="text-base font-extrabold text-ink mt-0.5">${formatCurrency(totalPayable)}</div>
                <span class="text-[10px] text-slate-500">Wajib dibayar</span>
              </div>
              <div class="bg-sageLight rounded-2xl p-3 border border-sage/20">
                <span class="text-[11px] font-bold text-sage">Sisa Piutang Orang</span>
                <div class="text-base font-extrabold text-ink mt-0.5">${formatCurrency(totalReceivable)}</div>
                <span class="text-[10px] text-slate-500">Akan diterima</span>
              </div>
            </div>

            <!-- Filter Tab -->
            <div class="flex gap-1.5 pt-1">
              ${[
                { id: 'all', label: 'Semua' },
                { id: 'payable', label: 'Hutang Saya' },
                { id: 'receivable', label: 'Piutang (Pinjaman)' }
              ].map(t => `
                <button onclick="setDebtFilter('${t.id}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold ${ui.debtFilter === t.id ? 'bg-ink text-white' : 'bg-stone-100 text-slate-600'}">
                  ${t.label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Daftar Kartu Hutang / Piutang -->
          <div class="space-y-3">
            ${list.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center text-xs text-slate-400 border border-stone-200/70">
                Belum ada catatan hutang atau piutang.
              </div>
            ` : list.map(d => {
              const remaining = Math.max(0, d.totalAmount - d.paidAmount);
              const pct = d.totalAmount > 0 ? Math.min(100, Math.round((d.paidAmount / d.totalAmount) * 100)) : 100;
              const isPaidOff = remaining === 0;
              const isPayable = d.type === 'payable';
              const acc = db.accounts.find(a => a.id === d.accountId);
              const pkt = acc?.pockets?.find(p => p.id === d.pocketId);

              return `
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${isPayable ? 'bg-coralLight text-coral' : 'bg-sageLight text-sage'}">
                        ${isPayable ? 'HUTANG SAYA' : 'PIUTANG'}
                      </span>
                      <h3 class="text-base font-extrabold text-ink mt-1">${d.person}</h3>
                      <p class="text-xs text-slate-500">${d.note || 'Tanpa catatan'} • Jatuh tempo: ${d.dueDate || '-'}</p>
                      <p class="text-[11px] text-slate-400 mt-0.5">Akun: ${acc?.name || '-'} (${pkt?.name || '-'})</p>
                    </div>
                    <div class="text-right">
                      <div class="text-[11px] text-slate-400">Sisa</div>
                      <div class="text-base font-extrabold ${isPaidOff ? 'text-sage' : (isPayable ? 'text-coral' : 'text-ink')}">
                        ${isPaidOff ? 'LUNAS' : formatCurrency(remaining)}
                      </div>
                      <div class="text-[11px] text-slate-400">dari ${formatCurrency(d.totalAmount)}</div>
                    </div>
                  </div>

                  <div class="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
                    <div class="h-full ${isPayable ? 'bg-coral' : 'bg-sage'} rounded-full" style="width: ${pct}%"></div>
                  </div>

                  <div class="flex items-center justify-between pt-1">

    // =========================================================================
    // 8B. VIEW TABUNGAN (TARGET CELENGAN NON-BABI, SETOR, TARIK & RIWAYAT)
    // =========================================================================
    function renderTabunganView() {
      if (ui.selectedSavingGoalId) {
        return renderSavingGoalDetailView();
      }

      const goals = db.savingsGoals || [];
      const totalSaved = goals.reduce((s, g) => s + (Number(g.currentAmount) || 0), 0);
      const totalTarget = goals.reduce((s, g) => s + (Number(g.targetAmount) || 0), 0);
      const overallPct = totalTarget > 0 ? Math.min(100, Math.round((totalSaved / totalTarget) * 100)) : 0;

      return `
        <div class="p-4 space-y-4">
          <!-- Header Tabungan -->
          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-sageLight text-sage flex items-center justify-center shrink-0">
                ${ICONS.celengan}
              </div>
              <div>
                <h1 class="text-xl font-extrabold text-ink tracking-tight">Tabungan</h1>
                <p class="text-xs text-slate-500">Celengan target impian & dana masa depan</p>
              </div>
            </div>
            <button onclick="openSavingGoalModal()" class="px-3.5 py-2 rounded-2xl bg-sage text-white text-xs font-bold shadow-sm hover:opacity-95 active:scale-95 transition-all shrink-0">
              + Target
            </button>
          </div>

          <!-- Kartu Ringkasan Total Tabungan -->
          <div class="bg-gradient-to-br from-sage via-emerald-700 to-teal-800 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 rounded-full bg-white/10 pointer-events-none"></div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-emerald-100">Total Tabungan Terkumpul</span>
              <span class="px-2.5 py-0.5 rounded-full bg-white/20 text-[11px] font-extrabold">${overallPct}% dari Target</span>
            </div>
            <div class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-1">
              ${formatCurrency(totalSaved)}
            </div>
            <div class="text-xs text-emerald-100 mt-1">
              Target Keseluruhan: <strong class="text-white">${formatCurrency(totalTarget)}</strong> (${goals.length} celengan)
            </div>
            <div class="w-full h-2 bg-black/20 rounded-full overflow-hidden mt-3">
              <div class="h-full bg-white rounded-full transition-all duration-300" style="width: ${overallPct}%"></div>
            </div>
          </div>

          <!-- Daftar Target Tabungan -->
          <div class="space-y-3.5">
            ${goals.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center border border-stone-200/70 space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-creamCard text-sage mx-auto flex items-center justify-center">
                  ${ICONS.celengan}
                </div>
                <div class="text-sm font-bold text-ink">Belum ada celengan tabungan</div>
                <p class="text-xs text-slate-400">Buat target tabungan pertamamu dan mulai sisihkan dana dari akun.</p>
              </div>
            ` : goals.map(g => {
              const color = getColorObj(g.colorId || 'emerald');
              const iconSvg = ICONS[g.icon] || ICONS.celengan;
              const pct = g.targetAmount > 0 ? Math.min(100, Math.round((g.currentAmount / g.targetAmount) * 100)) : 0;
              const remaining = Math.max(0, g.targetAmount - g.currentAmount);
              const isCompleted = g.currentAmount >= g.targetAmount && g.targetAmount > 0;

              return `
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-3 transition-all">
                  <div class="flex items-start justify-between gap-2">
                    <button onclick="openSavingGoalDetail('${g.id}')" class="flex items-center gap-3 text-left min-w-0 flex-1 group">
                      <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shrink-0 shadow-xs" style="background-color: ${color.hex};">
                        ${iconSvg}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                          <h3 class="text-base font-extrabold text-ink group-hover:underline truncate">${g.name}</h3>
                          ${isCompleted ? `<span class="px-2 py-0.5 rounded-full bg-sageLight text-sage text-[10px] font-extrabold">TERCAPAI</span>` : ''}
                        </div>
                        <p class="text-[11px] text-slate-400 truncate">${g.note || 'Tabungan target'} • Tenggat: ${g.deadline || '-'}</p>
                      </div>
                    </button>

                    <button onclick="openSavingGoalModal('${g.id}')" title="Edit Target"
                      class="p-2 rounded-xl bg-creamCard hover:bg-stone-200/70 text-slate-600 shrink-0">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                    </button>
                  </div>

                  <!-- Progress Nominal -->
                  <div>
                    <div class="flex items-baseline justify-between text-xs mb-1.5">
                      <div>
                        <span class="text-sm font-extrabold" style="color: ${color.hex};">${formatCurrency(g.currentAmount)}</span>
                        <span class="text-slate-400"> / ${formatCurrency(g.targetAmount)}</span>
                      </div>
                      <span class="font-extrabold text-ink">${pct}%</span>
                    </div>
                    <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden">
                      <div class="h-full rounded-full transition-all duration-300" style="width: ${pct}%; background-color: ${color.hex};"></div>
                    </div>
                    <div class="text-[11px] text-slate-400 mt-1">
                      ${isCompleted ? 'Target tabungan sudah terpenuhi!' : `Kurang ${formatCurrency(remaining)} lagi`}

                  </div>

                  <!-- Tombol Aksi Setor, Tarik & Riwayat -->
                  <div class="grid grid-cols-3 gap-2 pt-1">
                    <button onclick="openSavingTransferModal('${g.id}', 'deposit')"
                      class="py-2 px-2.5 rounded-2xl text-white text-xs font-extrabold shadow-xs hover:opacity-95 active:scale-95 transition-all"
                      style="background-color: ${color.hex};">
                      + Setor
                    </button>
                    <button onclick="openSavingTransferModal('${g.id}', 'withdraw')"
                      class="py-2 px-2.5 rounded-2xl bg-creamCard hover:bg-stone-200/70 text-ink text-xs font-bold border border-stone-200/80 active:scale-95 transition-all">
                      ↓ Tarik
                    </button>
                    <button onclick="openSavingGoalDetail('${g.id}')"
                      class="py-2 px-2.5 rounded-2xl bg-stone-100 hover:bg-stone-200 text-slate-600 text-xs font-bold active:scale-95 transition-all">
                      Riwayat
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openSavingGoalDetail(goalId) {
      ui.selectedSavingGoalId = goalId;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });

    function closeSavingGoalDetail() {
      ui.selectedSavingGoalId = null;

    function renderSavingGoalDetailView() {
      const g = (db.savingsGoals || []).find(item => item.id === ui.selectedSavingGoalId);

        ui.selectedSavingGoalId = null;
        return renderTabunganView();
      }
      const color = getColorObj(g.colorId || 'emerald');
      const pct = g.targetAmount > 0 ? Math.min(100, Math.round((g.currentAmount / g.targetAmount) * 100)) : 0;
      const history = [...(g.history || [])].sort((a, b) => b.date.localeCompare(a.date));

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">

          <div class="p-4 space-y-4">
            <div class="rounded-3xl p-5 text-white shadow-md" style="background-color: ${color.hex};">
              <div class="flex items-center justify-between text-xs text-white/80">
                <span>Saldo Terkumpul</span>
                <span class="font-extrabold text-white">${pct}%</span>
              </div>
              <div class="text-3xl font-extrabold mt-1">${formatCurrency(g.currentAmount)}</div>
              <div class="text-xs text-white/85 mt-0.5">Target: ${formatCurrency(g.targetAmount)} • Tenggat: ${g.deadline || '-'}</div>
              <div class="w-full h-2 bg-black/20 rounded-full overflow-hidden mt-3">
                <div class="h-full bg-white rounded-full" style="width: ${pct}%"></div>
              </div>

              <div class="grid grid-cols-2 gap-2.5 mt-4 pt-3 border-t border-white/20">
                <button onclick="openSavingTransferModal('${g.id}', 'deposit')"
                  class="py-2.5 rounded-2xl bg-white text-ink text-xs font-extrabold shadow-xs">+ Setor Tabungan</button>
                <button onclick="openSavingTransferModal('${g.id}', 'withdraw')"
                  class="py-2.5 rounded-2xl bg-black/25 text-white text-xs font-extrabold">↓ Tarik ke Akun</button>
              </div>
            </div>

            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <h2 class="text-sm font-extrabold text-ink mb-3">Riwayat Setoran & Penarikan (${history.length})</h2>
              ${history.length === 0 ? `
                <div class="py-8 text-center text-xs text-slate-400">Belum ada riwayat mutasi tabungan.</div>
              ` : `
                <div class="divide-y divide-stone-100">
                  ${history.map(h => {
                    const acc = db.accounts.find(a => a.id === h.accountId);
                    const pkt = acc?.pockets?.find(p => p.id === h.pocketId);
                    const isDeposit = h.type === 'deposit';
                    return `
                      <div class="py-3 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                          <div class="w-9 h-9 rounded-2xl ${isDeposit ? 'bg-sageLight text-sage' : 'bg-amber-50 text-amber-700'} flex items-center justify-center font-extrabold text-xs shrink-0">
                            ${isDeposit ? '+' : '↓'}

                          <div class="min-w-0">
                            <div class="text-sm font-bold text-ink truncate">${h.note || (isDeposit ? 'Setor Tabungan' : 'Tarik Tabungan')}</div>
                            <div class="text-[11px] text-slate-400 truncate">
                              ${isDeposit ? 'Dari' : 'Ke'}: ${pkt?.name || acc?.name || 'Akun'} • ${h.date}

                          </div>
                        </div>
                        <span class="text-sm font-extrabold ${isDeposit ? 'text-sage' : 'text-amber-700'} shrink-0">
                          ${isDeposit ? '+' : '-'}${formatCurrency(h.amount)}
                        </span>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. MODAL & LOGIKA BISNIS INTERAKTIF
    // =========================================================================
    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modal-backdrop') {
        closeModal();
      }
    }

    function openEditCategoryLimitModal(catId) {

              ${hasSubs ? `

                  Catatan: Kategori ini memiliki ${cat.subcategories.length} subkategori. Jika Anda mengubah limit induk langsung, limit subkategori akan disesuaikan proporsional / disetel ulang agar totalnya tetap sinkron.
                </p>
              ` : ''}
            </div>

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>

      `);
    }

    function submitEditCategoryLimit(e, catId) {
      e.preventDefault();
      const cat = db.categories.find(c => c.id === catId);
      if (!cat) return;
      const newLimit = Math.max(0, Number(document.getElementById('input-cat-limit').value) || 0);

      if (cat.subcategories && cat.subcategories.length > 0) {
        const oldSubSum = cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
        if (oldSubSum > 0) {
          // Distribusikan secara proporsional ke subkategori agar penjumlahannya tetap sama persis
          let allocated = 0;
          cat.subcategories.forEach((sub, idx) => {
            if (idx === cat.subcategories.length - 1) {
              sub.limit = Math.max(0, newLimit - allocated);
            } else {
              const share = Math.round((sub.limit / oldSubSum) * newLimit);
              sub.limit = share;
              allocated += share;
            }
          });
        } else {
          cat.directLimit = newLimit;
        }
      } else {
        cat.directLimit = newLimit;
      }

      saveData();
      closeModal();
      showToast('Limit kategori diperbarui');
      render();
    }

    function submitBulkBudget(e) {
      e.preventDefault();
      document.querySelectorAll('[data-direct-cat]').forEach(inp => {

      });
      document.querySelectorAll('[data-sub-id]').forEach(inp => {
        const cat = db.categories.find(c => c.id === inp.dataset.subCat);
        const sub = cat?.subcategories?.find(s => s.id === inp.dataset.subId);
        if (sub) sub.limit = Math.max(0, Number(inp.value) || 0);

      closeModal();

    function selectAccColor(colorId) {
      document.getElementById('acc-color').value = colorId;
      document.querySelectorAll('[data-color-btn]').forEach(btn => {
        if (btn.dataset.colorBtn === colorId) {
          btn.classList.add('border-ink', 'scale-[1.02]');
          btn.classList.remove('border-transparent');
        } else {
          btn.classList.remove('border-ink', 'scale-[1.02]');
          btn.classList.add('border-transparent');
        }
      });
    }

    function selectAccIcon(iconKey) {
      document.getElementById('acc-icon').value = iconKey;
      document.querySelectorAll('[data-icon-btn]').forEach(btn => {
        if (btn.dataset.iconBtn === iconKey) {
          btn.className = 'p-2.5 rounded-xl border flex flex-col items-center justify-center gap-1 transition-all bg-ink text-white border-ink';
        } else {
          btn.className = 'p-2.5 rounded-xl border flex flex-col items-center justify-center gap-1 transition-all bg-creamCard text-slate-600 border-stone-200';
        }
      });
    }

    function submitAccountModal(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('acc-name').value.trim();
      const currency = document.getElementById('acc-currency').value;
      const colorId = document.getElementById('acc-color').value;
      const icon = document.getElementById('acc-icon').value;

      if (existingId) {
        const acc = db.accounts.find(a => a.id === existingId);
        if (acc) {
          acc.name = name;
          acc.currency = currency;
          acc.colorId = colorId;
          acc.icon = icon;
        }
        showToast('Perubahan akun disimpan');
      } else {
        const initBal = Number(document.getElementById('acc-init-bal').value) || 0;
        db.accounts.push({
          id: 'acc_' + Date.now(),
          name,
          currency,
          colorId,
          icon,
          pockets: [
            { id: 'pkt_' + Date.now(), name: 'Pocket Utama', balance: initBal }
          ]
        });
        showToast('Akun baru ditambahkan');
      }

      saveData();
      closeModal();
      render();
    }

    function deleteAccount(accId) {
      if (db.accounts.length <= 1) {
        showToast('Minimal harus ada 1 akun', 'error');
        return;
      }
      db.accounts = db.accounts.filter(a => a.id !== accId);
      saveData();
      closeModal();
      showToast('Akun dihapus');
      render();
    }

    function submitPocketModal(e, accountId, pocketId) {
      e.preventDefault();
      const acc = db.accounts.find(a => a.id === accountId);
      if (!acc) return;

      const name = document.getElementById('pkt-name').value.trim();
      const balance = Number(document.getElementById('pkt-balance').value) || 0;

      if (pocketId) {
        const pkt = acc.pockets.find(p => p.id === pocketId);
        if (pkt) {
          pkt.name = name;
          pkt.balance = balance;
        }
        showToast('Saldo pocket & total akun diperbarui');
      } else {
        acc.pockets.push({
          id: 'pkt_' + Date.now(),
          name,
          balance
        });
        showToast('Pocket baru ditambahkan ke ' + acc.name);
      }

      saveData();
      closeModal();
      render();
    }

    function deletePocket(accountId, pocketId) {
      const acc = db.accounts.find(a => a.id === accountId);
      if (!acc || acc.pockets.length <= 1) {
        showToast('Akun minimal memiliki 1 pocket', 'error');
        return;
      }
      acc.pockets = acc.pockets.filter(p => p.id !== pocketId);
      if (ui.selectedPocketDetail?.pocketId === pocketId) {
        ui.selectedPocketDetail = null;
      }
      saveData();
      closeModal();
      showToast('Pocket dihapus');
      render();
    }

    function populateTxPockets(accSelectId, pktSelectId, preferredPktId = null) {
      const accId = document.getElementById(accSelectId)?.value;
      const pktSel = document.getElementById(pktSelectId);
      const acc = db.accounts.find(a => a.id === accId);
      if (!acc || !pktSel) return;

      pktSel.innerHTML = (acc.pockets || []).map(p =>
        `<option value="${p.id}" ${preferredPktId === p.id ? 'selected' : ''}>${p.name} (${formatCurrency(p.balance, acc.currency)})</option>`
      ).join('');
    }

    function submitTxModal(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const amount = Number(document.getElementById('tx-amount').value) || 0;
      const date = document.getElementById('tx-date').value;
      const accountId = document.getElementById('tx-account').value;
      const pocketId = document.getElementById('tx-pocket').value;
      const title = document.getElementById('tx-title').value.trim();

      if (amount <= 0) {
        showToast('Nominal harus lebih dari 0', 'error');
        return;
      }

      const srcAcc = db.accounts.find(a => a.id === accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === pocketId);
      if (!srcAcc || !srcPkt) return;

      if (type === 'transfer') {
        const toAccountId = document.getElementById('tx-to-account').value;
        const toPocketId = document.getElementById('tx-to-pocket').value;
        if (accountId === toAccountId && pocketId === toPocketId) {
          showToast('Pocket tujuan tidak boleh sama dengan asal', 'error');
          return;
        }
        const dstAcc = db.accounts.find(a => a.id === toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === toPocketId);
        if (!dstAcc || !dstPkt) return;

        // Kurangi dari pocket asal
        srcPkt.balance = Number(srcPkt.balance) - amount;
        // Konversi jika mata uang akun asal & tujuan berbeda
        const amountInIDR = toIDR(amount, srcAcc.currency);
        const dstRate = db.exchangeRates[dstAcc.currency] || 1;
        const convertedToDst = dstAcc.currency === srcAcc.currency ? amount : Number((amountInIDR / dstRate).toFixed(2));
        dstPkt.balance = Number(dstPkt.balance) + convertedToDst;

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'transfer',
          date,
          amount,
          categoryId: '',
          subcategoryId: '',
          title: title || `Transfer ke ${dstPkt.name}`,
          accountId,
          pocketId,
          toAccountId,
          toPocketId
        });
      } else {
        const categoryId = document.getElementById('tx-category').value;
        const subcategoryId = document.getElementById('tx-subcategory')?.value || '';

        if (type === 'expense') {
          srcPkt.balance = Number(srcPkt.balance) - amount;
        } else {
          srcPkt.balance = Number(srcPkt.balance) + amount;
        }

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type,
          date,
          amount,
          categoryId,
          subcategoryId,
          title,
          accountId,
          pocketId
        });
      }

      saveData();
      closeModal();
      showToast('Transaksi tersimpan & saldo diperbarui');
      render();
    }

    function deleteTransaction(txId) {
      const idx = db.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = db.transactions[idx];

      // Kembalikan saldo pocket saat transaksi dihapus
      const srcAcc = db.accounts.find(a => a.id === tx.accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === tx.pocketId);

      if (srcPkt) {
        if (tx.type === 'expense') {
          srcPkt.balance += Number(tx.amount) || 0;
        } else if (tx.type === 'income') {
          srcPkt.balance -= Number(tx.amount) || 0;
        } else if (tx.type === 'transfer') {
          srcPkt.balance += Number(tx.amount) || 0;
          const dstAcc = db.accounts.find(a => a.id === tx.toAccountId);
          const dstPkt = dstAcc?.pockets?.find(p => p.id === tx.toPocketId);
          if (dstPkt) {
            const amountInIDR = toIDR(tx.amount, srcAcc.currency);
            const dstRate = db.exchangeRates[dstAcc.currency] || 1;
            const convertedToDst = dstAcc.currency === srcAcc.currency ? tx.amount : Number((amountInIDR / dstRate).toFixed(2));
            dstPkt.balance -= convertedToDst;
          }
        }
      }

      db.transactions.splice(idx, 1);
      saveData();
      showToast('Transaksi dihapus & saldo dikembalikan');
      render();
    }

    function submitDebtModal(e) {
      e.preventDefault();
      const type = document.getElementById('debt-type').value;
      const person = document.getElementById('debt-person').value.trim();
      const amount = Number(document.getElementById('debt-amount').value) || 0;
      const dueDate = document.getElementById('debt-due').value;
      const accountId = document.getElementById('debt-account').value;
      const pocketId = document.getElementById('debt-pocket').value;
      const note = document.getElementById('debt-note').value.trim();

      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || amount <= 0) return;

      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? amount : Number((amount / rate).toFixed(2));

      // Langsung update saldo akun/pocket & catat ke riwayat transaksi
      if (type === 'payable') {
        // Kita berhutang -> uang masuk ke akun kita
        pkt.balance += amountInAccCur;
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'income',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: 'cat_lainnya_in',
          subcategoryId: '',
          title: `Terima Hutang dari ${person}`,
          accountId,
          pocketId
        });
      } else {
        // Piutang -> kita meminjamkan uang -> saldo akun berkurang
        pkt.balance -= amountInAccCur;
        const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: fallbackExpCat,
          subcategoryId: '',
          title: `Pinjaman (Piutang) ke ${person}`,
          accountId,
          pocketId
        });
      }

      db.debts.unshift({
        id: 'debt_' + Date.now(),
        type,
        person,
        totalAmount: amount,
        paidAmount: 0,
        dueDate,
        note,
        accountId,
        pocketId,
        createdAt: '2026-11-20'
      });

      saveData();
      closeModal();
      showToast(type === 'payable' ? 'Hutang dicatat & saldo akun bertambah' : 'Piutang dicatat & saldo akun berkurang');
      render();
    }

    function submitSettleDebt(e, debtId) {
      e.preventDefault();
      const d = db.debts.find(item => item.id === debtId);
      if (!d) return;

      const payVal = Number(document.getElementById('settle-amount').value) || 0;
      const accountId = document.getElementById('settle-account').value;
      const pocketId = document.getElementById('settle-pocket').value;
      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || payVal <= 0) return;

      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? payVal : Number((payVal / rate).toFixed(2));

      d.paidAmount += payVal;

      if (d.type === 'payable') {
        // Bayar hutang -> saldo akun berkurang
        pkt.balance -= amountInAccCur;
        const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: fallbackExpCat,
          subcategoryId: '',
          title: `Bayar Hutang ke ${d.person}`,
          accountId,
          pocketId
        });
      } else {
        // Terima pelunasan piutang -> saldo akun bertambah
        pkt.balance += amountInAccCur;
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'income',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: 'cat_lainnya_in',
          subcategoryId: '',
          title: `Pelunasan Piutang dari ${d.person}`,
          accountId,
          pocketId
        });
      }

      saveData();
      closeModal();
      showToast('Pembayaran tercatat & saldo akun diperbarui');
      render();
    }

    function submitSavingTransfer(e, goalId, actionType) {
      e.preventDefault();
      const g = (db.savingsGoals || []).find(item => item.id === goalId);
      if (!g) return;

      const amount = Number(document.getElementById('sav-tx-amount').value) || 0;
      const date = document.getElementById('sav-tx-date').value;
      const accountId = document.getElementById('sav-tx-acc').value;
      const pocketId = document.getElementById('sav-tx-pkt').value;
      const note = document.getElementById('sav-tx-note').value.trim();

      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || amount <= 0) return;

      if (actionType === 'withdraw' && amount > g.currentAmount) {
        showToast('Nominal tarik melebihi saldo tabungan', 'error');
        return;
      }

      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? amount : Number((amount / rate).toFixed(2));

      if (actionType === 'deposit') {
        g.currentAmount += amount;
        pkt.balance -= amountInAccCur;
        const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          date,
          amount: amountInAccCur,
          categoryId: fallbackExpCat,
          subcategoryId: '',
          title: `Setor Tabungan: ${g.name}`,
          accountId,
          pocketId
        });
      } else {
        g.currentAmount -= amount;
        pkt.balance += amountInAccCur;
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'income',
          date,
          amount: amountInAccCur,
          categoryId: 'cat_lainnya_in',
          subcategoryId: '',
          title: `Tarik Tabungan: ${g.name}`,
          accountId,
          pocketId
        });
      }

      if (!g.history) g.history = [];
      g.history.unshift({
        id: 'sh_' + Date.now(),
        type: actionType,
        amount,
        date,
        accountId,
        pocketId,
        note: note || (actionType === 'deposit' ? 'Setor tabungan' : 'Tarik tabungan')
      });

      saveData();
      closeModal();
      showToast(actionType === 'deposit' ? 'Berhasil setor ke tabungan' : 'Dana tabungan berhasil ditarik ke akun');
      render();
    }

    function buildBackupPayload() {
      return {
        app: 'CatatanKeuanganPersonal',
        version: '2.1',
        exportedAt: new Date().toISOString(),
        data: db
      };
    }

    function exportBackupJSON() {
      try {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const dateTag = new Date().toISOString().slice(0, 10);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-keuangan-${dateTag}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File backup JSON berhasil diunduh');
      } catch (err) {
        showToast('Gagal membuat file backup', 'error');
      }
    }

    function copyBackupToClipboard() {
      try {
        const jsonStr = JSON.stringify(buildBackupPayload());
        const ta = document.createElement('textarea');
        ta.value = jsonStr;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Data backup berhasil disalin ke clipboard');
      } catch (err) {
        showToast('Gagal menyalin backup', 'error');
      }
    }

            <div id="restore-preview-box" class="hidden bg-sageLight/70 border border-sage/30 rounded-2xl p-3 text-xs space-y-1">
              <div class="font-extrabold text-sage">✓ File Backup Valid & Siap Dipulihkan</div>
              <div id="restore-preview-stats" class="text-ink font-medium"></div>
            </div>

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
              <button type="button" id="btn-confirm-restore" onclick="executeRestoreData()" disabled
                class="flex-1 py-3 rounded-2xl bg-ink disabled:bg-stone-300 text-white text-xs font-bold shadow-md transition-colors">
                Pulihkan Sekarang
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function validateAndParseBackup(rawText) {
      const parsed = JSON.parse(rawText);
      const candidate = parsed.data ? parsed.data : parsed;
      if (!candidate || !Array.isArray(candidate.accounts) || !Array.isArray(candidate.categories)) {
        throw new Error('Struktur JSON tidak sesuai');
      }
      const def = getDefaultData();
      return {
        exchangeRates: { ...def.exchangeRates, ...(candidate.exchangeRates || {}) },
        exchangeRateMeta: candidate.exchangeRateMeta || def.exchangeRateMeta,
        categories: candidate.categories,
        accounts: candidate.accounts,
        transactions: Array.isArray(candidate.transactions) ? candidate.transactions : [],
        debts: Array.isArray(candidate.debts) ? candidate.debts : [],
        savingsGoals: Array.isArray(candidate.savingsGoals) ? candidate.savingsGoals : []
      };
    }

    function showRestorePreview(validDb) {
      ui.pendingRestoreData = validDb;
      const box = document.getElementById('restore-preview-box');
      const stats = document.getElementById('restore-preview-stats');
      const btn = document.getElementById('btn-confirm-restore');
      if (box && stats && btn) {
        box.classList.remove('hidden');
        stats.innerHTML = `
          • ${validDb.accounts.length} Akun & ${validDb.transactions.length} Transaksi<br/>
          • ${validDb.categories.length} Kategori, ${validDb.savingsGoals.length} Target Tabungan, ${validDb.debts.length} Catatan Hutang
        `;
        btn.disabled = false;
      }
    }

    function handleRestoreFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const text = ev.target.result;
          const ta = document.getElementById('restore-json-text');
          if (ta) ta.value = text;
          const validDb = validateAndParseBackup(text);
          showRestorePreview(validDb);
        } catch (err) {
          ui.pendingRestoreData = null;
          showToast('Format file JSON tidak valid', 'error');
        }
      };
      reader.readAsText(file);
    }

    function previewRestoreFromText(text) {
      if (!text.trim()) {
        ui.pendingRestoreData = null;
        document.getElementById('restore-preview-box')?.classList.add('hidden');
        const btn = document.getElementById('btn-confirm-restore');
        if (btn) btn.disabled = true;
        return;
      }
      try {
        const validDb = validateAndParseBackup(text);
        showRestorePreview(validDb);
      } catch (err) {
        ui.pendingRestoreData = null;
        document.getElementById('restore-preview-box')?.classList.add('hidden');
        const btn = document.getElementById('btn-confirm-restore');
        if (btn) btn.disabled = true;
      }
    }

    function executeRestoreData() {
      if (!ui.pendingRestoreData) return;
      db = ui.pendingRestoreData;
      ui.pendingRestoreData = null;
      saveData();
      closeModal();
      showToast('Data berhasil dipulihkan dari backup!');
      render();
    }

    // =========================================================================
    // 11. MAIN RENDER LOOP
    // =========================================================================
    function render() {
      renderBottomNav();
      const mainEl = document.getElementById('main-content');

      switch (ui.activeTab) {
        case 'transaksi':
          mainEl.innerHTML = renderTransaksiView();
          break;
        case 'statistik':
          mainEl.innerHTML = renderStatistikView();
          break;
        case 'akun':
          mainEl.innerHTML = renderAkunView();
          break;
        case 'tabungan':
          mainEl.innerHTML = renderTabunganView();
          break;
        case 'hutang':
          mainEl.innerHTML = renderHutangView();
          break;
        case 'pengaturan':
          mainEl.innerHTML = renderPengaturanView();
          break;
        default:
          mainEl.innerHTML = renderStatistikView();
      }
    }

    // Inisialisasi aplikasi & sinkronisasi kurs mata uang asing dari internet saat halaman dimuat
    window.addEventListener('DOMContentLoaded', () => {
      render();
      fetchLiveExchangeRates(true);
    });
  </script>
</body>
</html>
