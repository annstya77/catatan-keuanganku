    * {

    }

      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(26, 36, 51, 0.15);
      border-radius: 999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;

<body class="min-h-screen flex justify-center">

  <!-- Mobile-First App Container -->
  <div id="app" class="w-full max-w-md bg-cream min-h-screen relative shadow-2xl flex flex-col pb-24 overflow-x-hidden">

    <!-- Lock Screen Overlay (PIN / Password Kunci Aplikasi) -->
    <div id="lock-screen" class="fixed inset-0 z-[90] hidden items-center justify-center p-5 bg-[#FAF8F5]/95 backdrop-blur-md">
      <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-xl border border-[#DDD6FE] space-y-5 text-center">
        <div class="w-12 h-12 rounded-2xl bg-[#EAE4FD] text-[#5B21B6] mx-auto flex items-center justify-center text-lg font-extrabold">
          🔒
        </div>
        <div>
          <h2 class="text-lg font-extrabold text-ink">Aplikasi Terkunci</h2>
          <p class="text-xs text-slate-500 mt-1">Sesi tidak aktif selama lebih dari 2 hari atau dikunci manual. Masukkan PIN / password Anda.</p>
        </div>

        <form onsubmit="submitUnlockApp(event)" class="space-y-3.5 text-left">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">PIN / Password</label>
            <input type="password" id="lock-pin-input" inputmode="numeric" autocomplete="current-password" required
              placeholder="Masukkan PIN / password..."
              class="w-full px-4 py-3 rounded-2xl bg-creamCard border border-stone-200 text-center text-base font-extrabold tracking-widest text-ink focus:outline-none focus:border-[#7C3AED]" />
            <p id="lock-error-msg" class="text-[11px] font-bold text-coral mt-1.5 hidden">PIN / password salah, silakan coba lagi.</p>
          </div>
          <button type="submit"
            class="w-full py-3 rounded-2xl bg-ink text-white text-xs font-extrabold shadow-md hover:bg-slate-800 active:scale-95 transition-all">
            Buka Aplikasi
          </button>
        </form>
      </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] hidden max-w-[90vw]">
      <div id="toast-inner" class="bg-ink text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2.5">
        <span id="toast-icon"></span>
        <span id="toast-msg">Tersimpan</span>
      </div>
    </div>

    <!-- Main Dynamic View Area -->
    <main id="main-content" class="flex-1 w-full"></main>

      </svg>
    </button>

    function hashPin(pin) {
      // Hash deterministik sederhana berbasis FNV-1a agar PIN tidak disimpan dalam bentuk teks polos
      let h = 0x811c9dc5;
      const str = String(pin || '');
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return 'pin_' + (h >>> 0).toString(16);
    }

    function checkSessionExpiration() {
      if (!db.security || !db.security.enabled || !db.security.pinHash) return false;
      if (isManualLocked) return true;
      const lastActive = Number(db.security.lastActiveAt) || 0;
      if (lastActive === 0 || (Date.now() - lastActive) > TWO_DAYS_MS) {
        return true;
      }
      return false;
    }

    // LIVE EXCHANGE RATE DARI INTERNET (OPEN.ER-API / EXCHANGERATE-API)

    async function fetchLiveExchangeRates(silent = false) {
      if (isFetchingRates) return;
      isFetchingRates = true;
      if (!silent) render();

      const endpoints = [
        'https://open.er-api.com/v6/latest/IDR',
        'https://api.exchangerate-api.com/v4/latest/IDR'
      ];

      let success = false;
      for (const url of endpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 7000);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) continue;
          const data = await res.json();
          if (data && data.rates) {
            Object.keys(CURRENCY_META).forEach(code => {
              if (code === 'IDR') {
                db.exchangeRates.IDR = 1;
              } else if (data.rates[code] && data.rates[code] > 0) {
                const idrPerUnit = 1 / Number(data.rates[code]);
                db.exchangeRates[code] = idrPerUnit >= 100
                  ? Math.round(idrPerUnit)
                  : Number(idrPerUnit.toFixed(2));
              }
            });
            db.exchangeRateMeta = {
              source: 'live',
              lastUpdated: new Date().toLocaleString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })
            };
            saveData();
            success = true;
            break;
          }
        } catch (err) {
          // Lanjut ke endpoint cadangan
        }
      }

      isFetchingRates = false;
      if (success) {
        if (!silent) showToast('Kurs mata uang asing berhasil diperbarui dari internet');
      } else {
        if (!db.exchangeRateMeta) db.exchangeRateMeta = { source: 'offline', lastUpdated: null };
        db.exchangeRateMeta.source = 'offline';
        saveData();
        if (!silent) showToast('Gagal terhubung ke server kurs, menggunakan kurs tersimpan', 'error');
      }
      render();
    }

    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || CURRENCY_META.IDR;
      const isNeg = amount < 0;
      const absVal = Math.abs(Number(amount) || 0);
      const formatted = absVal.toLocaleString('id-ID', {
        minimumFractionDigits: meta.decimals,
        maximumFractionDigits: meta.decimals
      });
      return `${isNeg ? '-' : ''}${meta.symbol} ${formatted}`;
    }

    function formatShortRupiah(amount) {
      const abs = Math.abs(amount);
      if (abs >= 1000000) {
        return (amount / 1000000).toFixed(1).replace(/\.0$/, '') + 'jt';
      }
      if (abs >= 1000) {
        return Math.round(amount / 1000) + 'k';
      }
      return amount.toString();
    }

    function toIDR(amount, currency) {
      const rate = db.exchangeRates[currency] || 1;
      return Math.round((Number(amount) || 0) * rate);
    }

    function getAccountTotalBalance(account) {
      if (!account || !account.pockets) return 0;
      return account.pockets.reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    function getTotalNetWorthIDR() {
      return db.accounts.reduce((sum, acc) => {
        const accBal = getAccountTotalBalance(acc);
        return sum + toIDR(accBal, acc.currency);
      }, 0);
    }

    // Mengambil saldo aktual target tabungan dari Pocket penyimpanannya (sehingga selalu sinkron dengan Aset/Kekayaan)
    function getSavingGoalBalanceIDR(goal) {
      if (!goal) return 0;
      const acc = db.accounts.find(a => a.id === goal.accountId);
      const pkt = acc?.pockets?.find(p => p.id === goal.pocketId);
      if (acc && pkt) {
        return Math.max(0, toIDR(pkt.balance, acc.currency));
      }
      return Number(goal.currentAmount) || 0;
    }

    function getColorObj(colorId) {
      return ACCOUNT_COLORS.find(c => c.id === colorId) || ACCOUNT_COLORS[0];
    }

    function getCategoryLimit(cat) {
      if (!cat) return 0;
      if (cat.subcategories && cat.subcategories.length > 0) {
        const subTotal = cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
        // Jika subkategori memiliki limit (> 0), total limit kategori adalah penjumlahan subkategori.
        // Jika semua subkategori limitnya 0 namun kategori induk memiliki directLimit, gunakan directLimit.
        return subTotal > 0 ? subTotal : (Number(cat.directLimit) || 0);
      }
      return Number(cat.directLimit) || 0;
    }

    function shiftPeriod(target, delta) {
      if (target === 'stat') {
        if (ui.statPeriodMode === 'yearly') {
          ui.statYear += delta;
        } else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear--; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear++; }
        }
      } else if (target === 'akun') {
        if (ui.akunPeriodMode === 'yearly') {
          ui.akunYear += delta;
        } else {
          ui.akunMonth += delta;
          if (ui.akunMonth < 0) { ui.akunMonth = 11; ui.akunYear--; }
          if (ui.akunMonth > 11) { ui.akunMonth = 0; ui.akunYear++; }
        }
      }
      render();
    }

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(tx => {
        if (!tx.date) return false;
        const [y, m] = tx.date.split('-').map(Number);
        if (mode === 'yearly') {
          return y === year;
        }
        return y === year && (m - 1) === month;
      });
    }
