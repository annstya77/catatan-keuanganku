          security: { ...def.security, ...(parsed.security || {}) },
          exchangeRates: { ...def.exchangeRates, ...(parsed.exchangeRates || {}) },
          exchangeRateMeta: parsed.exchangeRateMeta || def.exchangeRateMeta,
          categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : def.categories,
          accounts: Array.isArray(parsed.accounts) && parsed.accounts.length ? parsed.accounts : def.accounts,
          transactions: Array.isArray(parsed.transactions) ? parsed.transactions : def.transactions,
          debts: Array.isArray(parsed.debts) ? parsed.debts : [],
          savingsGoals: Array.isArray(parsed.savingsGoals) ? parsed.savingsGoals : []
        };
      } catch (e) {

    // 3. PWA ICON BUKU DIARY BIRU LANGIT (#87CEEB) + "Rp" & INSTALL APP
    // =========================================================================
    function generateDiaryIconDataURL(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Latar belakang biru langit #87CEEB penuh (maskable-friendly)
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, size, size);

      // Efek kilau lembut di bagian atas
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, 'rgba(255,255,255,0.28)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      // Badan Buku Diary
      const bookW = size * 0.54;
      const bookH = size * 0.66;
      const bookX = (size - bookW) / 2;
      const bookY = (size - bookH) / 2;
      const r = size * 0.08;

      // Bayangan lembut buku
      ctx.fillStyle = 'rgba(24, 62, 92, 0.16)';
      ctx.beginPath();
      ctx.roundRect(bookX + size * 0.02, bookY + size * 0.025, bookW, bookH, r);
      ctx.fill();

      // Sampul buku krem hangat
      ctx.fillStyle = '#FFFDF9';
      ctx.beginPath();
      ctx.roundRect(bookX, bookY, bookW, bookH, r);
      ctx.fill();

      // Punggung (spine) buku diary di sisi kiri
      const spineW = bookW * 0.18;
      ctx.fillStyle = '#3B82F6';
      ctx.beginPath();
      ctx.roundRect(bookX, bookY, spineW + r * 0.4, bookH, [r, 0, 0, r]);
      ctx.fill();

      // Pita pembatas buku di bawah
      ctx.fillStyle = '#EA5E86';
      ctx.beginPath();
      ctx.moveTo(bookX + bookW * 0.72, bookY + bookH - 2);
      ctx.lineTo(bookX + bookW * 0.84, bookY + bookH - 2);
      ctx.lineTo(bookX + bookW * 0.84, bookY + bookH + size * 0.06);
      ctx.lineTo(bookX + bookW * 0.78, bookY + bookH + size * 0.035);
      ctx.lineTo(bookX + bookW * 0.72, bookY + bookH + size * 0.06);
      ctx.closePath();
      ctx.fill();

      // Tulisan "Rp" di tengah sampul buku
      ctx.fillStyle = '#1E3A5F';
      ctx.font = `600 ${Math.round(size * 0.22)}px "Fredoka", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Rp', bookX + spineW + (bookW - spineW) / 2, bookY + bookH * 0.51);

      return canvas.toDataURL('image/png');
    }

    // =========================================================================
    // 4. LOGIKA KUNCI PIN / PASSWORD & SESI OTOMATIS 48 JAM (2 HARI)
    // =========================================================================
    function simpleHashPin(pin) {
      let hash = 0;
      const str = String(pin || '');
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return 'pin_' + Math.abs(hash).toString(36) + '_' + str.length;
    }

    function isSessionExpired() {
      if (!db.security?.enabled || !db.security?.pinHash) return false;
      if (db.security.lockedNow) return true;
      const last = Number(db.security.lastActiveAt) || 0;
      return (Date.now() - last) > SESSION_TIMEOUT_MS;
    }

    function touchSessionActivity() {
      if (!db.security) return;
      db.security.lastActiveAt = Date.now();
      saveData();
    }

    function updateLockScreenVisibility() {
      const lockEl = document.getElementById('lock-screen');
      if (!lockEl) return;
      if (isSessionExpired()) {
        lockEl.classList.remove('hidden');
        lockEl.classList.add('flex');
      } else {
        lockEl.classList.add('hidden');
        lockEl.classList.remove('flex');
        if (db.security?.enabled) {
          db.security.lastActiveAt = Date.now();
          saveData();
        }
      }
    }

    function submitUnlockApp(e) {
      e.preventDefault();
      const input = document.getElementById('lock-pin-input');
      const errMsg = document.getElementById('lock-error-msg');
      const entered = input?.value || '';

      if (simpleHashPin(entered) === db.security?.pinHash) {
        db.security.lockedNow = false;
        db.security.lastActiveAt = Date.now();
        saveData();
        if (input) input.value = '';
        if (errMsg) errMsg.classList.add('hidden');
        updateLockScreenVisibility();
        showToast('Aplikasi terbuka');
      } else {
        if (errMsg) errMsg.classList.remove('hidden');
      }
    }

    function lockAppNow() {
      if (!db.security?.enabled || !db.security?.pinHash) {
        openPinSetupModal();
        return;
      }
      db.security.lockedNow = true;
      saveData();
      updateLockScreenVisibility();
    }

      const isEnabled = Boolean(db.security?.enabled && db.security?.pinHash);
      openModal(`
        <div class="space-y-4">

          <form onsubmit="submitPinSetup(event)" class="space-y-3.5">

    function submitPinSetup(e) {
      e.preventDefault();

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      const icon = document.getElementById('toast-icon');
      const msgEl = document.getElementById('toast-msg');
      if (!toast || !msgEl) return;

      inner.className = type === 'error'
        ? 'bg-coral text-white text-xs font-normal px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2'
        : 'bg-ink text-white text-xs font-normal px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2';
      icon.textContent = type === 'error' ? '⚠️' : '✓';
      msgEl.textContent = msg;

      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2600);
    }

    function formatNumberID(num, decimals = 0) {
      const n = Number(num) || 0;
      return n.toLocaleString('id-ID', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function formatCurrency(amount, currency = 'IDR') {
      const meta = CURRENCY_META[currency] || CURRENCY_META.IDR;
      const n = Number(amount) || 0;
      const absStr = formatNumberID(Math.abs(n), meta.decimals);
      const sign = n < 0 ? '-' : '';
      return currency === 'IDR' ? `${sign}Rp ${absStr}` : `${sign}${meta.symbol} ${absStr}`;
    }

    function formatShortRupiah(amount) {
      const n = Math.abs(Number(amount) || 0);
      if (n >= 1000000000) return `${(n / 1000000000).toFixed(1).replace('.0', '')}M`;
      if (n >= 1000000) return `${(n / 1000000).toFixed(1).replace('.0', '')}jt`;
      if (n >= 1000) return `${Math.round(n / 1000)}rb`;
      return formatNumberID(n, 0);
    }

    function toIDR(amount, currency = 'IDR') {
      const rate = Number(db.exchangeRates?.[currency]) || 1;
      return (Number(amount) || 0) * rate;
    }

    function getTxCurrency(tx) {
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc ? acc.currency : 'IDR';
    }

    function getAccountTotalBalance(acc) {
      return (acc.pockets || []).reduce((sum, p) => sum + (Number(p.balance) || 0), 0);
    }

    function getTotalNetWorthIDR() {
      return db.accounts.reduce((sum, acc) => {
        return sum + toIDR(getAccountTotalBalance(acc), acc.currency);
      }, 0);
    }

    function getCategoryLimit(cat) {
      if (cat.subcategories && cat.subcategories.length > 0) {
        return cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
      }
      return Number(cat.directLimit) || 0;
    }

    function getSavingGoalBalanceIDR(goal) {
      const acc = db.accounts.find(a => a.id === goal.accountId);
      const pkt = acc?.pockets?.find(p => p.id === goal.pocketId);
      if (acc && pkt) {
        return Math.max(0, toIDR(pkt.balance, acc.currency));
      }
      return Math.max(0, Number(goal.currentAmount) || 0);
    }

    function filterTransactionsByPeriod(txs, mode, year, month) {
      return txs.filter(t => {
        if (!t.date) return false;
        const parts = t.date.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        if (mode === 'yearly') return y === year;
        return y === year && m === month;
      });
    }

    async function fetchLiveExchangeRates(silent = false) {
      if (isFetchingRates) return;
      isFetchingRates = true;
      if (!silent) render();
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/IDR');
        const data = await res.json();
        if (data && data.result === 'success' && data.rates) {
          Object.keys(CURRENCY_META).forEach(code => {
            if (code !== 'IDR' && data.rates[code] > 0) {
              const idrPerUnit = 1 / data.rates[code];
              db.exchangeRates[code] = code === 'JPY'
                ? Number(idrPerUnit.toFixed(2))
                : Math.round(idrPerUnit);
            }
          });
          const now = new Date();
          const label = `${now.getDate()} ${MONTH_NAMES_ID[now.getMonth()]} ${now.getFullYear()}, ${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
          db.exchangeRateMeta = { source: 'live', lastUpdated: label };
          saveData();
          if (!silent) showToast('Kurs live (termasuk THB Baht) berhasil disinkronkan');
        }
      } catch (e) {
        if (!silent) showToast('Menggunakan kurs tersimpan lokal', 'error');
      } finally {
        isFetchingRates = false;
        render();
      }
    }

    function shiftPeriod(target, delta) {
      if (target === 'akun') {
        if (ui.akunPeriodMode === 'yearly') {
          ui.akunYear += delta;
        } else {
          ui.akunMonth += delta;
          if (ui.akunMonth < 0) { ui.akunMonth = 11; ui.akunYear -= 1; }
          if (ui.akunMonth > 11) { ui.akunMonth = 0; ui.akunYear += 1; }
        }
      } else if (target === 'stat') {
        if (ui.statPeriodMode === 'yearly') {
          ui.statYear += delta;
        } else {
          ui.statMonth += delta;
          if (ui.statMonth < 0) { ui.statMonth = 11; ui.statYear -= 1; }
          if (ui.statMonth > 11) { ui.statMonth = 0; ui.statYear += 1; }
        }
      }
      render();
    }

    // =========================================================================
    // 6. VIEW 2: AKUN (TOTAL KEKAYAAN, MULTI-CURRENCY, POCKET & RINCIAN BULANAN)
    // =========================================================================
    function renderAkunView() {
      if (ui.selectedPocketDetail) {
        return renderPocketDetailView();

        ? `${ui.akunYear}`
        : `${MONTH_NAMES_ID[ui.akunMonth]} ${ui.akunYear}`;

      let periodIn = 0;
      let periodOut = 0;

                <button onclick="setAkunPeriodMode('yearly')" class="px-2.5 py-1.5 rounded-lg transition-all ${ui.akunPeriodMode === 'yearly' ? 'text-white shadow-xs' : 'text-slate-600'}" style="${ui.akunPeriodMode === 'yearly' ? 'background-color: #422F0E;' : ''}">Tahunan</button>

              <div class="flex items-center gap-1 bg-white/95 px-2 py-1 rounded-xl">
                <button onclick="shiftPeriod('akun', -1)" class="p-1.5 hover:bg-rose-50 rounded-lg text-slate-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>

                <span class="text-xs font-medium text-ink min-w-[76px] text-center">${periodLabel}</span>
                <button onclick="shiftPeriod('akun', 1)" class="p-1.5 hover:bg-rose-50 rounded-lg text-slate-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Kartu Total Kekayaan (Soft Pastel Cobalt Blue #DCE6F9) -->
          <div class="rounded-3xl p-5 shadow-sm border relative overflow-hidden" style="background: linear-gradient(135deg, #E3ECFC 0%, #D5E2F8 100%); border-color: #BDD0F2; color: #1E3A8A;">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 rounded-full bg-white/45 pointer-events-none"></div>
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-medium uppercase tracking-wider" style="color: #1E3A8A;">TOTAL KEKAYAAN (KONVERSI IDR)</span>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="fetchLiveExchangeRates(false)" ${isFetchingRates ? 'disabled' : ''}
                  class="px-2.5 py-1 rounded-xl bg-white/90 hover:bg-white text-[11px] font-medium border border-[#BDD0F2] transition-colors" style="color: #1E3A8A;">
                  ${isFetchingRates ? 'Sync...' : '↻ Sync Kurs'}
                </button>
                <button onclick="openExchangeRateModal()"
                  class="px-2.5 py-1 rounded-xl bg-white/90 hover:bg-white text-[11px] font-medium border border-[#BDD0F2] transition-colors" style="color: #1E3A8A;">
                  Kurs ⇄
                </button>
              </div>
            </div>

            <div class="text-[11px] mt-1 flex items-center gap-1.5" style="color: #3B5998;">
              <span class="w-1.5 h-1.5 rounded-full inline-block ${db.exchangeRateMeta?.source === 'live' ? 'bg-emerald-600' : 'bg-amber-500'}"></span>
              <span>${db.exchangeRateMeta?.source === 'live' ? `Kurs Live Internet (${db.exchangeRateMeta.lastUpdated || 'Aktif'})` : 'Kurs Tersimpan Lokal'}</span>
            </div>

            <div class="text-2xl sm:text-3xl font-medium tracking-tight mt-1.5" style="color: #172554;">
              ${formatCurrency(totalNetWorth, 'IDR')}

            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t text-xs" style="border-color: rgba(189, 208, 242, 0.8);">
              <div>
                <span class="text-[10px] block" style="color: #3B5998;">Masuk (${periodLabel})</span>
                <span class="font-medium text-emerald-700">+${formatShortRupiah(periodIn)}</span>
              </div>
              <div>
                <span class="text-[10px] block" style="color: #3B5998;">Keluar (${periodLabel})</span>
                <span class="font-medium text-rose-600">-${formatShortRupiah(periodOut)}</span>
              </div>
              <div>
                <span class="text-[10px] block" style="color: #3B5998;">Selisih</span>
                <span class="font-medium" style="color: #172554;">${periodDiff >= 0 ? '+' : '-'}${formatShortRupiah(Math.abs(periodDiff))}</span>
              </div>
            </div>
          </div>

          <!-- Daftar Kartu Akun (Warna Tint Lebih Muda per Item) -->
          <div class="space-y-3.5">
            ${db.accounts.map(acc => {
              const color = getColorObj(acc.colorId);
              const iconSvg = ICONS[acc.icon] || ICONS.bank;
              const accTotal = getAccountTotalBalance(acc);
              const isForeign = acc.currency !== 'IDR';
              const idrEquiv = toIDR(accTotal, acc.currency);

              return `
                <div class="rounded-3xl p-4 shadow-sm border space-y-3 transition-all" style="background-color: ${color.bg}; border-color: ${color.border};">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shrink-0 shadow-xs" style="background-color: ${color.hex};">
                        ${iconSvg}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <h3 class="text-base font-medium text-ink truncate">${acc.name}</h3>
                          <span class="px-2 py-0.5 rounded-lg bg-white/95 text-[10px] font-medium text-ink">${acc.currency}</span>

                        <div class="text-lg font-medium mt-0.5" style="color: ${color.text};">

                          <div class="text-[11px] text-slate-500">≈ ${formatCurrency(idrEquiv, 'IDR')}</div>

                      <button onclick="openAccountModal('${acc.id}')" title="Edit Akun" class="p-2 rounded-xl bg-white/95 hover:bg-white text-slate-600 shadow-2xs">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                      </button>
                    </div>
                  </div>

                  <!-- Daftar Pocket di Dalam Akun -->
                  <div class="space-y-2 pt-1">
                    ${(acc.pockets || []).map(pkt => `
                      <div class="bg-white/95 rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2 border border-white">
                        <button onclick="openPocketDetail('${acc.id}', '${pkt.id}')" class="text-left min-w-0 flex-1 group">
                          <div class="text-sm font-medium text-ink group-hover:underline truncate">${pkt.name}</div>
                          <div class="text-sm font-medium mt-0.5" style="color: ${color.hex};">
                            ${formatCurrency(pkt.balance, acc.currency)}
                          </div>
                        </button>
                        <div class="flex items-center gap-1.5 shrink-0">
                          <button onclick="openPocketModal('${acc.id}', '${pkt.id}')" class="px-2.5 py-1 rounded-xl bg-creamCard hover:bg-stone-200/70 text-[11px] font-medium text-slate-600">
                            Edit
                          </button>
                          <button onclick="openPocketDetail('${acc.id}', '${pkt.id}')" class="p-1 text-slate-400 hover:text-ink">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>

                        </div>

            }).join('')}

    function openPocketDetail(accountId, pocketId) {
      ui.selectedPocketDetail = { accountId, pocketId, year: ui.akunYear || 2026 };
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePocketDetail() {
      ui.selectedPocketDetail = null;
      render();
    }

    function shiftPocketDetailYear(delta) {
      if (!ui.selectedPocketDetail) return;
      ui.selectedPocketDetail.year += delta;
      render();
    }

    function renderPocketDetailView() {
      const detail = ui.selectedPocketDetail;
      const acc = db.accounts.find(a => a.id === detail?.accountId);
      const pkt = acc?.pockets?.find(p => p.id === detail?.pocketId);
      if (!acc || !pkt) {
        ui.selectedPocketDetail = null;
        return renderAkunView();
      }

      const year = detail.year;
      const color = getColorObj(acc.colorId);

      // Semua transaksi yang melibatkan pocket ini
      const pocketTxs = db.transactions.filter(t =>
        (t.accountId === acc.id && t.pocketId === pkt.id) ||
        (t.type === 'transfer' && t.toAccountId === acc.id && t.toPocketId === pkt.id)
      );

      // Rincian 12 bulan (Jan - Des) dengan format lengkap ###.###.###
      const monthlyRows = MONTH_NAMES_ID.map((mName, mIdx) => {
        let mIn = 0;
        let mOut = 0;

        pocketTxs.forEach(t => {
          if (!t.date) return;
          const parts = t.date.split('-');
          const ty = parseInt(parts[0], 10);
          const tm = parseInt(parts[1], 10) - 1;
          if (ty !== year || tm !== mIdx) return;

          if (t.type === 'income') {
            mIn += Number(t.amount) || 0;
          } else if (t.type === 'expense') {
            mOut += Number(t.amount) || 0;
          } else if (t.type === 'transfer') {
            if (t.accountId === acc.id && t.pocketId === pkt.id) {
              mOut += Number(t.amount) || 0;
            }
            if (t.toAccountId === acc.id && t.toPocketId === pkt.id) {
              const srcAcc = db.accounts.find(a => a.id === t.accountId);
              const amountInIDR = toIDR(t.amount, srcAcc ? srcAcc.currency : acc.currency);
              const dstRate = db.exchangeRates[acc.currency] || 1;
              const received = acc.currency === (srcAcc?.currency || acc.currency)
                ? Number(t.amount) || 0
                : Number((amountInIDR / dstRate).toFixed(2));
              mIn += received;
            }
          }
        });

        const diff = mIn - mOut;
        return { mName, mIdx, mIn, mOut, diff };
      });

      const currentMonthIdx = new Date().getMonth();
      const currentYearNow = new Date().getFullYear();

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">
          <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <button onclick="closePocketDetail()" class="p-1.5 -ml-1.5 rounded-xl hover:bg-stone-100 text-ink">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              </button>
              <div class="truncate">
                <h1 class="text-base font-medium uppercase text-ink truncate">${pkt.name}</h1>
                <div class="text-[11px] text-slate-500 truncate">${acc.name} (${acc.currency})</div>
              </div>
            </div>
            <button onclick="openPocketModal('${acc.id}', '${pkt.id}')" class="px-3 py-1.5 rounded-xl bg-creamCard border border-stone-200 text-xs font-medium text-ink shrink-0">
              Edit Saldo
            </button>
          </div>

          <div class="p-4 space-y-4">
            <!-- Kartu Saldo Pocket -->
            <div class="rounded-3xl p-5 text-white shadow-md" style="background-color: ${color.hex};">
              <span class="text-xs text-white/85 uppercase tracking-wider">SALDO SAAT INI</span>
              <div class="text-3xl font-medium mt-1">${formatCurrency(pkt.balance, acc.currency)}</div>
              ${acc.currency !== 'IDR' ? `
                <div class="text-xs text-white/85 mt-1">≈ ${formatCurrency(toIDR(pkt.balance, acc.currency), 'IDR')}</div>
              ` : ''}
            </div>

            <!-- Rincian Nominal Per Bulan (Format Lengkap ###.###.###) -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <h2 class="text-sm font-medium text-ink">Rincian Nominal Per Bulan (${year})</h2>
                <div class="flex items-center gap-1 bg-creamCard px-2 py-1 rounded-xl border border-stone-200/70">
                  <button onclick="shiftPocketDetailYear(-1)" class="p-1 text-slate-600 hover:text-ink">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                  </button>
                  <span class="text-xs font-medium text-ink px-1">${year}</span>
                  <button onclick="shiftPocketDetailYear(1)" class="p-1 text-slate-600 hover:text-ink">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                  </button>
                </div>
              </div>

              <!-- Header Kolom Sejajar -->
              <div class="grid grid-cols-12 gap-1 px-2.5 pb-2 border-b border-stone-100 text-[10px] font-medium uppercase tracking-wider text-slate-400">
                <div class="col-span-3">BULAN</div>
                <div class="col-span-3 text-right">MASUK</div>
                <div class="col-span-3 text-right">KELUAR</div>
                <div class="col-span-3 text-right">SELISIH</div>
              </div>

              <!-- Baris Jan - Des dengan Angka Lengkap ###.###.### -->
              <div class="space-y-1.5">
                ${monthlyRows.map(row => {
                  const isHighlight = (year === currentYearNow && row.mIdx === currentMonthIdx) || (year === 2026 && row.mIdx === 10);
                  const dec = CURRENCY_META[acc.currency]?.decimals || 0;
                  const inText = '+' + formatNumberID(row.mIn, dec);
                  const outText = '-' + formatNumberID(row.mOut, dec);
                  const diffSign = row.diff >= 0 ? '+' : '-';
                  const diffText = diffSign + formatNumberID(Math.abs(row.diff), dec);

                  return `
                    <div class="grid grid-cols-12 gap-1 items-center px-2.5 py-2.5 rounded-2xl border ${isHighlight ? 'bg-[#F8F3E8] border-[#E8DEC8]' : 'bg-white border-stone-100'}">
                      <div class="col-span-3 text-xs font-medium text-ink truncate">${row.mName} ${year}</div>
                      <div class="col-span-3 text-right text-[11px] font-medium text-sage tabular-nums tracking-tight break-all">${inText}</div>
                      <div class="col-span-3 text-right text-[11px] font-medium text-coral tabular-nums tracking-tight break-all">${outText}</div>
                      <div class="col-span-3 text-right text-[11px] font-medium text-ink tabular-nums tracking-tight break-all">${diffText}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Riwayat Transaksi Pocket Ini -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <h2 class="text-sm font-medium text-ink mb-2">Transaksi di Pocket Ini (${pocketTxs.length})</h2>
              ${pocketTxs.length === 0 ? `
                <div class="py-6 text-center text-xs text-slate-400">Belum ada transaksi tercatat di pocket ini.</div>
              ` : `
                <div class="divide-y divide-stone-100">
                  ${[...pocketTxs].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(tx => renderTransactionRow(tx)).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 7. VIEW 4: HUTANG & PIUTANG (BEACH UMBRELLA #FFD094 + TULISAN PINK #C83E67)
    // =========================================================================
    function setDebtFilter(f) {
      ui.debtFilter = f;
      render();
    }

    function renderHutangView() {
      const allDebts = db.debts || [];
      const payables = allDebts.filter(d => d.type === 'payable');
      const receivables = allDebts.filter(d => d.type === 'receivable');

      const totalPayableRem = payables.reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);
      const totalReceivableRem = receivables.reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);

      const list = ui.debtFilter === 'ALL'
        ? allDebts
        : allDebts.filter(d => d.type === ui.debtFilter);

      return `
        <div class="p-4 space-y-4">
          <!-- Header Hutang & Piutang: Beach Umbrella (#FFD094) + Tulisan Pink Kontras (#C83E67) -->
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #FFD094; border-color: #F2BC77;">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h1 class="text-xl font-medium uppercase tracking-wider" style="color: #C83E67;">HUTANG & PIUTANG</h1>
                <p class="text-xs" style="color: #8A3E24;">Otomatis terhubung ke saldo akun Anda</p>
              </div>
              <button onclick="openDebtModal()" class="px-3.5 py-2 rounded-2xl text-xs font-medium shadow-sm active:scale-95 transition-all shrink-0" style="background-color: #422F0E; color: #FFD094;">
                + Catat
              </button>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div class="bg-white/95 rounded-2xl p-3">
                <span class="text-[11px] text-coral block">Sisa Hutang Saya</span>
                <span class="text-base font-medium text-ink">${formatCurrency(totalPayableRem)}</span>
              </div>
              <div class="bg-white/95 rounded-2xl p-3">
                <span class="text-[11px] text-sage block">Sisa Piutang (Tagihan)</span>
                <span class="text-base font-medium text-ink">${formatCurrency(totalReceivableRem)}</span>
              </div>
            </div>

            <div class="flex gap-1.5">
              ${[
                { id: 'ALL', label: 'Semua' },
                { id: 'payable', label: 'Hutang Saya' },
                { id: 'receivable', label: 'Piutang' }
              ].map(t => `
                <button onclick="setDebtFilter('${t.id}')"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all ${ui.debtFilter === t.id ? 'bg-[#422F0E] text-[#FFD094]' : 'bg-white/95 text-ink'}">
                  ${t.label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Daftar Item Hutang & Piutang (Warna Tint Lebih Muda per Item) -->
          <div class="space-y-3">
            ${list.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center border border-stone-200/70 text-xs text-slate-400">
                Belum ada catatan hutang atau piutang.
              </div>
            ` : list.map(d => {
              const isPayable = d.type === 'payable';
              const rem = Math.max(0, d.totalAmount - d.paidAmount);
              const isPaidOff = rem <= 0;
              const pct = d.totalAmount > 0 ? Math.min(100, Math.round((d.paidAmount / d.totalAmount) * 100)) : 100;

              const cardStyle = isPayable
                ? 'background-color: #FEF3F0; border-color: #FAD7CE;'
                : 'background-color: #EFF9F7; border-color: #CCEBE5;';

              return `
                <div class="rounded-3xl p-4 shadow-sm border space-y-2.5" style="${cardStyle}">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-white ${isPayable ? 'text-coral' : 'text-sage'}">
                          ${isPayable ? 'HUTANG SAYA' : 'PIUTANG'}
                        </span>
                        ${isPaidOff ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-white text-sage">LUNAS</span>` : ''}
                      </div>
                      <h3 class="text-base font-medium text-ink mt-1 truncate">${d.person}</h3>
                      <p class="text-[11px] text-slate-500 truncate">${d.note || 'Tanpa keterangan'} • Jatuh tempo: ${d.dueDate || '-'}</p>
                    </div>

                    <button onclick="deleteDebt('${d.id}')" class="p-1.5 rounded-xl bg-white/90 text-slate-400 hover:text-coral">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                  </div>

                  <div class="flex items-baseline justify-between text-xs">
                    <div>
                      <span class="text-slate-500">Sisa: </span>
                      <span class="text-sm font-medium ${isPayable ? 'text-coral' : 'text-sage'}">${formatCurrency(rem)}</span>
                    </div>
                    <span class="text-slate-500">Total: ${formatCurrency(d.totalAmount)} (${pct}%)</span>
                  </div>

                  <div class="w-full h-2 bg-white/90 rounded-full overflow-hidden">
                    <div class="h-full rounded-full ${isPayable ? 'bg-coral' : 'bg-sage'}" style="width: ${pct}%"></div>
                  </div>

                  ${!isPaidOff ? `
                    <div class="pt-1">
                      <button onclick="openSettleDebtModal('${d.id}')"
                        class="w-full py-2.5 rounded-2xl bg-white hover:bg-creamCard text-ink text-xs font-medium border border-stone-200/70 transition-colors">
                        ${isPayable ? 'Bayar / Cicil Hutang' : 'Terima Pelunasan'}
                      </button>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. STATISTIK HELPER SECTIONS (ANGGARAN, PER KATEGORI & DRILLDOWN)
    // =========================================================================
    function setStatPeriodMode(mode) {
      ui.statPeriodMode = mode;
      render();
    }

    function setStatSubTab(tab) {
      ui.statSubTab = tab;
      render();
    }

    function toggleBudgetCatExpand(catId) {
      ui.expandedBudgetCats[catId] = !ui.expandedBudgetCats[catId];
      render();
    }

    function openCategoryDrilldown(catId) {
      ui.drilldownCategoryId = catId;
      ui.drilldownSubcategoryId = 'ALL';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeCategoryDrilldown() {
      ui.drilldownCategoryId = null;
      render();
    }

    function setDrilldownSubcategory(subId) {
      ui.drilldownSubcategoryId = subId;
      render();
    }

    function renderBudgetEvaluationSection() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense');
      const multiplier = ui.statPeriodMode === 'yearly' ? 12 : 1;
      const expenseCats = db.categories.filter(c => c.type === 'expense');

      let totalBudget = 0;
      let totalSpent = 0;

      const catRows = expenseCats.map(cat => {
        const limit = getCategoryLimit(cat) * multiplier;
        const catTxs = periodTxs.filter(t => t.categoryId === cat.id);
        const spent = catTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        totalBudget += limit;
        totalSpent += spent;
        const pct = limit > 0 ? Math.round((spent / limit) * 100) : 0;
        const isOver = limit > 0 && spent > limit;
        const isWarn = limit > 0 && !isOver && pct >= 80;
        return { cat, limit, spent, pct, isOver, isWarn };
      });

      const overallPct = totalBudget > 0 ? Math.round((totalSpent / totalBudget) * 100) : 0;
      const overallRemaining = totalBudget - totalSpent;

      return `
        <div class="space-y-3">
          <!-- Ringkasan Total Anggaran -->
          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-medium uppercase tracking-wider text-slate-500">
                TOTAL ANGGARAN ${ui.statPeriodMode === 'yearly' ? 'TAHUNAN' : 'BULANAN'}
              </span>
              <button onclick="openBulkBudgetModal()" class="px-3 py-1 rounded-xl bg-creamCard hover:bg-stone-200/70 border border-stone-200 text-xs font-medium text-ink">
                Atur Semua
              </button>
            </div>
            <div class="flex items-baseline gap-1.5 flex-wrap">
              <span class="text-2xl font-medium text-ink">${formatCurrency(totalSpent)}</span>
              <span class="text-xs text-slate-400">/ ${formatCurrency(totalBudget)}</span>
            </div>
            <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-300 ${overallPct > 100 ? 'bg-coral' : 'bg-sage'}" style="width: ${Math.min(100, overallPct)}%"></div>
            </div>
            <div class="flex items-center justify-between text-xs text-slate-500">
              <span>Terpakai ${overallPct}%</span>
              <span class="${overallRemaining < 0 ? 'text-coral' : 'text-sage'}">
                ${overallRemaining < 0 ? `Lebih ${formatCurrency(Math.abs(overallRemaining))}` : `Sisa ${formatCurrency(overallRemaining)}`}
              </span>
            </div>
          </div>

          <!-- Daftar Kategori Evaluasi Anggaran -->
          ${catRows.map(({ cat, limit, spent, pct, isOver, isWarn }) => {
            const hasSubs = cat.subcategories && cat.subcategories.length > 0;
            const expanded = Boolean(ui.expandedBudgetCats[cat.id]);
            const badgeCls = isOver
              ? 'bg-coralLight text-coral'
              : isWarn
                ? 'bg-amber-50 text-amber-700'
                : 'bg-sageLight text-sage';
            const badgeText = isOver ? 'Melebihi' : isWarn ? 'Hampir' : 'Aman';
            const barColor = isOver ? 'bg-coral' : isWarn ? 'bg-amber-500' : 'bg-sage';

            return `
              <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-2.5">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0 flex-1">
                    ${hasSubs ? `
                      <button onclick="toggleBudgetCatExpand('${cat.id}')" class="w-7 h-7 rounded-xl bg-creamCard border border-stone-200/80 flex items-center justify-center text-slate-600 shrink-0">
                        <svg class="w-4 h-4 transition-transform ${expanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                      </button>
                    ` : ''}
                    <div class="min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <button onclick="openCategoryDrilldown('${cat.id}')" class="text-sm font-medium text-ink hover:underline text-left truncate">
                          ${cat.name}
                        </button>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-medium ${badgeCls}">${badgeText}</span>
                      </div>
                      <div class="text-xs text-slate-500 mt-0.5">
                        <span class="font-medium text-ink">${formatCurrency(spent)}</span> dari ${formatCurrency(limit)} (${pct}%)
                      </div>
                    </div>
                  </div>
                  <button onclick="openEditCategoryLimitModal('${cat.id}')" class="px-2.5 py-1.5 rounded-xl bg-creamCard hover:bg-stone-200/70 border border-stone-200 text-[11px] font-medium text-ink shrink-0">
                    Edit Limit
                  </button>
                </div>

                <div class="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
                  <div class="h-full rounded-full ${barColor}" style="width: ${Math.min(100, pct)}%"></div>
                </div>

                ${hasSubs && expanded ? `
                  <div class="pt-2 mt-2 border-t border-stone-100 space-y-2 pl-2">
                    ${cat.subcategories.map(sub => {
                      const subLimit = (Number(sub.limit) || 0) * multiplier;
                      const subSpent = periodTxs
                        .filter(t => t.categoryId === cat.id && t.subcategoryId === sub.id)
                        .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
                      const subPct = subLimit > 0 ? Math.round((subSpent / subLimit) * 100) : 0;
                      return `
                        <div class="bg-creamCard/70 rounded-2xl p-2.5 border border-stone-200/50 space-y-1.5">
                          <div class="flex items-center justify-between gap-2 text-xs">
                            <span class="font-medium text-ink truncate">${sub.name}</span>
                            <button onclick="openEditSubLimitModal('${cat.id}', '${sub.id}')" class="text-[11px] text-sage hover:underline shrink-0">Atur Limit</button>
                          </div>
                          <div class="flex items-center justify-between text-[11px] text-slate-500">
                            <span>${formatCurrency(subSpent)} / ${formatCurrency(subLimit)}</span>
                            <span>${subPct}%</span>
                          </div>
                          <div class="w-full h-1.5 bg-stone-200/70 rounded-full overflow-hidden">
                            <div class="h-full rounded-full ${subPct > 100 ? 'bg-coral' : 'bg-sage'}" style="width: ${Math.min(100, subPct)}%"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCategoryBreakdownSection() {
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense');
      const totalExpense = periodTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
      const expenseCats = db.categories.filter(c => c.type === 'expense');

      const items = expenseCats.map((cat, idx) => {
        const spent = periodTxs
          .filter(t => t.categoryId === cat.id)
          .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        const share = totalExpense > 0 ? Math.round((spent / totalExpense) * 100) : 0;
        const color = ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length];
        return { cat, spent, share, color };
      }).sort((a, b) => b.spent - a.spent);

      return `
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wider text-slate-500">TOTAL PENGELUARAN PERIODE INI</span>
            <span class="text-base font-medium text-coral">${formatCurrency(totalExpense)}</span>
          </div>

          <div class="divide-y divide-stone-100">
            ${items.map(({ cat, spent, share, color }) => `
              <button onclick="openCategoryDrilldown('${cat.id}')" class="w-full py-3 flex items-center justify-between gap-3 text-left hover:bg-creamCard/50 rounded-2xl px-2 transition-colors">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${color.hex};"></span>
                  <div class="min-w-0">
                    <div class="text-sm font-medium text-ink truncate">${cat.name}</div>
                    <div class="text-[11px] text-slate-400">${share}% dari total pengeluaran</div>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="text-sm font-medium text-ink">${formatCurrency(spent)}</span>
                  <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCategoryDrilldown() {
      const cat = db.categories.find(c => c.id === ui.drilldownCategoryId);
      if (!cat) {
        ui.drilldownCategoryId = null;
        return renderStatistikView();
      }

      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense' && t.categoryId === cat.id);

      const filteredTxs = ui.drilldownSubcategoryId === 'ALL'
        ? periodTxs
        : periodTxs.filter(t => t.subcategoryId === ui.drilldownSubcategoryId);

      const totalSpent = filteredTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);

      return `
        <div class="p-4 space-y-4 animate-fade-in">
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #9CA4E4; border-color: #848ED6;">
            <div class="flex items-center gap-2.5">
              <button onclick="closeCategoryDrilldown()" class="p-2 rounded-xl bg-white/90 text-ink hover:bg-white">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              </button>
              <div>
                <h1 class="text-base font-medium uppercase tracking-wider" style="color: #FFF6D6;">${cat.name}</h1>
                <p class="text-xs" style="color: #F4F5FF;">Total: ${formatCurrency(totalSpent)} (${filteredTxs.length} transaksi)</p>
              </div>
            </div>

            ${(cat.subcategories && cat.subcategories.length > 0) ? `
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-1">
                <button onclick="setDrilldownSubcategory('ALL')" class="px-3 py-1.5 rounded-xl text-xs font-medium shrink-0 ${ui.drilldownSubcategoryId === 'ALL' ? 'bg-ink text-[#FFF6D6]' : 'bg-white/90 text-ink'}">
                  Semua
                </button>
                ${cat.subcategories.map(sub => `
                  <button onclick="setDrilldownSubcategory('${sub.id}')" class="px-3 py-1.5 rounded-xl text-xs font-medium shrink-0 ${ui.drilldownSubcategoryId === sub.id ? 'bg-ink text-[#FFF6D6]' : 'bg-white/90 text-ink'}">
                    ${sub.name}
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
            ${filteredTxs.length === 0 ? `
              <div class="py-8 text-center text-xs text-slate-400">Belum ada transaksi di kategori ini pada periode terpilih.</div>
            ` : `
              <div class="divide-y divide-stone-100">
                ${filteredTxs.sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(tx => renderTransactionRow(tx)).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8B. VIEW TABUNGAN (TARGET CELENGAN NON-BABI, SETOR, TARIK & RIWAYAT)
    // =========================================================================
    function renderTabunganView() {
      if (ui.selectedSavingGoalId) {
        return renderSavingGoalDetailView();
      }

      const goals = db.savingsGoals || [];
      const totalSaved = goals.reduce((s, g) => s + getSavingGoalBalanceIDR(g), 0);
      const totalTarget = goals.reduce((s, g) => s + (Number(g.targetAmount) || 0), 0);
      const overallPct = totalTarget > 0 ? Math.min(100, Math.round((totalSaved / totalTarget) * 100)) : 0;

      return `
        <div class="p-4 space-y-4">
          <!-- Header Tabungan (Pantone Green Glow #B0C965 — tanpa kotak ikon) -->
          <div class="rounded-3xl p-4 shadow-sm border flex items-center justify-between gap-2" style="background-color: #B0C965; border-color: #9BB550;">
            <div>
              <h1 class="text-xl font-medium uppercase tracking-wider" style="color: #233814;">TABUNGAN</h1>
              <p class="text-xs" style="color: #2F4A1C;">Terhubung ke Akun & masuk dalam Total Aset</p>
            </div>
            <button onclick="openSavingGoalModal()" class="px-3.5 py-2 rounded-2xl text-xs font-medium shadow-sm hover:opacity-95 active:scale-95 transition-all shrink-0" style="background-color: #233814; color: #F5FCE8;">
              + Target
            </button>
          </div>

          <!-- Kartu Ringkasan Total Tabungan (Soft Mint No Chip #DDF2B8 tint muda) -->
          <div class="rounded-3xl p-5 shadow-sm border relative overflow-hidden" style="background: linear-gradient(135deg, #F3FBE7 0%, #E4F5CB 100%); border-color: #C7E39D;">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 rounded-full bg-white/50 pointer-events-none"></div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-medium uppercase tracking-wider text-[#233814]">TOTAL TABUNGAN (BAGIAN DARI ASET)</span>
              <span class="px-2.5 py-0.5 rounded-full bg-white/90 text-[#233814] text-[11px] font-medium">${overallPct}% dari Target</span>
            </div>
            <div class="text-2xl sm:text-3xl font-medium tracking-tight mt-1 text-ink">
              ${formatCurrency(totalSaved)}
            </div>
            <div class="text-xs text-slate-600 mt-1">
              Target Keseluruhan: <span class="text-ink">${formatCurrency(totalTarget)}</span> (${goals.length} celengan)
            </div>
            <div class="w-full h-2 bg-white/85 rounded-full overflow-hidden mt-3">
              <div class="h-full bg-sage rounded-full transition-all duration-300" style="width: ${overallPct}%"></div>
            </div>
          </div>

          <!-- Daftar Target Tabungan (Tint Pastel Muda per Item) -->
          <div class="space-y-3.5">
            ${goals.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center border border-stone-200/70 space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-creamCard text-sage mx-auto flex items-center justify-center">
                  ${ICONS.celengan}
                </div>
                <div class="text-sm font-medium text-ink">Belum ada celengan tabungan</div>
                <p class="text-xs text-slate-400">Buat target tabungan dan pilih akun penyimpanannya.</p>
              </div>
            ` : goals.map(g => {
              const color = getColorObj(g.colorId || 'emerald');
              const iconSvg = ICONS[g.icon] || ICONS.celengan;
              const currentSavedIDR = getSavingGoalBalanceIDR(g);
              const pct = g.targetAmount > 0 ? Math.min(100, Math.round((currentSavedIDR / g.targetAmount) * 100)) : 0;
              const remaining = Math.max(0, g.targetAmount - currentSavedIDR);
              const isCompleted = currentSavedIDR >= g.targetAmount && g.targetAmount > 0;
              const linkedAcc = db.accounts.find(a => a.id === g.accountId);
              const linkedPkt = linkedAcc?.pockets?.find(p => p.id === g.pocketId);

              return `
                <div class="rounded-3xl p-4 shadow-sm border space-y-3 transition-all" style="background-color: ${color.bg}; border-color: ${color.border};">
                  <div class="flex items-start justify-between gap-2">
                    <button onclick="openSavingGoalDetail('${g.id}')" class="flex items-center gap-3 text-left min-w-0 flex-1 group">
                      <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shrink-0 shadow-xs" style="background-color: ${color.hex};">
                        ${iconSvg}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <h3 class="text-base font-medium text-ink group-hover:underline truncate">${g.name}</h3>
                          ${isCompleted ? `<span class="px-2 py-0.5 rounded-full bg-white text-sage text-[10px] font-medium">TERCAPAI</span>` : ''}
                        </div>
                        <div class="flex items-center gap-1.5 mt-0.5">

    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modal-backdrop') {
        closeModal();
      }
    }

    function submitEditCategoryLimit(e, catId) {
      e.preventDefault();
      const cat = db.categories.find(c => c.id === catId);
      if (!cat) return;
      const newLimit = Math.max(0, Number(document.getElementById('input-cat-limit').value) || 0);

      if (cat.subcategories && cat.subcategories.length > 0) {
        const oldSubSum = cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
        if (oldSubSum > 0) {
          let allocated = 0;
          cat.subcategories.forEach((sub, idx) => {
            if (idx === cat.subcategories.length - 1) {
              sub.limit = Math.max(0, newLimit - allocated);
            } else {
              const share = Math.round((sub.limit / oldSubSum) * newLimit);
              sub.limit = share;
              allocated += share;
            }
          });
        } else {
          cat.directLimit = newLimit;
        }
      } else {
        cat.directLimit = newLimit;
      }

      saveData();
      closeModal();
      showToast('Limit kategori diperbarui');
      render();
    }

    function parseFormattedNumber(raw) {
      const cleaned = String(raw || '').replace(/\./g, '').replace(',', '.');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    }

    function formatTxAmountInput(el) {
      let val = el.value.replace(/[^0-9,]/g, '');
      const parts = val.split(',');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      el.value = parts.length > 1 ? parts[0] + ',' + parts[1].slice(0, 2) : parts[0];
    }

    function appendTxZeros(zeros) {
      const el = document.getElementById('tx-amount');
      if (!el) return;
      const num = parseFormattedNumber(el.value);
      if (num <= 0) return;
      const next = Math.round(num * Math.pow(10, zeros.length));
      el.value = next.toLocaleString('id-ID');
    }

    function switchTxModalType(type) {
      document.getElementById('tx-type').value = type;
      ['expense', 'income', 'transfer'].forEach(t => {
        const btn = document.getElementById(`tx-tab-${t}`);
        if (t === type) {
          const activeBg = t === 'expense' ? 'bg-coral text-white shadow-2xs' : t === 'income' ? 'bg-sage text-white shadow-2xs' : 'bg-[#2B5B67] text-white shadow-2xs';
          btn.className = `py-2 rounded-xl transition-all ${activeBg}`;
        } else {
          btn.className = 'py-2 rounded-xl transition-all text-slate-600';
        }
      });

      const catSec = document.getElementById('tx-category-section');
      const toSec = document.getElementById('tx-to-section');
      const accLbl = document.getElementById('tx-acc-label');
      const pktLbl = document.getElementById('tx-pkt-label');

      if (type === 'transfer') {
        catSec.classList.add('hidden');
        toSec.className = 'grid grid-cols-2 gap-2.5 pt-1';
        accLbl.textContent = 'Dari Akun';
        pktLbl.textContent = 'Dari Pocket';
      } else {
        catSec.className = 'space-y-3';
        toSec.classList.add('hidden');
        accLbl.textContent = 'Akun';
        pktLbl.textContent = 'Pocket';
        populateTxCategories(type);
      }
    }

    function populateTxCategories(type) {
      const sel = document.getElementById('tx-category');
      if (!sel) return;
      const cats = db.categories.filter(c => c.type === type);
      sel.innerHTML = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      onTxCategoryChange();
    }

    function onTxCategoryChange() {
      const catId = document.getElementById('tx-category')?.value;
      const cat = db.categories.find(c => c.id === catId);
      const wrap = document.getElementById('tx-subcategory-wrap');
      const subSel = document.getElementById('tx-subcategory');
      if (!wrap || !subSel) return;

      if (cat && cat.subcategories && cat.subcategories.length > 0) {
        wrap.classList.remove('hidden');
        subSel.innerHTML = `<option value="">-- Umum / Tanpa Subkategori --</option>` +
          cat.subcategories.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      } else {
        wrap.classList.add('hidden');
        subSel.innerHTML = `<option value=""></option>`;
      }
    }

    function onTxAccountChange() {
      populateTxPockets('tx-account', 'tx-pocket');
    }

    function onTxToAccountChange() {
      populateTxPockets('tx-to-account', 'tx-to-pocket');
    }

    function populateTxPockets(accSelectId, pktSelectId, preferredPktId = null) {
      const accId = document.getElementById(accSelectId)?.value;
      const pktSel = document.getElementById(pktSelectId);
      const acc = db.accounts.find(a => a.id === accId);
      if (!acc || !pktSel) return;

      pktSel.innerHTML = (acc.pockets || []).map(p =>
        `<option value="${p.id}" ${preferredPktId === p.id ? 'selected' : ''}>${p.name} (${formatCurrency(p.balance, acc.currency)})</option>`
      ).join('');
    }

    function submitTxModal(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const amount = parseFormattedNumber(document.getElementById('tx-amount').value);
      const date = document.getElementById('tx-date').value;
      const accountId = document.getElementById('tx-account').value;
      const pocketId = document.getElementById('tx-pocket').value;
      const title = document.getElementById('tx-title').value.trim();

      if (amount <= 0) {
        showToast('Nominal harus lebih dari 0', 'error');
        return;
      }

      const srcAcc = db.accounts.find(a => a.id === accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === pocketId);
      if (!srcAcc || !srcPkt) return;

      if (type === 'transfer') {
        const toAccountId = document.getElementById('tx-to-account').value;
        const toPocketId = document.getElementById('tx-to-pocket').value;
        if (accountId === toAccountId && pocketId === toPocketId) {
          showToast('Pocket tujuan tidak boleh sama dengan asal', 'error');
          return;
        }
        const dstAcc = db.accounts.find(a => a.id === toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === toPocketId);
        if (!dstAcc || !dstPkt) return;

        srcPkt.balance = Number(srcPkt.balance) - amount;
        const amountInIDR = toIDR(amount, srcAcc.currency);
        const dstRate = db.exchangeRates[dstAcc.currency] || 1;
        const convertedToDst = dstAcc.currency === srcAcc.currency ? amount : Number((amountInIDR / dstRate).toFixed(2));
        dstPkt.balance = Number(dstPkt.balance) + convertedToDst;

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'transfer',
          date,
          amount,
          categoryId: '',
          subcategoryId: '',
          title: title || `Transfer ke ${dstPkt.name}`,
          accountId,
          pocketId,
          toAccountId,
          toPocketId
        });
      } else {
        const categoryId = document.getElementById('tx-category').value;
        const subcategoryId = document.getElementById('tx-subcategory')?.value || '';

        if (type === 'expense') {
          srcPkt.balance = Number(srcPkt.balance) - amount;
        } else {
          srcPkt.balance = Number(srcPkt.balance) + amount;
        }

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type,
          date,
          amount,
          categoryId,
          subcategoryId,
          title,
          accountId,
          pocketId
        });
      }

      touchSessionActivity();
      saveData();
      closeModal();
      showToast('Transaksi tersimpan & saldo diperbarui');
      render();
    }

    function deleteTransaction(txId) {
      const idx = db.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = db.transactions[idx];

      const srcAcc = db.accounts.find(a => a.id === tx.accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === tx.pocketId);

      if (srcPkt) {
        if (tx.type === 'expense') {
          srcPkt.balance += Number(tx.amount) || 0;
        } else if (tx.type === 'income') {
          srcPkt.balance -= Number(tx.amount) || 0;
        } else if (tx.type === 'transfer') {
          srcPkt.balance += Number(tx.amount) || 0;
          const dstAcc = db.accounts.find(a => a.id === tx.toAccountId);
          const dstPkt = dstAcc?.pockets?.find(p => p.id === tx.toPocketId);
          if (dstPkt) {
            const amountInIDR = toIDR(tx.amount, srcAcc.currency);
            const dstRate = db.exchangeRates[dstAcc.currency] || 1;
            const convertedToDst = dstAcc.currency === srcAcc.currency ? tx.amount : Number((amountInIDR / dstRate).toFixed(2));
            dstPkt.balance -= convertedToDst;
          }
        }
      }

      db.transactions.splice(idx, 1);
      saveData();
      showToast('Transaksi dihapus & saldo dikembalikan');
      render();
    }

    function updateDebtHint() {
      const val = document.getElementById('debt-type').value;
      const hint = document.getElementById('debt-hint');
      if (val === 'payable') {
        hint.className = 'text-[11px] text-sage mt-1';
        hint.textContent = '* Mencatat hutang baru akan otomatis menambah saldo akun tujuan.';
      } else {
        hint.className = 'text-[11px] text-coral mt-1';
        hint.textContent = '* Mencatat piutang baru (meminjamkan uang) akan otomatis mengurangi saldo akun.';
      }
    }

    function submitDebtModal(e) {
      e.preventDefault();
      const type = document.getElementById('debt-type').value;
      const person = document.getElementById('debt-person').value.trim();
      const amount = Number(document.getElementById('debt-amount').value) || 0;
      const dueDate = document.getElementById('debt-due').value;
      const accountId = document.getElementById('debt-account').value;
      const pocketId = document.getElementById('debt-pocket').value;
      const note = document.getElementById('debt-note').value.trim();
      const todayStr = new Date().toISOString().slice(0, 10);

      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || amount <= 0) return;

      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? amount : Number((amount / rate).toFixed(2));

      if (type === 'payable') {
        pkt.balance += amountInAccCur;
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'income',
          date: todayStr,
          amount: amountInAccCur,
          categoryId: 'cat_lainnya_in',
          subcategoryId: '',
          title: `Terima Hutang dari ${person}`,
          accountId,
          pocketId
        });
      } else {
        pkt.balance -= amountInAccCur;
        const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          date: todayStr,
          amount: amountInAccCur,
          categoryId: fallbackExpCat,
          subcategoryId: '',
          title: `Pinjaman (Piutang) ke ${person}`,
          accountId,
          pocketId
        });
      }

      db.debts.unshift({
        id: 'debt_' + Date.now(),
        type,
        person,
        totalAmount: amount,
        paidAmount: 0,
        dueDate,
        note,
        accountId,
        pocketId,
        createdAt: todayStr
      });

      saveData();
      closeModal();
      showToast(type === 'payable' ? 'Hutang dicatat & saldo akun bertambah' : 'Piutang dicatat & saldo akun berkurang');
      render();
    }

    function submitSettleDebt(e, debtId) {
      e.preventDefault();
      const d = db.debts.find(item => item.id === debtId);
      if (!d) return;

      const payVal = Number(document.getElementById('settle-amount').value) || 0;
      const accountId = document.getElementById('settle-account').value;
      const pocketId = document.getElementById('settle-pocket').value;
      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || payVal <= 0) return;

      const todayStr = new Date().toISOString().slice(0, 10);
      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? payVal : Number((payVal / rate).toFixed(2));

      d.paidAmount += payVal;

      if (d.type === 'payable') {
        pkt.balance -= amountInAccCur;
        const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          date: todayStr,
          amount: amountInAccCur,
          categoryId: fallbackExpCat,
          subcategoryId: '',
          title: `Bayar Hutang ke ${d.person}`,
          accountId,
          pocketId
        });
      } else {

    function submitSavingGoalModal(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('sav-name').value.trim();
      const targetAmount = Math.max(1000, Number(document.getElementById('sav-target').value) || 0);
      const deadline = document.getElementById('sav-deadline').value;

      const storagePktEl = document.getElementById('sav-storage-pkt');
      const storageAccId = storageAccEl ? storageAccEl.value : (db.accounts[0]?.id || '');
      let storagePktId = storagePktEl ? storagePktEl.value : '__NEW_POCKET__';

      const storageAcc = db.accounts.find(a => a.id === storageAccId);
      if (!storageAcc) return;

      if (!db.savingsGoals) db.savingsGoals = [];

      if (storagePktId === '__NEW_POCKET__') {
        const newPktId = 'pkt_sav_' + Date.now();
        storageAcc.pockets.push({
          id: newPktId,
          name: `Tabungan: ${name}`,
          balance: 0
        });
        storagePktId = newPktId;
      }

      const targetPkt = storageAcc.pockets.find(p => p.id === storagePktId);
      const rate = db.exchangeRates[storageAcc.currency] || 1;
      const todayStr = new Date().toISOString().slice(0, 10);

      if (existingId) {
        const g = db.savingsGoals.find(item => item.id === existingId);
        if (g) {
          g.name = name;
          g.targetAmount = targetAmount;
          g.deadline = deadline;
          g.note = note;
          g.colorId = colorId;
          g.icon = icon;
          g.accountId = storageAccId;
          g.pocketId = storagePktId;
          g.currentAmount = getSavingGoalBalanceIDR(g);
        }
        showToast('Target tabungan & akun penyimpanan diperbarui');
      } else {
        const initAmountIDR = Math.max(0, Number(document.getElementById('sav-init')?.value) || 0);
        if (initAmountIDR > 0 && targetPkt) {
          const addInAccCur = storageAcc.currency === 'IDR' ? initAmountIDR : Number((initAmountIDR / rate).toFixed(2));
          targetPkt.balance = Number(targetPkt.balance) + addInAccCur;
        }
        const totalInGoalIDR = targetPkt ? toIDR(targetPkt.balance, storageAcc.currency) : initAmountIDR;

        db.savingsGoals.push({
          id: 'sav_' + Date.now(),
          name,
          targetAmount,
          currentAmount: totalInGoalIDR,
          accountId: storageAccId,
          pocketId: storagePktId,
          deadline,
          colorId,
          icon,
          note,
          history: initAmountIDR > 0 ? [{
            id: 'sh_' + Date.now(),
            type: 'deposit',
            amount: initAmountIDR,
            date: todayStr,
            accountId: storageAccId,
            pocketId: storagePktId,
            note: 'Saldo awal tabungan'
          }] : []
        });
        showToast(`Target dibuat & ditaruh di ${storageAcc.name}`);
      }

      saveData();
      closeModal();
      render();
    }

    function submitSavingTransfer(e, goalId, actionType) {
      e.preventDefault();
      const g = (db.savingsGoals || []).find(item => item.id === goalId);
      if (!g) return;

      const amountIDR = Number(document.getElementById('sav-tx-amount').value) || 0;
      const date = document.getElementById('sav-tx-date').value;
      const otherAccId = document.getElementById('sav-tx-acc').value;
      const otherPktId = document.getElementById('sav-tx-pkt').value;
      const note = document.getElementById('sav-tx-note').value.trim();

      const otherAcc = db.accounts.find(a => a.id === otherAccId);
      const otherPkt = otherAcc?.pockets?.find(p => p.id === otherPktId);
      const savAcc = db.accounts.find(a => a.id === g.accountId);
      const savPkt = savAcc?.pockets?.find(p => p.id === g.pocketId);

      if (!otherAcc || !otherPkt || amountIDR <= 0) return;

      const currentSavedIDR = getSavingGoalBalanceIDR(g);
      if (actionType === 'withdraw' && amountIDR > currentSavedIDR) {
        showToast('Nominal tarik melebihi saldo tabungan', 'error');
        return;
      }

      const otherRate = db.exchangeRates[otherAcc.currency] || 1;
      const amountInOtherCur = otherAcc.currency === 'IDR' ? amountIDR : Number((amountIDR / otherRate).toFixed(2));
      const savRate = savAcc ? (db.exchangeRates[savAcc.currency] || 1) : 1;
      const amountInSavCur = (!savAcc || savAcc.currency === 'IDR') ? amountIDR : Number((amountIDR / savRate).toFixed(2));

      if (actionType === 'deposit') {
        if (savAcc && savPkt && savAcc.id === otherAcc.id && savPkt.id === otherPkt.id) {
          savPkt.balance = Number(savPkt.balance) + amountInSavCur;
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'income',
            date,
            amount: amountInSavCur,
            categoryId: 'cat_lainnya_in',
            subcategoryId: '',
            title: `Setor Tabungan: ${g.name}`,
            accountId: savAcc.id,
            pocketId: savPkt.id
          });
        } else {
          otherPkt.balance = Number(otherPkt.balance) - amountInOtherCur;
          if (savPkt) {
            savPkt.balance = Number(savPkt.balance) + amountInSavCur;
          }
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'transfer',
            date,
            amount: amountInOtherCur,
            categoryId: '',
            subcategoryId: '',
            title: `Setor Tabungan: ${g.name}`,
            accountId: otherAcc.id,
            pocketId: otherPkt.id,
            toAccountId: savAcc ? savAcc.id : otherAcc.id,
            toPocketId: savPkt ? savPkt.id : otherPkt.id
          });
        }
      } else {
        if (savAcc && savPkt && savAcc.id === otherAcc.id && savPkt.id === otherPkt.id) {
          savPkt.balance = Math.max(0, Number(savPkt.balance) - amountInSavCur);
          const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'expense',
            date,
            amount: amountInSavCur,
            categoryId: fallbackExpCat,
            subcategoryId: '',
            title: `Tarik Tabungan: ${g.name}`,
            accountId: savAcc.id,
            pocketId: savPkt.id
          });
        } else {
          if (savPkt) {
            savPkt.balance = Math.max(0, Number(savPkt.balance) - amountInSavCur);
          }
          otherPkt.balance = Number(otherPkt.balance) + amountInOtherCur;
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'transfer',
            date,
            amount: amountInSavCur,
            categoryId: '',
            subcategoryId: '',
            title: `Tarik Tabungan: ${g.name}`,
            accountId: savAcc ? savAcc.id : otherAcc.id,
            pocketId: savPkt ? savPkt.id : otherPkt.id,
            toAccountId: otherAcc.id,
            toPocketId: otherPkt.id
          });
        }
      }

      g.currentAmount = getSavingGoalBalanceIDR(g);

      if (!g.history) g.history = [];
      g.history.unshift({
        id: 'sh_' + Date.now(),
        type: actionType,
        amount: amountIDR,
        date,
        accountId: otherAccId,
        pocketId: otherPktId,
        note: note || (actionType === 'deposit' ? 'Setor tabungan' : 'Tarik tabungan')
      });

      saveData();
      closeModal();
      showToast(actionType === 'deposit' ? 'Setoran tercatat & tersimpan di akun' : 'Dana tabungan dipindahkan ke akun tujuan');
      render();
    }
