              <p class="text-xs text-slate-500">Limit subkategori otomatis dijumlahkan ke kategori induk</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-slate-500">✕</button>
          </div>

          <form onsubmit="submitBulkBudget(event)" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
            ${expenseCats.map(cat => {
              const hasSubs = cat.subcategories && cat.subcategories.length > 0;
              if (hasSubs) {
                return `
                  <div class="bg-creamCard p-3 rounded-2xl border border-stone-200/80 space-y-2">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-extrabold text-ink">${cat.name}</span>
                      <span class="text-[11px] font-bold text-sage">Total: ${formatCurrency(getCategoryLimit(cat))}</span>
                    </div>
                    ${cat.subcategories.map(sub => `
                      <div class="flex items-center justify-between gap-2 pl-2">
                        <label class="text-xs text-slate-600 truncate flex-1">${sub.name}</label>
                        <input type="number" data-sub-cat="${cat.id}" data-sub-id="${sub.id}" value="${sub.limit || 0}" min="0" step="1000"
                          class="w-32 px-2.5 py-1.5 rounded-xl bg-white border border-stone-200 text-xs font-bold text-right" />
                      </div>
                    `).join('')}
                  </div>
                `;
              }
              return `
                <div class="bg-creamCard p-3 rounded-2xl border border-stone-200/80 flex items-center justify-between gap-2">
                  <label class="text-xs font-extrabold text-ink flex-1">${cat.name}</label>
                  <input type="number" data-direct-cat="${cat.id}" value="${cat.directLimit || 0}" min="0" step="1000"
                    class="w-36 px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-xs font-bold text-right" />
                </div>
              `;
            }).join('')}

            <div class="flex gap-2 pt-2 sticky bottom-0 bg-white">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-3 rounded-2xl bg-ink text-white text-xs font-bold">Simpan Semua</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitBulkBudget(e) {
      e.preventDefault();
      document.querySelectorAll('[data-direct-cat]').forEach(inp => {
        const cat = db.categories.find(c => c.id === inp.dataset.directCat);
        if (cat) cat.directLimit = Math.max(0, Number(inp.value) || 0);
      });
      document.querySelectorAll('[data-sub-id]').forEach(inp => {
        const cat = db.categories.find(c => c.id === inp.dataset.subCat);
        const sub = cat?.subcategories?.find(s => s.id === inp.dataset.subId);
        if (sub) sub.limit = Math.max(0, Number(inp.value) || 0);
      });
      saveData();
      closeModal();
      showToast('Seluruh anggaran berhasil disimpan');
      render();
    }

    // -------------------------------------------------------------------------
    // 10B. MODAL TAMBAH / EDIT AKUN (PILIHAN WARNA, IKON CELENGAN, & VALAS)
    // -------------------------------------------------------------------------
    function openAccountModal(accountId = null) {
      const existing = accountId ? db.accounts.find(a => a.id === accountId) : null;
      const selectedColor = existing ? existing.colorId : 'emerald';
      const selectedIcon = existing ? existing.icon : 'celengan';
      const selectedCurrency = existing ? existing.currency : 'IDR';

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-extrabold text-ink">${existing ? 'Edit Akun' : 'Tambah Akun Baru'}</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-slate-500">✕</button>
          </div>

          <form onsubmit="submitAccountModal(event, '${existing ? existing.id : ''}')" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Nama Akun</label>
              <input type="text" id="acc-name" value="${existing ? existing.name : ''}" placeholder="Contoh: Bank Mandiri / Tabungan USD" required
                class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-sm font-bold text-ink focus:outline-none focus:border-ink" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Mata Uang Akun</label>
              <select id="acc-currency" class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-sm font-bold text-ink">
                ${Object.entries(CURRENCY_META).map(([code, m]) => `
                  <option value="${code}" ${selectedCurrency === code ? 'selected' : ''}>${code} — ${m.name} (${m.symbol})</option>
                `).join('')}
              </select>
            </div>

            ${!existing ? `
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Saldo Awal Pocket Utama</label>
                <input type="number" id="acc-init-bal" value="0" step="any" required
                  class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-sm font-extrabold text-ink" />
              </div>
            ` : `
              <div class="bg-creamCard p-3 rounded-2xl border border-stone-200/70">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-semibold text-slate-500">Total Saldo Akun (Dari ${existing.pockets.length} Pocket)</span>
                  <span class="font-extrabold text-ink">${formatCurrency(getAccountTotalBalance(existing), existing.currency)}</span>
                </div>
                <p class="text-[11px] text-slate-400 mt-1">Edit nominal masing-masing pocket di daftar Akun untuk menyesuaikan total saldo.</p>
              </div>
            `}

            <!-- Pilihan Warna Akun -->
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1.5">Pilih Warna Akun</label>
              <input type="hidden" id="acc-color" value="${selectedColor}" />
              <div class="grid grid-cols-4 gap-2" id="color-picker-grid">
                ${ACCOUNT_COLORS.map(c => `
                  <button type="button" onclick="selectAccColor('${c.id}')" data-color-btn="${c.id}"
                    class="p-2 rounded-xl border-2 flex items-center gap-1.5 text-[11px] font-bold transition-all ${selectedColor === c.id ? 'border-ink scale-[1.02]' : 'border-transparent'}"
                    style="background-color: ${c.bg}; color: ${c.text};">
                    <span class="w-3.5 h-3.5 rounded-full shrink-0" style="background-color: ${c.hex};"></span>
                    <span class="truncate">${c.name.split(' ')[0]}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Pilihan Ikon (Celengan non-babi tersedia) -->
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1.5">Pilih Ikon Akun</label>
              <input type="hidden" id="acc-icon" value="${selectedIcon}" />
              <div class="grid grid-cols-4 gap-2" id="icon-picker-grid">
                ${Object.entries(ICONS).map(([key, svg]) => `
                  <button type="button" onclick="selectAccIcon('${key}')" data-icon-btn="${key}"
                    class="p-2.5 rounded-xl border flex flex-col items-center justify-center gap-1 transition-all ${selectedIcon === key ? 'bg-ink text-white border-ink' : 'bg-creamCard text-slate-600 border-stone-200'}">
                    ${svg}
                    <span class="text-[10px] font-bold">${ICON_LABELS[key]}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="flex gap-2 pt-2">
              ${existing && db.accounts.length > 1 ? `
                <button type="button" onclick="deleteAccount('${existing.id}')" class="px-3.5 py-3 rounded-2xl bg-coralLight text-coral text-xs font-bold">Hapus</button>
              ` : ''}
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-3 rounded-2xl bg-ink text-white text-xs font-bold">Simpan Akun</button>
            </div>
          </form>
        </div>
      `);
    }

    function selectAccColor(colorId) {
      document.getElementById('acc-color').value = colorId;
      document.querySelectorAll('[data-color-btn]').forEach(btn => {
        if (btn.dataset.colorBtn === colorId) {
          btn.classList.add('border-ink', 'scale-[1.02]');
          btn.classList.remove('border-transparent');
        } else {
          btn.classList.remove('border-ink', 'scale-[1.02]');
          btn.classList.add('border-transparent');
        }
      });
    }

    function selectAccIcon(iconKey) {
      document.getElementById('acc-icon').value = iconKey;
      document.querySelectorAll('[data-icon-btn]').forEach(btn => {
        if (btn.dataset.iconBtn === iconKey) {
          btn.className = 'p-2.5 rounded-xl border flex flex-col items-center justify-center gap-1 transition-all bg-ink text-white border-ink';
        } else {
          btn.className = 'p-2.5 rounded-xl border flex flex-col items-center justify-center gap-1 transition-all bg-creamCard text-slate-600 border-stone-200';
        }
      });
    }

    function submitAccountModal(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('acc-name').value.trim();
      const currency = document.getElementById('acc-currency').value;
      const colorId = document.getElementById('acc-color').value;
      const icon = document.getElementById('acc-icon').value;

      if (existingId) {
        const acc = db.accounts.find(a => a.id === existingId);
        if (acc) {
          acc.name = name;
          acc.currency = currency;
          acc.colorId = colorId;
          acc.icon = icon;
        }
        showToast('Perubahan akun disimpan');
      } else {
        const initBal = Number(document.getElementById('acc-init-bal').value) || 0;
        db.accounts.push({
          id: 'acc_' + Date.now(),
          name,
          currency,
          colorId,
          icon,
          pockets: [
            { id: 'pkt_' + Date.now(), name: 'Pocket Utama', balance: initBal }
          ]
        });
        showToast('Akun baru ditambahkan');
      }

      saveData();
      closeModal();
      render();
    }

    function deleteAccount(accId) {
      if (db.accounts.length <= 1) {
        showToast('Minimal harus ada 1 akun', 'error');
        return;
      }
      db.accounts = db.accounts.filter(a => a.id !== accId);
      saveData();
      closeModal();
      showToast('Akun dihapus');
      render();
    }

    // -------------------------------------------------------------------------
    // 10C. MODAL TAMBAH / EDIT POCKET (OTOMATIS SESUAIKAN TOTAL SALDO AKUN)
    // -------------------------------------------------------------------------
    function openPocketModal(accountId, pocketId = null) {
      const acc = db.accounts.find(a => a.id === accountId);
      if (!acc) return;
      const pkt = pocketId ? acc.pockets.find(p => p.id === pocketId) : null;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] font-bold text-slate-400 uppercase">${acc.name} (${acc.currency})</span>
              <h3 class="text-lg font-extrabold text-ink">${pkt ? 'Edit Pocket' : 'Tambah Pocket Baru'}</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-slate-500">✕</button>
          </div>

          <form onsubmit="submitPocketModal(event, '${acc.id}', '${pkt ? pkt.id : ''}')" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pocket</label>
              <input type="text" id="pkt-name" value="${pkt ? pkt.name : ''}" placeholder="Contoh: Dana Darurat / Belanja Bulanan" required
                class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-sm font-bold text-ink" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Saldo Pocket (${acc.currency})</label>
              <input type="number" id="pkt-balance" value="${pkt ? pkt.balance : 0}" step="any" required
                class="w-full px-3.5 py-3 rounded-2xl bg-creamCard border border-stone-200 text-base font-extrabold text-ink" />
              <p class="text-[11px] text-slate-500 mt-1.5">
                Jumlah total saldo di akun <strong>${acc.name}</strong> akan otomatis menyesuaikan sesuai perubahan saldo pocket ini.
              </p>
            </div>

            <div class="flex gap-2 pt-2">
              ${pkt && acc.pockets.length > 1 ? `
                <button type="button" onclick="deletePocket('${acc.id}', '${pkt.id}')" class="px-3.5 py-3 rounded-2xl bg-coralLight text-coral text-xs font-bold">Hapus</button>
              ` : ''}
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-3 rounded-2xl bg-ink text-white text-xs font-bold">Simpan Pocket</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitPocketModal(e, accountId, pocketId) {
      e.preventDefault();
      const acc = db.accounts.find(a => a.id === accountId);
      if (!acc) return;

      const name = document.getElementById('pkt-name').value.trim();
      const balance = Number(document.getElementById('pkt-balance').value) || 0;

      if (pocketId) {
        const pkt = acc.pockets.find(p => p.id === pocketId);
        if (pkt) {
          pkt.name = name;
          pkt.balance = balance;
        }
        showToast('Saldo pocket & total akun diperbarui');
      } else {
        acc.pockets.push({
          id: 'pkt_' + Date.now(),
          name,
          balance
        });
        showToast('Pocket baru ditambahkan ke ' + acc.name);
      }

      saveData();
      closeModal();
      render();
    }

    function deletePocket(accountId, pocketId) {
      const acc = db.accounts.find(a => a.id === accountId);
      if (!acc || acc.pockets.length <= 1) {
        showToast('Akun minimal memiliki 1 pocket', 'error');
        return;
      }
      acc.pockets = acc.pockets.filter(p => p.id !== pocketId);
      if (ui.selectedPocketDetail?.pocketId === pocketId) {
        ui.selectedPocketDetail = null;
      }
      saveData();
      closeModal();
      showToast('Pocket dihapus');
      render();
    }

    // -------------------------------------------------------------------------
    // 10D. MODAL TAMBAH TRANSAKSI (PENGELUARAN, PEMASUKAN, TRANSFER)
    // -------------------------------------------------------------------------
    function openTxModal(opts = {}) {
      const type = opts.defaultType || 'expense';
      const defaultAccId = opts.accountId || db.accounts[0]?.id || '';
      const defaultAcc = db.accounts.find(a => a.id === defaultAccId) || db.accounts[0];
      const defaultPktId = opts.pocketId || defaultAcc?.pockets?.[0]?.id || '';

      const todayStr = '2026-11-20';

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-extrabold text-ink">Catat Transaksi</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-slate-500">✕</button>
          </div>

          <!-- Selector Tipe Transaksi -->
          <div class="grid grid-cols-3 gap-1.5 bg-stone-100 p-1 rounded-2xl text-xs font-bold">
            <button type="button" onclick="switchTxModalType('expense')" id="tx-tab-expense"
              class="py-2 rounded-xl transition-all ${type === 'expense' ? 'bg-coral text-white shadow-xs' : 'text-slate-600'}">Pengeluaran</button>
            <button type="button" onclick="switchTxModalType('income')" id="tx-tab-income"
              class="py-2 rounded-xl transition-all ${type === 'income' ? 'bg-sage text-white shadow-xs' : 'text-slate-600'}">Pemasukan</button>
            <button type="button" onclick="switchTxModalType('transfer')" id="tx-tab-transfer"
              class="py-2 rounded-xl transition-all ${type === 'transfer' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600'}">Transfer</button>
          </div>

          <form onsubmit="submitTxModal(event)" class="space-y-3.5">
            <input type="hidden" id="tx-type" value="${type}" />

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Nominal</label>
                <input type="number" id="tx-amount" placeholder="0" step="any" min="0.01" required
                  class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-base font-extrabold text-ink" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Tanggal</label>
                <input type="date" id="tx-date" value="${todayStr}" required
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink" />
              </div>
            </div>

            <!-- Kategori & Subkategori (Disembunyikan jika Transfer) -->
            <div id="tx-category-section" class="${type === 'transfer' ? 'hidden' : 'space-y-3'}">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Kategori</label>
                <select id="tx-category" onchange="onTxCategoryChange()"
                  class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink">
                </select>
              </div>
              <div id="tx-subcategory-wrap">
                <label class="block text-xs font-bold text-slate-600 mb-1">Subkategori</label>
                <select id="tx-subcategory"
                  class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink">
                </select>
              </div>
            </div>

            <!-- Akun & Pocket Asal -->
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1" id="tx-acc-label">
                  ${type === 'transfer' ? 'Dari Akun' : 'Akun'}
                </label>
                <select id="tx-account" onchange="onTxAccountChange()"
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink">
                  ${db.accounts.map(a => `<option value="${a.id}" ${a.id === defaultAccId ? 'selected' : ''}>${a.name} (${a.currency})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1" id="tx-pkt-label">
                  ${type === 'transfer' ? 'Dari Pocket' : 'Pocket'}
                </label>
                <select id="tx-pocket"
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink">
                </select>
              </div>
            </div>

            <!-- Akun & Pocket Tujuan (Khusus Transfer) -->
            <div id="tx-to-section" class="${type === 'transfer' ? 'grid grid-cols-2 gap-2.5 pt-1' : 'hidden'}">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Ke Akun Tujuan</label>
                <select id="tx-to-account" onchange="onTxToAccountChange()"
                  class="w-full px-3 py-2.5 rounded-2xl bg-blue-50/70 border border-blue-200 text-xs font-bold text-ink">
                  ${db.accounts.map(a => `<option value="${a.id}">${a.name} (${a.currency})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Ke Pocket Tujuan</label>
                <select id="tx-to-pocket"
                  class="w-full px-3 py-2.5 rounded-2xl bg-blue-50/70 border border-blue-200 text-xs font-bold text-ink">
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Judul / Catatan</label>
              <input type="text" id="tx-title" placeholder="Contoh: Kopi, Makan Siang, Top Up..."
                class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink" />
            </div>

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-3 rounded-2xl bg-ink text-white text-xs font-bold shadow-md">Simpan Transaksi</button>
            </div>
          </form>
        </div>
      `);

      populateTxCategories(type);
      populateTxPockets('tx-account', 'tx-pocket', defaultPktId);
      populateTxPockets('tx-to-account', 'tx-to-pocket');
    }

    function switchTxModalType(type) {
      document.getElementById('tx-type').value = type;
      ['expense', 'income', 'transfer'].forEach(t => {
        const btn = document.getElementById(`tx-tab-${t}`);
        if (t === type) {
          const activeBg = t === 'expense' ? 'bg-coral text-white shadow-xs' : t === 'income' ? 'bg-sage text-white shadow-xs' : 'bg-blue-600 text-white shadow-xs';
          btn.className = `py-2 rounded-xl transition-all ${activeBg}`;
        } else {
          btn.className = 'py-2 rounded-xl transition-all text-slate-600';
        }
      });

      const catSec = document.getElementById('tx-category-section');
      const toSec = document.getElementById('tx-to-section');
      const accLbl = document.getElementById('tx-acc-label');
      const pktLbl = document.getElementById('tx-pkt-label');

      if (type === 'transfer') {
        catSec.classList.add('hidden');
        toSec.className = 'grid grid-cols-2 gap-2.5 pt-1';
        accLbl.textContent = 'Dari Akun';
        pktLbl.textContent = 'Dari Pocket';
      } else {
        catSec.className = 'space-y-3';
        toSec.classList.add('hidden');
        accLbl.textContent = 'Akun';
        pktLbl.textContent = 'Pocket';
        populateTxCategories(type);
      }
    }

    function populateTxCategories(type) {
      const sel = document.getElementById('tx-category');
      if (!sel) return;
      const cats = db.categories.filter(c => c.type === type);
      sel.innerHTML = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      onTxCategoryChange();
    }

    function onTxCategoryChange() {
      const catId = document.getElementById('tx-category')?.value;
      const cat = db.categories.find(c => c.id === catId);
      const wrap = document.getElementById('tx-subcategory-wrap');
      const subSel = document.getElementById('tx-subcategory');
      if (!wrap || !subSel) return;

      if (cat && cat.subcategories && cat.subcategories.length > 0) {
        wrap.classList.remove('hidden');
        subSel.innerHTML = `<option value="">-- Umum / Tanpa Subkategori --</option>` +
          cat.subcategories.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      } else {
        wrap.classList.add('hidden');
        subSel.innerHTML = `<option value=""></option>`;
      }
    }

    function onTxAccountChange() {
      populateTxPockets('tx-account', 'tx-pocket');
    }

    function onTxToAccountChange() {
      populateTxPockets('tx-to-account', 'tx-to-pocket');
    }

    function populateTxPockets(accSelectId, pktSelectId, preferredPktId = null) {
      const accId = document.getElementById(accSelectId)?.value;
      const pktSel = document.getElementById(pktSelectId);
      const acc = db.accounts.find(a => a.id === accId);
      if (!acc || !pktSel) return;

      pktSel.innerHTML = (acc.pockets || []).map(p =>
        `<option value="${p.id}" ${preferredPktId === p.id ? 'selected' : ''}>${p.name} (${formatCurrency(p.balance, acc.currency)})</option>`
      ).join('');
    }

    function submitTxModal(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const amount = Number(document.getElementById('tx-amount').value) || 0;
      const date = document.getElementById('tx-date').value;
      const accountId = document.getElementById('tx-account').value;
      const pocketId = document.getElementById('tx-pocket').value;
      const title = document.getElementById('tx-title').value.trim();

      if (amount <= 0) {
        showToast('Nominal harus lebih dari 0', 'error');
        return;
      }

      const srcAcc = db.accounts.find(a => a.id === accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === pocketId);
      if (!srcAcc || !srcPkt) return;

      if (type === 'transfer') {
        const toAccountId = document.getElementById('tx-to-account').value;
        const toPocketId = document.getElementById('tx-to-pocket').value;
        if (accountId === toAccountId && pocketId === toPocketId) {
          showToast('Pocket tujuan tidak boleh sama dengan asal', 'error');
          return;
        }
        const dstAcc = db.accounts.find(a => a.id === toAccountId);
        const dstPkt = dstAcc?.pockets?.find(p => p.id === toPocketId);
        if (!dstAcc || !dstPkt) return;

        // Kurangi dari pocket asal
        srcPkt.balance = Number(srcPkt.balance) - amount;
        // Konversi jika mata uang akun asal & tujuan berbeda
        const amountInIDR = toIDR(amount, srcAcc.currency);
        const dstRate = db.exchangeRates[dstAcc.currency] || 1;
        const convertedToDst = dstAcc.currency === srcAcc.currency ? amount : Number((amountInIDR / dstRate).toFixed(2));
        dstPkt.balance = Number(dstPkt.balance) + convertedToDst;

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'transfer',
          date,
          amount,
          categoryId: '',
          subcategoryId: '',
          title: title || `Transfer ke ${dstPkt.name}`,
          accountId,
          pocketId,
          toAccountId,
          toPocketId
        });
      } else {
        const categoryId = document.getElementById('tx-category').value;
        const subcategoryId = document.getElementById('tx-subcategory')?.value || '';

        if (type === 'expense') {
          srcPkt.balance = Number(srcPkt.balance) - amount;
        } else {
          srcPkt.balance = Number(srcPkt.balance) + amount;
        }

        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type,
          date,
          amount,
          categoryId,
          subcategoryId,
          title,
          accountId,
          pocketId
        });
      }

      saveData();
      closeModal();
      showToast('Transaksi tersimpan & saldo diperbarui');
      render();
    }

    function deleteTransaction(txId) {
      const idx = db.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = db.transactions[idx];

      // Kembalikan saldo pocket saat transaksi dihapus
      const srcAcc = db.accounts.find(a => a.id === tx.accountId);
      const srcPkt = srcAcc?.pockets?.find(p => p.id === tx.pocketId);

      if (srcPkt) {
        if (tx.type === 'expense') {
          srcPkt.balance += Number(tx.amount) || 0;
        } else if (tx.type === 'income') {
          srcPkt.balance -= Number(tx.amount) || 0;
        } else if (tx.type === 'transfer') {
          srcPkt.balance += Number(tx.amount) || 0;
          const dstAcc = db.accounts.find(a => a.id === tx.toAccountId);
          const dstPkt = dstAcc?.pockets?.find(p => p.id === tx.toPocketId);
          if (dstPkt) {
            const amountInIDR = toIDR(tx.amount, srcAcc.currency);
            const dstRate = db.exchangeRates[dstAcc.currency] || 1;
            const convertedToDst = dstAcc.currency === srcAcc.currency ? tx.amount : Number((amountInIDR / dstRate).toFixed(2));
            dstPkt.balance -= convertedToDst;
          }
        }
      }

      db.transactions.splice(idx, 1);
      saveData();
      showToast('Transaksi dihapus & saldo dikembalikan');
      render();
    }

    function submitDebtModal(e) {
      e.preventDefault();
      const type = document.getElementById('debt-type').value;
      const person = document.getElementById('debt-person').value.trim();
      const amount = Number(document.getElementById('debt-amount').value) || 0;
      const dueDate = document.getElementById('debt-due').value;
      const accountId = document.getElementById('debt-account').value;
      const pocketId = document.getElementById('debt-pocket').value;
      const note = document.getElementById('debt-note').value.trim();

      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || amount <= 0) return;

      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? amount : Number((amount / rate).toFixed(2));

      // Langsung update saldo akun/pocket & catat ke riwayat transaksi
      if (type === 'payable') {
        // Kita berhutang -> uang masuk ke akun kita
        pkt.balance += amountInAccCur;
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'income',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: 'cat_lainnya_in',
          subcategoryId: '',
          title: `Terima Hutang dari ${person}`,
          accountId,
          pocketId
        });
      } else {
        // Piutang -> kita meminjamkan uang -> saldo akun berkurang
        pkt.balance -= amountInAccCur;
        const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: fallbackExpCat,
          subcategoryId: '',
          title: `Pinjaman (Piutang) ke ${person}`,
          accountId,
          pocketId
        });
      }

      db.debts.unshift({
        id: 'debt_' + Date.now(),
        type,
        person,
        totalAmount: amount,
        paidAmount: 0,
        dueDate,
        note,
        accountId,
        pocketId,
        createdAt: '2026-11-20'
      });

      saveData();
      closeModal();
      showToast(type === 'payable' ? 'Hutang dicatat & saldo akun bertambah' : 'Piutang dicatat & saldo akun berkurang');
      render();
    }

    function submitSettleDebt(e, debtId) {
      e.preventDefault();
      const d = db.debts.find(item => item.id === debtId);
      if (!d) return;

      const payVal = Number(document.getElementById('settle-amount').value) || 0;
      const accountId = document.getElementById('settle-account').value;
      const pocketId = document.getElementById('settle-pocket').value;
      const acc = db.accounts.find(a => a.id === accountId);
      const pkt = acc?.pockets?.find(p => p.id === pocketId);
      if (!acc || !pkt || payVal <= 0) return;

      const rate = db.exchangeRates[acc.currency] || 1;
      const amountInAccCur = acc.currency === 'IDR' ? payVal : Number((payVal / rate).toFixed(2));

      d.paidAmount += payVal;

      if (d.type === 'payable') {
        // Bayar hutang -> saldo akun berkurang
        pkt.balance -= amountInAccCur;
        const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: fallbackExpCat,
          subcategoryId: '',
          title: `Bayar Hutang ke ${d.person}`,
          accountId,
          pocketId
        });
      } else {
        // Terima pelunasan piutang -> saldo akun bertambah
        pkt.balance += amountInAccCur;
        db.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'income',
          date: '2026-11-20',
          amount: amountInAccCur,
          categoryId: 'cat_lainnya_in',
          subcategoryId: '',
          title: `Pelunasan Piutang dari ${d.person}`,
          accountId,
          pocketId
        });
      }

      saveData();
      closeModal();
      showToast('Pembayaran tercatat & saldo akun diperbarui');
      render();
    }

          <h3 class="text-lg font-extrabold text-ink">Reset ke Data Awal?</h3>
          <p class="text-xs text-slate-500">Semua catatan saat ini akan dikembalikan ke data contoh bawaan aplikasi.</p>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
            <button onclick="executeResetData()" class="flex-1 py-3 rounded-2xl bg-coral text-white text-xs font-bold">Ya, Reset</button>
          </div>
        </div>
      `);
    }

    function executeResetData() {
      db = getDefaultData();
      saveData();
      closeModal();
      showToast('Data berhasil direset');
      fetchLiveExchangeRates(true);
      render();
    }

    function selectSavColor(colorId) {
      document.getElementById('sav-color').value = colorId;
      document.querySelectorAll('[data-sav-color]').forEach(btn => {
        btn.classList.toggle('border-ink', btn.dataset.savColor === colorId);
        btn.classList.toggle('border-transparent', btn.dataset.savColor !== colorId);
      });

    function selectSavIcon(iconKey) {
      document.getElementById('sav-icon').value = iconKey;
      document.querySelectorAll('[data-sav-icon]').forEach(btn => {
        if (btn.dataset.savIcon === iconKey) {
          btn.className = 'p-2 rounded-xl border flex flex-col items-center justify-center gap-1 bg-ink text-white border-ink';

    function submitSavingGoalModal(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('sav-name').value.trim();
      const targetAmount = Math.max(1000, Number(document.getElementById('sav-target').value) || 0);
      const deadline = document.getElementById('sav-deadline').value;
      const note = document.getElementById('sav-note').value.trim();
      const colorId = document.getElementById('sav-color').value;
      const icon = document.getElementById('sav-icon').value;
      const storageAccEl = document.getElementById('sav-storage-acc');
      const storagePktEl = document.getElementById('sav-storage-pkt');
      const storageAccId = storageAccEl ? storageAccEl.value : (db.accounts[0]?.id || '');
      let storagePktId = storagePktEl ? storagePktEl.value : '__NEW_POCKET__';

      const storageAcc = db.accounts.find(a => a.id === storageAccId);
      if (!storageAcc) return;

      if (!db.savingsGoals) db.savingsGoals = [];

      // Jika user memilih buat pocket baru otomatis di dalam akun tujuan
      if (storagePktId === '__NEW_POCKET__') {
        const newPktId = 'pkt_sav_' + Date.now();
        storageAcc.pockets.push({
          id: newPktId,
          name: `Tabungan: ${name}`,
          balance: 0
        });
        storagePktId = newPktId;
      }

      const targetPkt = storageAcc.pockets.find(p => p.id === storagePktId);
      const rate = db.exchangeRates[storageAcc.currency] || 1;

      if (existingId) {
        const g = db.savingsGoals.find(item => item.id === existingId);
        if (g) {
          g.name = name;
          g.targetAmount = targetAmount;
          g.deadline = deadline;
          g.note = note;
          g.colorId = colorId;
          g.icon = icon;
          g.accountId = storageAccId;
          g.pocketId = storagePktId;
          g.currentAmount = getSavingGoalBalanceIDR(g);
        }
        showToast('Target tabungan & akun penyimpanan diperbarui');
      } else {
        const initAmountIDR = Math.max(0, Number(document.getElementById('sav-init')?.value) || 0);
        if (initAmountIDR > 0 && targetPkt) {
          const addInAccCur = storageAcc.currency === 'IDR' ? initAmountIDR : Number((initAmountIDR / rate).toFixed(2));
          targetPkt.balance = Number(targetPkt.balance) + addInAccCur;
        }
        const totalInGoalIDR = targetPkt ? toIDR(targetPkt.balance, storageAcc.currency) : initAmountIDR;

        db.savingsGoals.push({
          id: 'sav_' + Date.now(),
          name,
          targetAmount,
          currentAmount: totalInGoalIDR,
          accountId: storageAccId,
          pocketId: storagePktId,
          deadline,
          colorId,
          icon,
          note,
          history: initAmountIDR > 0 ? [{
            id: 'sh_' + Date.now(),
            type: 'deposit',
            amount: initAmountIDR,
            date: '2026-11-20',
            accountId: storageAccId,
            pocketId: storagePktId,
            note: 'Saldo awal tabungan'
          }] : []
        });
        showToast(`Target dibuat & ditaruh di ${storageAcc.name}`);
      }

      saveData();
      closeModal();
      render();
    }

    function deleteSavingGoal(goalId) {
      db.savingsGoals = (db.savingsGoals || []).filter(g => g.id !== goalId);
      if (ui.selectedSavingGoalId === goalId) ui.selectedSavingGoalId = null;
      saveData();
      closeModal();
      showToast('Target tabungan dihapus (saldo di akun tetap aman)');
      render();
    }

    function openSavingTransferModal(goalId, actionType = 'deposit') {
      const g = (db.savingsGoals || []).find(item => item.id === goalId);
      if (!g) return;
      const isDeposit = actionType === 'deposit';
      const defaultAcc = db.accounts[0];
      const currentSavedIDR = getSavingGoalBalanceIDR(g);
      const storageAcc = db.accounts.find(a => a.id === g.accountId);
      const storagePkt = storageAcc?.pockets?.find(p => p.id === g.pocketId);

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] font-bold uppercase ${isDeposit ? 'text-sage' : 'text-amber-700'}">${g.name}</span>
              <h3 class="text-lg font-extrabold text-ink">${isDeposit ? 'Setor ke Tabungan' : 'Tarik dari Tabungan'}</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-slate-500">✕</button>
          </div>

          <form onsubmit="submitSavingTransfer(event, '${g.id}', '${actionType}')" class="space-y-3.5">
            <div class="bg-creamCard p-3 rounded-2xl border border-stone-200/70 text-xs space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-slate-500">Saldo Tabungan Saat Ini:</span>
                <span class="font-extrabold text-ink">${formatCurrency(currentSavedIDR)}</span>
              </div>
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-slate-400">Lokasi Penyimpanan:</span>
                <span class="font-bold text-sage">${storageAcc?.name || '-'} (${storagePkt?.name || '-'})</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Nominal (Rp)</label>
                <input type="number" id="sav-tx-amount" min="1000" step="1000" ${!isDeposit ? `max="${currentSavedIDR}"` : ''} required
                  class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-base font-extrabold text-ink" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Tanggal</label>
                <input type="date" id="sav-tx-date" value="2026-11-20" required
                  class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">${isDeposit ? 'Sumber Dana (Akun)' : 'Pindahkan ke Akun'}</label>
                <select id="sav-tx-acc" onchange="populateTxPockets('sav-tx-acc', 'sav-tx-pkt')"
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink">
                  ${db.accounts.map(a => `<option value="${a.id}">${a.name} (${a.currency})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Pocket</label>
                <select id="sav-tx-pkt"
                  class="w-full px-3 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink">
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Catatan</label>
              <input type="text" id="sav-tx-note" placeholder="${isDeposit ? 'Contoh: Sisihan gaji mingguan' : 'Contoh: Pencairan dana target'}"
                class="w-full px-3.5 py-2.5 rounded-2xl bg-creamCard border border-stone-200 text-xs font-bold text-ink" />
            </div>

            <p class="text-[11px] ${isDeposit ? 'text-sage' : 'text-amber-700'} font-medium">
              * ${isDeposit ? 'Dana dipindahkan ke pocket tabungan Anda sehingga tetap tercatat dalam Total Aset.' : 'Dana dipindahkan dari pocket tabungan ke pocket tujuan pilihan Anda.'}
            </p>

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
              <button type="submit" class="flex-1 py-3 rounded-2xl ${isDeposit ? 'bg-sage' : 'bg-ink'} text-white text-xs font-bold shadow-md">
                ${isDeposit ? 'Setor Sekarang' : 'Tarik Sekarang'}
              </button>
            </div>
          </form>
        </div>
      `);

      if (defaultAcc) populateTxPockets('sav-tx-acc', 'sav-tx-pkt');
    }

    function submitSavingTransfer(e, goalId, actionType) {
      e.preventDefault();
      const g = (db.savingsGoals || []).find(item => item.id === goalId);
      if (!g) return;

      const amountIDR = Number(document.getElementById('sav-tx-amount').value) || 0;
      const date = document.getElementById('sav-tx-date').value;
      const otherAccId = document.getElementById('sav-tx-acc').value;
      const otherPktId = document.getElementById('sav-tx-pkt').value;
      const note = document.getElementById('sav-tx-note').value.trim();

      const otherAcc = db.accounts.find(a => a.id === otherAccId);
      const otherPkt = otherAcc?.pockets?.find(p => p.id === otherPktId);
      const savAcc = db.accounts.find(a => a.id === g.accountId);
      const savPkt = savAcc?.pockets?.find(p => p.id === g.pocketId);

      if (!otherAcc || !otherPkt || amountIDR <= 0) return;

      const currentSavedIDR = getSavingGoalBalanceIDR(g);
      if (actionType === 'withdraw' && amountIDR > currentSavedIDR) {
        showToast('Nominal tarik melebihi saldo tabungan', 'error');
        return;
      }

      const otherRate = db.exchangeRates[otherAcc.currency] || 1;
      const amountInOtherCur = otherAcc.currency === 'IDR' ? amountIDR : Number((amountIDR / otherRate).toFixed(2));
      const savRate = savAcc ? (db.exchangeRates[savAcc.currency] || 1) : 1;
      const amountInSavCur = (!savAcc || savAcc.currency === 'IDR') ? amountIDR : Number((amountIDR / savRate).toFixed(2));

      if (actionType === 'deposit') {
        if (savAcc && savPkt && savAcc.id === otherAcc.id && savPkt.id === otherPkt.id) {
          savPkt.balance = Number(savPkt.balance) + amountInSavCur;
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'income',
            date,
            amount: amountInSavCur,
            categoryId: 'cat_lainnya_in',
            subcategoryId: '',
            title: `Setor Tabungan: ${g.name}`,
            accountId: savAcc.id,
            pocketId: savPkt.id
          });
        } else {
          otherPkt.balance = Number(otherPkt.balance) - amountInOtherCur;
          if (savPkt) {
            savPkt.balance = Number(savPkt.balance) + amountInSavCur;
          }
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'transfer',
            date,
            amount: amountInOtherCur,
            categoryId: '',
            subcategoryId: '',
            title: `Setor Tabungan: ${g.name}`,
            accountId: otherAcc.id,
            pocketId: otherPkt.id,
            toAccountId: savAcc ? savAcc.id : otherAcc.id,
            toPocketId: savPkt ? savPkt.id : otherPkt.id
          });
        }
      } else {
        if (savAcc && savPkt && savAcc.id === otherAcc.id && savPkt.id === otherPkt.id) {
          savPkt.balance = Math.max(0, Number(savPkt.balance) - amountInSavCur);
          const fallbackExpCat = db.categories.find(c => c.type === 'expense')?.id || '';
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'expense',
            date,
            amount: amountInSavCur,
            categoryId: fallbackExpCat,
            subcategoryId: '',
            title: `Tarik Tabungan: ${g.name}`,
            accountId: savAcc.id,
            pocketId: savPkt.id
          });
        } else {
          if (savPkt) {
            savPkt.balance = Math.max(0, Number(savPkt.balance) - amountInSavCur);
          }
          otherPkt.balance = Number(otherPkt.balance) + amountInOtherCur;
          db.transactions.unshift({
            id: 'tx_' + Date.now(),
            type: 'transfer',
            date,
            amount: amountInSavCur,
            categoryId: '',
            subcategoryId: '',
            title: `Tarik Tabungan: ${g.name}`,
            accountId: savAcc ? savAcc.id : otherAcc.id,
            pocketId: savPkt ? savPkt.id : otherPkt.id,
            toAccountId: otherAcc.id,
            toPocketId: otherPkt.id
          });
        }
      }

      g.currentAmount = getSavingGoalBalanceIDR(g);

      if (!g.history) g.history = [];
      g.history.unshift({
        id: 'sh_' + Date.now(),
        type: actionType,
        amount: amountIDR,
        date,
        accountId: otherAccId,
        pocketId: otherPktId,
        note: note || (actionType === 'deposit' ? 'Setor tabungan' : 'Tarik tabungan')
      });

      saveData();
      closeModal();
      showToast(actionType === 'deposit' ? 'Setoran tercatat & tersimpan di akun' : 'Dana tabungan dipindahkan ke akun tujuan');
      render();
    }

    // -------------------------------------------------------------------------
    // 10H. FITUR BACKUP & RESTORE DATA (EXPORT JSON, CLIPBOARD, IMPORT JSON)
    // -------------------------------------------------------------------------
    function buildBackupPayload() {
      return {
        app: 'CatatanKeuanganPersonal',
        version: '2.1',
        exportedAt: new Date().toISOString(),
        data: db
      };
    }

    function exportBackupJSON() {
      try {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const dateTag = new Date().toISOString().slice(0, 10);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-keuangan-${dateTag}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File backup JSON berhasil diunduh');
      } catch (err) {
        showToast('Gagal membuat file backup', 'error');
      }
    }

    function copyBackupToClipboard() {
      try {
        const jsonStr = JSON.stringify(buildBackupPayload());
        const ta = document.createElement('textarea');
        ta.value = jsonStr;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Data backup berhasil disalin ke clipboard');
      } catch (err) {
        showToast('Gagal menyalin backup', 'error');
      }
    }

    function openRestoreModal() {
      ui.pendingRestoreData = null;
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-extrabold text-ink">Restore / Pulihkan Data</h3>
              <p class="text-xs text-slate-500">Pilih file backup (.json) atau tempel teks JSON</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-full bg-stone-100 text-slate-500">✕</button>
          </div>

          <div class="space-y-3">
            <label class="block w-full p-4 rounded-2xl border-2 border-dashed border-stone-300 bg-creamCard hover:border-ink text-center cursor-pointer transition-colors">
              <span class="text-xs font-extrabold text-ink block">Pilih File Backup (.json)</span>
              <span class="text-[11px] text-slate-400 mt-0.5 block">Ketuk untuk mencari file dari penyimpanan perangkat</span>
              <input type="file" accept=".json,application/json" onchange="handleRestoreFileSelect(event)" class="hidden" />
            </label>

            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Atau Tempel Teks JSON Backup</label>
              <textarea id="restore-json-text" rows="3" oninput="previewRestoreFromText(this.value)"
                placeholder='{"app":"CatatanKeuanganPersonal", ...}'
                class="w-full p-3 rounded-2xl bg-creamCard border border-stone-200 text-[11px] font-mono focus:outline-none focus:border-ink"></textarea>
            </div>

            <!-- Area Pratinjau Isi Backup -->
            <div id="restore-preview-box" class="hidden bg-sageLight/70 border border-sage/30 rounded-2xl p-3 text-xs space-y-1">
              <div class="font-extrabold text-sage">✓ File Backup Valid & Siap Dipulihkan</div>
              <div id="restore-preview-stats" class="text-ink font-medium"></div>
            </div>

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-stone-100 text-slate-600 text-xs font-bold">Batal</button>
              <button type="button" id="btn-confirm-restore" onclick="executeRestoreData()" disabled
                class="flex-1 py-3 rounded-2xl bg-ink disabled:bg-stone-300 text-white text-xs font-bold shadow-md transition-colors">
                Pulihkan Sekarang
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function validateAndParseBackup(rawText) {
      const parsed = JSON.parse(rawText);
      const candidate = parsed.data ? parsed.data : parsed;
      if (!candidate || !Array.isArray(candidate.accounts) || !Array.isArray(candidate.categories)) {
        throw new Error('Struktur JSON tidak sesuai');
      }
      const def = getDefaultData();
      return {
        exchangeRates: { ...def.exchangeRates, ...(candidate.exchangeRates || {}) },
        exchangeRateMeta: candidate.exchangeRateMeta || def.exchangeRateMeta,
        categories: candidate.categories,
        accounts: candidate.accounts,
        transactions: Array.isArray(candidate.transactions) ? candidate.transactions : [],
        debts: Array.isArray(candidate.debts) ? candidate.debts : [],
        savingsGoals: Array.isArray(candidate.savingsGoals) ? candidate.savingsGoals : []
      };
    }

    function showRestorePreview(validDb) {
      ui.pendingRestoreData = validDb;
      const box = document.getElementById('restore-preview-box');
      const stats = document.getElementById('restore-preview-stats');
      const btn = document.getElementById('btn-confirm-restore');
      if (box && stats && btn) {
        box.classList.remove('hidden');
        stats.innerHTML = `
          • ${validDb.accounts.length} Akun & ${validDb.transactions.length} Transaksi<br/>
          • ${validDb.categories.length} Kategori, ${validDb.savingsGoals.length} Target Tabungan, ${validDb.debts.length} Catatan Hutang
        `;
        btn.disabled = false;
      }
    }

    function handleRestoreFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const text = ev.target.result;
          const ta = document.getElementById('restore-json-text');
          if (ta) ta.value = text;
          const validDb = validateAndParseBackup(text);
          showRestorePreview(validDb);
        } catch (err) {
          ui.pendingRestoreData = null;
          showToast('Format file JSON tidak valid', 'error');
        }
      };
      reader.readAsText(file);
    }

    function previewRestoreFromText(text) {
      if (!text.trim()) {
        ui.pendingRestoreData = null;
        document.getElementById('restore-preview-box')?.classList.add('hidden');
        const btn = document.getElementById('btn-confirm-restore');
        if (btn) btn.disabled = true;
        return;
      }
      try {
        const validDb = validateAndParseBackup(text);
        showRestorePreview(validDb);
      } catch (err) {
        ui.pendingRestoreData = null;
        document.getElementById('restore-preview-box')?.classList.add('hidden');
        const btn = document.getElementById('btn-confirm-restore');
        if (btn) btn.disabled = true;
      }
    }

    function executeRestoreData() {
      if (!ui.pendingRestoreData) return;
      db = ui.pendingRestoreData;
      ui.pendingRestoreData = null;
      saveData();
      closeModal();
      showToast('Data berhasil dipulihkan dari backup!');
      render();
    }

    // =========================================================================
    // 11. MAIN RENDER LOOP
    // =========================================================================
    function render() {
      renderBottomNav();
      const mainEl = document.getElementById('main-content');

      switch (ui.activeTab) {
        case 'transaksi':
          mainEl.innerHTML = renderTransaksiView();
          break;
        case 'statistik':
          mainEl.innerHTML = renderStatistikView();
          break;
        case 'akun':
          mainEl.innerHTML = renderAkunView();
          break;
        case 'tabungan':
          mainEl.innerHTML = renderTabunganView();
          break;
        case 'hutang':
          mainEl.innerHTML = renderHutangView();
          break;
        case 'pengaturan':
          mainEl.innerHTML = renderPengaturanView();
          break;
        default:
          mainEl.innerHTML = renderStatistikView();
      }
      updateLockScreenVisibility();
    }

    // Inisialisasi aplikasi & sinkronisasi kurs mata uang asing dari internet saat halaman dimuat
    window.addEventListener('DOMContentLoaded', () => {
      initPwaSupport();
      if (db.security?.enabled && db.security?.pinHash && !checkSessionExpiration()) {
        db.security.lastActiveAt = Date.now();
        saveData();
      }
      render();
      updateLockScreenVisibility();
      fetchLiveExchangeRates(true);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (!checkSessionExpiration()) {
          touchLastActive();
        }
        updateLockScreenVisibility();
      }
    });
  </script>
