          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>`
        }
      ];

      const navEl = document.getElementById('bottom-nav');
      navEl.innerHTML = items.map(item => {
        const active = ui.activeTab === item.id;
        return `
          <button onclick="switchTab('${item.id}')" class="flex flex-col items-center justify-center py-1 px-0.5 rounded-2xl transition-all ${active ? 'text-coral font-bold' : 'text-slate-400 hover:text-slate-600 font-medium'}">
            <div class="p-1 rounded-xl ${active ? 'bg-coralLight text-coral' : ''}">
              ${item.icon}
            </div>
            <span class="text-[10px] mt-0.5 tracking-tight truncate max-w-full">${item.label}</span>
          </button>
        `;
      }).join('');
    }

    function switchTab(tabId) {
      ui.activeTab = tabId;
      ui.drilldownCategoryId = null;
      ui.selectedPocketDetail = null;
      ui.selectedSavingGoalId = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 5. VIEW 1: STATISTIK (EVALUASI ANGGARAN, KATEGORI, & DRILL-DOWN)
    // =========================================================================
    function renderStatistikView() {
      // Jika sedang membuka Drill-down Detail Kategori (Gambar 2)
      if (ui.drilldownCategoryId) {
        return renderCategoryDrilldown();
      }

      const periodLabel = ui.statPeriodMode === 'yearly'
        ? `${ui.statYear}`
        : `${MONTH_NAMES_ID[ui.statMonth]} ${ui.statYear}`;

      return `
        <div class="p-4 space-y-4">
          <!-- Top Header & Period Switcher (Medium-Soft Lavender Pastel) -->
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #E7E0FC; border-color: #C9B9F8;">
            <div class="flex items-center justify-between gap-2 mb-3">
              <div>
                <h1 class="text-lg font-extrabold text-ink tracking-tight">Statistik & Anggaran</h1>
                <p class="text-xs text-slate-700">Pantau evaluasi limit dan arus pengeluaran</p>
              </div>
              <!-- Toggle Bulanan / Tahunan -->
              <div class="bg-white/90 p-1 rounded-xl flex text-xs font-semibold border border-[#C9B9F8]">
                <button onclick="setStatPeriodMode('monthly')" class="px-2.5 py-1.5 rounded-lg transition-all ${ui.statPeriodMode === 'monthly' ? 'bg-ink text-white shadow-sm' : 'text-slate-600'}">Bulanan</button>
                <button onclick="setStatPeriodMode('yearly')" class="px-2.5 py-1.5 rounded-lg transition-all ${ui.statPeriodMode === 'yearly' ? 'bg-ink text-white shadow-sm' : 'text-slate-600'}">Tahunan</button>
              </div>
            </div>

            <!-- Navigator Periode & Sub-tab Switcher -->
            <div class="flex items-center justify-between pt-2 border-t border-[#C9B9F8]">
              <div class="flex items-center gap-1 bg-white/90 px-2 py-1 rounded-xl border border-[#C9B9F8]">
                <button onclick="shiftPeriod('stat', -1)" class="p-1.5 hover:bg-[#E7E0FC] rounded-lg text-slate-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <span class="text-xs font-bold text-ink min-w-[76px] text-center">${periodLabel}</span>
                <button onclick="shiftPeriod('stat', 1)" class="p-1.5 hover:bg-[#E7E0FC] rounded-lg text-slate-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>
              </div>

              <div class="flex gap-1.5">
                <button onclick="setStatSubTab('anggaran')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${ui.statSubTab === 'anggaran' ? 'bg-ink text-white shadow-sm' : 'bg-white/85 text-slate-700 hover:bg-white'}">
                  Evaluasi Anggaran
                </button>
                <button onclick="setStatSubTab('kategori')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${ui.statSubTab === 'kategori' ? 'bg-ink text-white shadow-sm' : 'bg-white/85 text-slate-700 hover:bg-white'}">
                  Per Kategori
                </button>
              </div>
            </div>
          </div>

          ${ui.statSubTab === 'anggaran' ? renderBudgetEvaluationSection() : renderCategoryBreakdownSection()}
        </div>
      `;
    }

    function setStatPeriodMode(mode) {
      ui.statPeriodMode = mode;
      render();
    }

    function setStatSubTab(tab) {
      ui.statSubTab = tab;
      render();
    }

    function toggleBudgetCatExpand(catId) {
      ui.expandedBudgetCats[catId] = !ui.expandedBudgetCats[catId];
      render();
    }

    function openCategoryDrilldown(catId) {
      ui.drilldownCategoryId = catId;
      ui.drilldownSubcategoryId = 'ALL';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeCategoryDrilldown() {
      ui.drilldownCategoryId = null;
      ui.drilldownSubcategoryId = 'ALL';
      render();
    }

    function selectDrilldownSubcategory(subId) {
      ui.drilldownSubcategoryId = subId;
      render();
    }

    function renderBudgetEvaluationSection() {
      const expenseCats = db.categories.filter(c => c.type === 'expense');
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense');
      const multiplier = ui.statPeriodMode === 'yearly' ? 12 : 1;

      const totalBudget = expenseCats.reduce((s, c) => s + getCategoryLimit(c) * multiplier, 0);
      const totalSpent = periodTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
      const overallPct = totalBudget > 0 ? Math.round((totalSpent / totalBudget) * 100) : 0;

      return `
        <div class="space-y-3.5">
          <!-- Ringkasan Evaluasi Anggaran -->
          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-2.5">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold text-slate-400 uppercase">Total Anggaran ${ui.statPeriodMode === 'yearly' ? 'Tahunan' : 'Bulanan'}</span>
                <div class="text-xl font-extrabold text-ink mt-0.5">${formatCurrency(totalSpent)} <span class="text-xs font-semibold text-slate-400">/ ${formatCurrency(totalBudget)}</span></div>
              </div>
              <button onclick="openBulkBudgetModal()" class="px-3 py-1.5 rounded-xl bg-creamCard hover:bg-stone-200/70 border border-stone-200 text-xs font-bold text-ink">
                Atur Semua
              </button>
            </div>
            <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-300 ${overallPct > 100 ? 'bg-coral' : overallPct >= 80 ? 'bg-amber-500' : 'bg-sage'}"
                style="width: ${Math.min(100, overallPct)}%"></div>
            </div>
            <div class="flex justify-between text-[11px] font-semibold text-slate-500">
              <span>Terpakai ${overallPct}%</span>
              <span>${totalBudget - totalSpent >= 0 ? `Sisa ${formatCurrency(totalBudget - totalSpent)}` : `Melebihi ${formatCurrency(totalSpent - totalBudget)}`}</span>
            </div>
          </div>

          <!-- Kartu Evaluasi Per Kategori -->
          ${expenseCats.map(cat => {
            const limit = getCategoryLimit(cat) * multiplier;
            const catTxs = periodTxs.filter(t => t.categoryId === cat.id);
            const spent = catTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
            const pct = limit > 0 ? Math.round((spent / limit) * 100) : (spent > 0 ? 100 : 0);
            const hasSubs = cat.subcategories && cat.subcategories.length > 0;
            const isExpanded = Boolean(ui.expandedBudgetCats[cat.id]);

            let badgeClass = 'bg-sageLight text-sage';
            let badgeText = 'Aman';
            let barColor = 'bg-sage';
            if (limit > 0 && pct > 100) {
              badgeClass = 'bg-coralLight text-coral';
              badgeText = 'Melebihi';
              barColor = 'bg-coral';
            } else if (limit > 0 && pct >= 80) {
              badgeClass = 'bg-amber-50 text-amber-700';
              badgeText = 'Waspada';
              barColor = 'bg-amber-500';
            } else if (limit === 0) {
              badgeClass = 'bg-stone-100 text-slate-500';
              badgeText = 'Tanpa Limit';
            }

            return `
              <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${hasSubs ? `
                      <button onclick="toggleBudgetCatExpand('${cat.id}')" class="p-1 rounded-lg bg-creamCard text-slate-600 hover:bg-stone-200">
                        <svg class="w-4 h-4 transition-transform ${isExpanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                      </button>
                    ` : ''}
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <button onclick="openCategoryDrilldown('${cat.id}')" class="text-sm font-extrabold text-ink hover:underline truncate text-left">${cat.name}</button>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${badgeClass} shrink-0">${badgeText}</span>
                      </div>
                      <div class="text-xs text-slate-500 mt-0.5">
                        <strong class="text-ink">${formatCurrency(spent)}</strong> dari ${formatCurrency(limit)} (${pct}%)
                      </div>
                    </div>
                  </div>
                  <button onclick="openEditCategoryLimitModal('${cat.id}')" class="px-2.5 py-1 rounded-xl bg-creamCard hover:bg-stone-200 text-[11px] font-bold text-ink shrink-0">
                    Edit Limit
                  </button>
                </div>

                <div class="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
                  <div class="h-full ${barColor} rounded-full transition-all duration-300" style="width: ${Math.min(100, pct)}%"></div>
                </div>

                ${hasSubs && isExpanded ? `
                  <div class="pt-2 pl-3 border-l-2 border-stone-200 space-y-2">
                    ${cat.subcategories.map(sub => {
                      const subLimit = (Number(sub.limit) || 0) * multiplier;
                      const subSpent = catTxs.filter(t => t.subcategoryId === sub.id).reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
                      const subPct = subLimit > 0 ? Math.round((subSpent / subLimit) * 100) : 0;
                      return `
                        <div class="bg-creamCard rounded-2xl p-2.5 space-y-1.5">
                          <div class="flex items-center justify-between text-xs">
                            <span class="font-bold text-ink">${sub.name}</span>
                            <div class="flex items-center gap-2">
                              <span class="text-slate-600 font-semibold">${formatCurrency(subSpent)} / ${formatCurrency(subLimit)}</span>
                              <button onclick="openEditSubLimitModal('${cat.id}', '${sub.id}')" class="text-blue-600 font-bold hover:underline">Atur</button>
                            </div>
                          </div>
                          <div class="w-full h-1.5 bg-stone-200/80 rounded-full overflow-hidden">
                            <div class="h-full ${subPct > 100 ? 'bg-coral' : 'bg-sage'} rounded-full" style="width: ${Math.min(100, subPct)}%"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCategoryBreakdownSection() {
      const expenseCats = db.categories.filter(c => c.type === 'expense');
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense');
      const totalExpense = periodTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);

      const rows = expenseCats.map((cat, idx) => {
        const spent = periodTxs.filter(t => t.categoryId === cat.id).reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        const pct = totalExpense > 0 ? Math.round((spent / totalExpense) * 100) : 0;
        const color = ACCOUNT_COLORS[idx % ACCOUNT_COLORS.length];
        return { cat, spent, pct, color };
      }).sort((a, b) => b.spent - a.spent);

      return `
        <div class="space-y-3.5">
          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
            <span class="text-xs font-bold text-slate-400">Total Pengeluaran ${ui.statPeriodMode === 'yearly' ? `Tahun ${ui.statYear}` : `${MONTH_NAMES_ID[ui.statMonth]} ${ui.statYear}`}</span>
            <div class="text-2xl font-extrabold text-ink mt-1">${formatCurrency(totalExpense)}</div>
            <p class="text-[11px] text-slate-500 mt-1">Ketuk kategori di bawah untuk melihat rincian subkategori & grafik tren</p>
          </div>

          <div class="bg-white rounded-3xl divide-y divide-stone-100 shadow-sm border border-stone-200/70 overflow-hidden">
            ${rows.map(({ cat, spent, pct, color }) => `
              <button onclick="openCategoryDrilldown('${cat.id}')" class="w-full p-4 flex items-center justify-between gap-3 hover:bg-creamCard transition-colors text-left">
                <div class="flex items-center gap-3 min-w-0">
                  <span class="px-2.5 py-1 rounded-xl text-xs font-extrabold shrink-0" style="background-color: ${color.bg}; color: ${color.text};">
                    ${pct}%
                  </span>
                  <div class="min-w-0">
                    <div class="text-sm font-extrabold text-ink truncate">${cat.name}</div>
                    <div class="text-[11px] text-slate-400">${cat.subcategories?.length || 0} subkategori</div>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="text-sm font-extrabold text-ink">${formatCurrency(spent)}</span>
                  <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCategoryDrilldown() {
      const cat = db.categories.find(c => c.id === ui.drilldownCategoryId);
      if (!cat) {
        ui.drilldownCategoryId = null;
        return renderStatistikView();
      }

      const periodLabel = ui.statPeriodMode === 'yearly'
        ? `${ui.statYear}`
        : `${MONTH_NAMES_ID[ui.statMonth]} ${ui.statYear}`;

      const catPeriodTxs = filterTransactionsByPeriod(db.transactions, ui.statPeriodMode, ui.statYear, ui.statMonth)
        .filter(t => t.type === 'expense' && t.categoryId === cat.id);

      const totalCatSpent = catPeriodTxs.reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
      const selectedSubId = ui.drilldownSubcategoryId || 'ALL';

      const subRows = (cat.subcategories || []).map(sub => {
        const subSpent = catPeriodTxs.filter(t => t.subcategoryId === sub.id).reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
        const pct = totalCatSpent > 0 ? Math.round((subSpent / totalCatSpent) * 100) : 0;
        return { id: sub.id, name: sub.name, spent: subSpent, pct };
      });

      const visibleTxs = catPeriodTxs
        .filter(t => selectedSubId === 'ALL' || t.subcategoryId === selectedSubId)
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      // Data Grafik Tren (8 bulan terakhir hingga bulan aktif, atau 12 bulan jika mode tahunan)
      const chartPoints = [];
      if (ui.statPeriodMode === 'yearly') {
        for (let m = 0; m < 12; m++) {
          const mTotal = db.transactions
            .filter(t => {
              if (t.type !== 'expense' || t.categoryId !== cat.id || !t.date) return false;
              if (selectedSubId !== 'ALL' && t.subcategoryId !== selectedSubId) return false;
              const [y, mo] = t.date.split('-').map(Number);
              return y === ui.statYear && (mo - 1) === m;
            })
            .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
          chartPoints.push({ label: MONTH_NAMES_ID[m], val: mTotal });
        }
      } else {
        for (let i = 7; i >= 0; i--) {
          let m = ui.statMonth - i;
          let y = ui.statYear;
          while (m < 0) { m += 12; y--; }
          const mTotal = db.transactions
            .filter(t => {
              if (t.type !== 'expense' || t.categoryId !== cat.id || !t.date) return false;
              if (selectedSubId !== 'ALL' && t.subcategoryId !== selectedSubId) return false;
              const [ty, tm] = t.date.split('-').map(Number);
              return ty === y && (tm - 1) === m;
            })
            .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
          chartPoints.push({ label: MONTH_NAMES_ID[m], val: mTotal });
        }
      }

      const maxVal = Math.max(100000, ...chartPoints.map(p => p.val));
      const svgW = 320;
      const svgH = 120;
      const padX = 18;
      const padY = 16;
      const coords = chartPoints.map((pt, idx) => {
        const x = padX + (idx / Math.max(1, chartPoints.length - 1)) * (svgW - padX * 2);
        const y = svgH - padY - (pt.val / maxVal) * (svgH - padY * 2);
        return { ...pt, x, y };
      });
      const polyPoints = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">
          <!-- Header Navigasi Detail Kategori -->
          <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <button onclick="closeCategoryDrilldown()" class="p-1.5 -ml-1.5 rounded-xl hover:bg-stone-100 text-ink">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              </button>
              <h1 class="text-base font-extrabold text-ink truncate">${cat.name}</h1>
            </div>
            <div class="flex items-center gap-1 bg-creamCard px-2 py-1 rounded-xl border border-stone-200 shrink-0">
              <button onclick="shiftPeriod('stat', -1)" class="p-1 text-slate-600">‹</button>
              <span class="text-xs font-bold text-ink min-w-[68px] text-center">${periodLabel}</span>
              <button onclick="shiftPeriod('stat', 1)" class="p-1 text-slate-600">›</button>
            </div>
          </div>

          <div class="p-4 space-y-4">
            <!-- Ringkasan Total Periode -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <span class="text-xs font-semibold text-slate-400">Total ${ui.statPeriodMode === 'yearly' ? 'tahunan' : 'bulanan'}</span>
              <div class="text-2xl font-extrabold text-ink mt-0.5">${formatCurrency(totalCatSpent)}</div>
            </div>

            <!-- Tabel Subkategori ("Semua" + Daftar Subkategori) -->
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-stone-200/70 divide-y divide-stone-100">
              <button onclick="selectDrilldownSubcategory('ALL')"
                class="w-full px-4 py-3 flex items-center justify-between text-xs transition-colors ${selectedSubId === 'ALL' ? 'bg-coralLight/80 font-extrabold text-ink' : 'text-slate-600 hover:bg-creamCard'}">
                <span class="w-1/2 text-left">Semua</span>
                <span class="w-1/6 text-center text-slate-500">100%</span>
                <span class="w-1/3 text-right">${formatCurrency(totalCatSpent)}</span>
              </button>
              ${subRows.map(sr => `
                <button onclick="selectDrilldownSubcategory('${sr.id}')"
                  class="w-full px-4 py-3 flex items-center justify-between text-xs transition-colors ${selectedSubId === sr.id ? 'bg-coralLight/80 font-extrabold text-ink' : 'text-slate-700 hover:bg-creamCard'}">
                  <span class="w-1/2 text-left truncate">${sr.name}</span>
                  <span class="w-1/6 text-center text-slate-400">${sr.pct}%</span>
                  <span class="w-1/3 text-right font-bold">${formatCurrency(sr.spent)}</span>
                </button>
              `).join('')}
            </div>

            <!-- Grafik Tren Pengeluaran (Line Chart) -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-extrabold text-ink">Grafik Tren Pengeluaran</span>
                <span class="text-[10px] font-semibold text-slate-400">Maks: ${formatShortRupiah(maxVal)}</span>
              </div>
              <svg viewBox="0 0 ${svgW} ${svgH + 18}" class="w-full h-36 overflow-visible">
                <line x1="${padX}" y1="${padY}" x2="${svgW - padX}" y2="${padY}" stroke="#E5E7EB" stroke-dasharray="3 3" />
                <line x1="${padX}" y1="${svgH / 2}" x2="${svgW - padX}" y2="${svgH / 2}" stroke="#E5E7EB" stroke-dasharray="3 3" />
                <line x1="${padX}" y1="${svgH - padY}" x2="${svgW - padX}" y2="${svgH - padY}" stroke="#CBD5E1" />
                <polyline fill="none" stroke="#E05A47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polyPoints}" />
                ${coords.map(c => `
                  <circle cx="${c.x}" cy="${c.y}" r="3.5" fill="#E05A47" stroke="#FFFFFF" stroke-width="1.5" />
                  <text x="${c.x}" y="${svgH + 12}" text-anchor="middle" font-size="9" fill="#64748B" font-weight="600">${c.label}</text>
                `).join('')}
              </svg>
            </div>

            <!-- Daftar Transaksi Terkait -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <h3 class="text-xs font-extrabold text-ink mb-2">Transaksi Terkait (${visibleTxs.length})</h3>
              ${visibleTxs.length === 0 ? `
                <div class="py-6 text-center text-xs text-slate-400">Belum ada transaksi pada periode ini.</div>
              ` : `
                <div class="divide-y divide-stone-100">
                  ${visibleTxs.map(tx => renderTransactionRow(tx)).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 6. VIEW 2: AKUN (MULTI-POCKET, MATA UANG ASING, WARNA & IKON CELENGAN)
    // =========================================================================
    function renderAkunView() {
      if (ui.selectedPocketDetail) {
        return renderPocketDetailView();
      }

      const netWorthIDR = getTotalNetWorthIDR();
      const periodTxs = filterTransactionsByPeriod(db.transactions, ui.akunPeriodMode, ui.akunYear, ui.akunMonth);
      const periodIncomeIDR = periodTxs
        .filter(t => t.type === 'income')
        .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
      const periodExpenseIDR = periodTxs
        .filter(t => t.type === 'expense')
        .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
      const periodDiffIDR = periodIncomeIDR - periodExpenseIDR;

      const periodLabel = ui.akunPeriodMode === 'yearly'
        ? `${ui.akunYear}`
        : `${MONTH_NAMES_ID[ui.akunMonth]} ${ui.akunYear}`;

      return `
        <div class="p-4 space-y-4">
          <!-- Header Menu Akun (Medium-Soft Dusty Blue Pastel - Lebih Pekat & Kontras) -->
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #DCE7FE; border-color: #B4CAFA;">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h1 class="text-xl font-extrabold text-ink tracking-tight">Akun</h1>
                <p class="text-xs text-slate-700">Kelola saldo, pocket & mata uang asing</p>
              </div>
              <button onclick="openAccountModal()" class="px-3.5 py-2 rounded-2xl bg-ink text-white text-xs font-bold shadow-sm hover:bg-slate-800">
                + Akun
              </button>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-[#B4CAFA]">
              <div class="bg-white/90 p-1 rounded-xl flex text-xs font-semibold border border-[#B4CAFA]">
                <button onclick="setAkunPeriodMode('monthly')" class="px-2.5 py-1 rounded-lg ${ui.akunPeriodMode === 'monthly' ? 'bg-ink text-white' : 'text-slate-600'}">Bulanan</button>
                <button onclick="setAkunPeriodMode('yearly')" class="px-2.5 py-1 rounded-lg ${ui.akunPeriodMode === 'yearly' ? 'bg-ink text-white' : 'text-slate-600'}">Tahunan</button>
              </div>

              <div class="flex items-center gap-1 bg-white/90 px-2 py-1 rounded-xl border border-[#B4CAFA]">
                <button onclick="shiftPeriod('akun', -1)" class="p-1 text-slate-600">‹</button>
                <span class="text-xs font-bold text-ink min-w-[70px] text-center">${periodLabel}</span>
                <button onclick="shiftPeriod('akun', 1)" class="p-1 text-slate-600">›</button>
              </div>
            </div>
          </div>

          <!-- Kartu Total Kekayaan (Warm Champagne / Sand Pastel agar kontras dari header & kartu akun biru) -->
          <div class="rounded-3xl p-5 shadow-sm border relative overflow-hidden" style="background: linear-gradient(135deg, #FAF1DF 0%, #F3E5C8 100%); border-color: #E2CCA2; color: #1A2433;">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-bold text-slate-700">Total Kekayaan (Konversi IDR)</span>
              <div class="flex items-center gap-1.5">
                <button onclick="fetchLiveExchangeRates(false)" ${isFetchingRates ? 'disabled' : ''}
                  class="px-2.5 py-1 rounded-xl bg-white/90 text-sage border border-[#E2CCA2] text-[11px] font-extrabold hover:bg-white">
                  ${isFetchingRates ? 'Sync...' : '↻ Sync Kurs'}
                </button>
                <button onclick="openExchangeRateModal()"
                  class="px-2.5 py-1 rounded-xl bg-white/90 text-ink border border-[#E2CCA2] text-[11px] font-extrabold hover:bg-white">
                  Kurs ⇄
                </button>
              </div>
            </div>
            <div class="text-[11px] text-slate-600 mt-0.5 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${db.exchangeRateMeta?.source === 'live' ? 'bg-sage' : 'bg-amber-500'}"></span>
              <span>${db.exchangeRateMeta?.source === 'live' ? `Kurs Live Internet (${db.exchangeRateMeta.lastUpdated || 'Aktif'})` : 'Kurs Tersimpan Lokal'}</span>
            </div>

            <div class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-2 text-ink">
              ${formatCurrency(netWorthIDR, 'IDR')}
            </div>

            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-[#E2CCA2]/90 text-xs">
              <div>
                <span class="text-[11px] text-slate-600 block">Masuk (${periodLabel})</span>
                <span class="font-extrabold text-sage">+${formatShortRupiah(periodIncomeIDR)}</span>
              </div>
              <div>
                <span class="text-[11px] text-slate-600 block">Keluar (${periodLabel})</span>
                <span class="font-extrabold text-coral">-${formatShortRupiah(periodExpenseIDR)}</span>
              </div>
              <div>
                <span class="text-[11px] text-slate-600 block">Selisih</span>
                <span class="font-extrabold text-ink">${periodDiffIDR >= 0 ? '+' : ''}${formatShortRupiah(periodDiffIDR)}</span>
              </div>
            </div>
          </div>

          <!-- Daftar Akun & Pocket -->
          <div class="space-y-3.5">
            ${db.accounts.map(acc => {
              const color = getColorObj(acc.colorId);
              const iconSvg = ICONS[acc.icon] || ICONS.celengan;
              const accTotal = getAccountTotalBalance(acc);
              const isForeign = acc.currency !== 'IDR';
              const accTotalIDR = toIDR(accTotal, acc.currency);

              return `
                <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: ${color.bg}; border-color: ${color.border};">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shrink-0 shadow-xs" style="background-color: ${color.hex};">
                        ${iconSvg}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                          <h3 class="text-base font-extrabold text-ink truncate">${acc.name}</h3>
                          <span class="px-2 py-0.5 rounded-md bg-white/80 text-[10px] font-extrabold" style="color: ${color.text};">${acc.currency}</span>
                        </div>
                        <div class="text-lg font-extrabold mt-0.5" style="color: ${color.text};">
                          ${formatCurrency(accTotal, acc.currency)}
                          ${isForeign ? `<span class="text-xs font-bold text-slate-600 block sm:inline">(${formatCurrency(accTotalIDR, 'IDR')})</span>` : ''}
                        </div>
                        ${isForeign ? `<div class="text-[10px] text-slate-500">1 ${acc.currency} = ${formatCurrency(db.exchangeRates[acc.currency], 'IDR')}</div>` : ''}
                      </div>
                    </div>

                    <div class="flex items-center gap-1 shrink-0">
                      <button onclick="openPocketModal('${acc.id}')" class="px-2.5 py-1.5 rounded-xl bg-white/90 hover:bg-white text-[11px] font-extrabold text-ink shadow-2xs">
                        + Pocket
                      </button>
                      <button onclick="openAccountModal('${acc.id}')" title="Edit Akun" class="p-2 rounded-xl bg-white/90 hover:bg-white text-slate-600">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                      </button>
                    </div>
                  </div>

                  <!-- Daftar Pocket dalam Akun -->
                  <div class="space-y-2">
                    ${(acc.pockets || []).map(pkt => {
                      const pktIDR = toIDR(pkt.balance, acc.currency);
                      return `
                        <div class="bg-white/95 rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2 border border-white">
                          <button onclick="openPocketDetail('${acc.id}', '${pkt.id}')" class="flex-1 text-left min-w-0 group">
                            <div class="text-xs font-extrabold text-ink group-hover:underline truncate">${pkt.name}</div>
                            <div class="text-sm font-extrabold mt-0.5" style="color: ${color.text};">
                              ${formatCurrency(pkt.balance, acc.currency)}
                              ${isForeign ? `<span class="text-[11px] font-semibold text-slate-400">(${formatCurrency(pktIDR, 'IDR')})</span>` : ''}
                            </div>
                          </button>
                          <div class="flex items-center gap-1 shrink-0">
                            <button onclick="openPocketModal('${acc.id}', '${pkt.id}')" class="px-2.5 py-1 rounded-xl bg-creamCard hover:bg-stone-200 text-[11px] font-bold text-slate-600">
                              Edit
                            </button>
                            <button onclick="openPocketDetail('${acc.id}', '${pkt.id}')" class="p-1.5 rounded-xl text-slate-400 hover:text-ink">
                              ›
                            </button>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setAkunPeriodMode(mode) {
      ui.akunPeriodMode = mode;
      render();
    }

    function openPocketDetail(accountId, pocketId) {
      ui.selectedPocketDetail = { accountId, pocketId };
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePocketDetail() {
      ui.selectedPocketDetail = null;
      render();
    }

    function selectPocketDetailMonth(monthIdx) {
      ui.akunMonth = monthIdx;
      render();
    }

    function renderPocketDetailView() {
      const sel = ui.selectedPocketDetail;
      const acc = db.accounts.find(a => a.id === sel?.accountId);
      const pkt = acc?.pockets?.find(p => p.id === sel?.pocketId);
      if (!acc || !pkt) {
        ui.selectedPocketDetail = null;
        return renderAkunView();
      }

      const color = getColorObj(acc.colorId);
      const isForeign = acc.currency !== 'IDR';
      const activeYear = ui.akunYear;
      const activeMonth = ui.akunMonth;

      // Rincian 12 Bulan (Januari - Desember) pada tahun aktif
      const monthlyRows = MONTH_NAMES_ID.map((mName, mIdx) => {
        let income = 0;
        let expense = 0;
        db.transactions.forEach(tx => {
          if (!tx.date) return;
          const [y, m] = tx.date.split('-').map(Number);
          if (y !== activeYear || (m - 1) !== mIdx) return;

          if (tx.type === 'income' && tx.accountId === acc.id && tx.pocketId === pkt.id) {
            income += Number(tx.amount) || 0;
          } else if (tx.type === 'expense' && tx.accountId === acc.id && tx.pocketId === pkt.id) {
            expense += Number(tx.amount) || 0;
          } else if (tx.type === 'transfer') {
            if (tx.accountId === acc.id && tx.pocketId === pkt.id) {
              expense += Number(tx.amount) || 0;
            }
            if (tx.toAccountId === acc.id && tx.toPocketId === pkt.id) {
              const srcAcc = db.accounts.find(a => a.id === tx.accountId);
              const inIDR = toIDR(tx.amount, srcAcc ? srcAcc.currency : acc.currency);
              const rate = db.exchangeRates[acc.currency] || 1;
              const val = (srcAcc && srcAcc.currency === acc.currency) ? Number(tx.amount) : (inIDR / rate);
              income += Number(val) || 0;
            }
          }
        });
        return { mIdx, mName, income, expense, diff: income - expense };
      });

      // Riwayat transaksi & transfer pada bulan & tahun aktif
      const monthTxs = db.transactions
        .filter(tx => {
          if (!tx.date) return false;
          const [y, m] = tx.date.split('-').map(Number);
          if (y !== activeYear || (m - 1) !== activeMonth) return false;
          const isSrc = tx.accountId === acc.id && tx.pocketId === pkt.id;
          const isDst = tx.type === 'transfer' && tx.toAccountId === acc.id && tx.toPocketId === pkt.id;
          return isSrc || isDst;
        })
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">
          <!-- Header Pocket Detail -->
          <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <button onclick="closePocketDetail()" class="p-1.5 -ml-1.5 rounded-xl hover:bg-stone-100 text-ink">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              </button>
              <div class="truncate">
                <h1 class="text-base font-extrabold text-ink truncate">${pkt.name}</h1>
                <span class="text-[11px] text-slate-500 block truncate">${acc.name} (${acc.currency})</span>
              </div>
            </div>
            <button onclick="openPocketModal('${acc.id}', '${pkt.id}')" class="px-3 py-1.5 rounded-xl bg-stone-100 text-xs font-bold text-ink shrink-0">
              Edit Saldo
            </button>
          </div>

          <div class="p-4 space-y-4">
            <!-- Kartu Saldo Pocket -->
            <div class="rounded-3xl p-5 text-white shadow-md" style="background-color: ${color.hex};">
              <span class="text-xs text-white/80 font-semibold">Saldo Pocket Saat Ini</span>
              <div class="text-3xl font-extrabold mt-1">${formatCurrency(pkt.balance, acc.currency)}</div>
              ${isForeign ? `<div class="text-xs text-white/85 mt-0.5">(${formatCurrency(toIDR(pkt.balance, acc.currency), 'IDR')})</div>` : ''}

              <div class="grid grid-cols-2 gap-2.5 mt-4 pt-3 border-t border-white/20">
                <button onclick="openTxModal({ defaultType: 'expense', accountId: '${acc.id}', pocketId: '${pkt.id}' })"
                  class="py-2.5 rounded-2xl bg-white text-ink text-xs font-extrabold shadow-xs">+ Transaksi</button>
                <button onclick="openTxModal({ defaultType: 'transfer', accountId: '${acc.id}', pocketId: '${pkt.id}' })"
                  class="py-2.5 rounded-2xl bg-black/25 text-white text-xs font-extrabold">⇄ Transfer</button>
              </div>
            </div>

            <!-- Rincian Nominal Per Bulan (Jan - Des Sejajar) -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-2.5">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold text-ink">Rincian Nominal Per Bulan (${activeYear})</h2>
                <div class="flex items-center gap-1 bg-creamCard px-2 py-0.5 rounded-xl border border-stone-200 text-xs font-bold">
                  <button onclick="shiftPeriod('akun', -1)" class="px-1">‹</button>
                  <span>${activeYear}</span>
                  <button onclick="shiftPeriod('akun', 1)" class="px-1">›</button>
                </div>
              </div>

              <div class="grid grid-cols-4 text-[10px] font-extrabold text-slate-400 uppercase px-2 pt-1 border-b border-stone-100 pb-1.5">
                <span>Bulan</span>
                <span class="text-right">Masuk</span>
                <span class="text-right">Keluar</span>
                <span class="text-right">Selisih</span>
              </div>

              <div class="divide-y divide-stone-100">
                ${monthlyRows.map(r => {
                  const isSelected = r.mIdx === activeMonth;
                  return `
                    <button onclick="selectPocketDetailMonth(${r.mIdx})"
                      class="w-full grid grid-cols-4 items-center px-2 py-2.5 text-xs tabular-nums transition-colors rounded-xl ${isSelected ? 'bg-creamCard font-extrabold' : 'hover:bg-stone-50'}">
                      <span class="text-left text-ink font-bold">${r.mName} ${activeYear}</span>
                      <span class="text-right text-sage font-semibold">+${formatShortRupiah(r.income)}</span>
                      <span class="text-right text-coral font-semibold">-${formatShortRupiah(r.expense)}</span>
                      <span class="text-right font-extrabold text-ink">${r.diff >= 0 ? '+' : ''}${formatShortRupiah(r.diff)}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Riwayat Transaksi & Transfer Bulan Terpilih -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-extrabold text-ink">Transaksi & Transfer (${MONTH_NAMES_ID[activeMonth]} ${activeYear})</h2>
                <span class="text-xs font-bold text-slate-400">${monthTxs.length} item</span>
              </div>
              ${monthTxs.length === 0 ? `
                <div class="py-8 text-center text-xs text-slate-400">Tidak ada transaksi atau transfer pada bulan ${MONTH_NAMES_ID[activeMonth]} ${activeYear}.</div>
              ` : `
                <div class="divide-y divide-stone-100">
                  ${monthTxs.map(tx => renderTransactionRow(tx, { accountId: acc.id, pocketId: pkt.id })).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // 7. VIEW 3: TRANSAKSI (RIWAYAT LENGKAP, PENCARIAN & FILTER)
    // -------------------------------------------------------------------------
    function renderTransaksiView() {
      const searchQ = (ui.txSearch || '').toLowerCase().trim();
      const filtered = db.transactions
        .filter(t => {
          if (ui.txTypeFilter !== 'all' && t.type !== ui.txTypeFilter) return false;
          if (!searchQ) return true;
          const cat = db.categories.find(c => c.id === t.categoryId);
          const sub = cat?.subcategories?.find(s => s.id === t.subcategoryId);
          const acc = db.accounts.find(a => a.id === t.accountId);
          const pkt = acc?.pockets?.find(p => p.id === t.pocketId);
          const haystack = [t.title, cat?.name, sub?.name, acc?.name, pkt?.name, t.date].join(' ').toLowerCase();
          return haystack.includes(searchQ);
        })
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const totalIncome = filtered
        .filter(t => t.type === 'income')
        .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);
      const totalExpense = filtered
        .filter(t => t.type === 'expense')
        .reduce((s, t) => s + toIDR(t.amount, getTxCurrency(t)), 0);

      return `
        <div class="p-4 space-y-4">
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #FBDAD5; border-color: #F3B3A9;">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-xl font-extrabold text-ink tracking-tight">Riwayat Transaksi</h1>
                <p class="text-xs text-slate-700">Semua pemasukan, pengeluaran & transfer antar-pocket</p>
              </div>
              <button onclick="openTxModal()" class="px-3.5 py-2 rounded-2xl bg-ink text-white text-xs font-bold shadow-sm hover:bg-slate-800">
                + Catat
              </button>
            </div>

            <input type="text" value="${ui.txSearch}" oninput="onTxSearchInput(this.value)"
              placeholder="Cari transaksi, kategori, atau nama pocket..."
              class="w-full px-3.5 py-2.5 rounded-2xl bg-white/95 border border-[#F3B3A9] text-xs font-semibold text-ink focus:outline-none focus:border-ink" />

            <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
              ${[
                { id: 'all', label: 'Semua' },
                { id: 'expense', label: 'Pengeluaran' },
                { id: 'income', label: 'Pemasukan' },
                { id: 'transfer', label: 'Transfer' }
              ].map(f => `
                <button onclick="setTxTypeFilter('${f.id}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${ui.txTypeFilter === f.id ? 'bg-ink text-white' : 'bg-white/85 text-slate-700'}">
                  ${f.label}
                </button>
              `).join('')}
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-[#F8D0CA]/80 text-xs">
              <div class="bg-sageLight/70 px-3 py-2 rounded-2xl">
                <span class="text-[10px] font-bold text-sage block">Total Pemasukan</span>
                <span class="font-extrabold text-ink">+${formatCurrency(totalIncome)}</span>
              </div>
              <div class="bg-coralLight/70 px-3 py-2 rounded-2xl">
                <span class="text-[10px] font-bold text-coral block">Total Pengeluaran</span>
                <span class="font-extrabold text-ink">-${formatCurrency(totalExpense)}</span>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
            ${filtered.length === 0 ? `
              <div class="py-10 text-center text-xs text-slate-400">Tidak ada transaksi yang cocok dengan filter.</div>
            ` : `
              <div class="divide-y divide-stone-100">
                ${filtered.map(tx => renderTransactionRow(tx)).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function onTxSearchInput(val) {
      ui.txSearch = val;
      render();
    }

    function setTxTypeFilter(val) {
      ui.txTypeFilter = val;
      render();
    }

    function getTxCurrency(tx) {
      const acc = db.accounts.find(a => a.id === tx.accountId);
      return acc ? acc.currency : 'IDR';
    }

    function renderTransactionRow(tx, contextPocket = null) {
      const acc = db.accounts.find(a => a.id === tx.accountId);
      const pkt = acc?.pockets?.find(p => p.id === tx.pocketId);
      const cur = acc ? acc.currency : 'IDR';

      if (tx.type === 'transfer') {
        const toAcc = db.accounts.find(a => a.id === tx.toAccountId);
        const toPkt = toAcc?.pockets?.find(p => p.id === tx.toPocketId);
        const isIncomingToPocket = contextPocket && tx.toAccountId === contextPocket.accountId && tx.toPocketId === contextPocket.pocketId;

        return `
          <div class="py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0">
                ⇄
              </div>
              <div class="min-w-0">
                <div class="text-sm font-bold text-ink truncate">${tx.title || 'Transfer Saldo'}</div>
                <div class="text-[11px] text-slate-400 truncate">
                  ${pkt?.name || acc?.name || '-'} → ${toPkt?.name || toAcc?.name || '-'} • ${tx.date}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-sm font-extrabold ${isIncomingToPocket ? 'text-sage' : 'text-blue-600'}">
                ${isIncomingToPocket ? '+' : ''}${formatCurrency(tx.amount, cur)}
              </span>
              <button onclick="deleteTransaction('${tx.id}')" title="Hapus" class="text-slate-300 hover:text-coral p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>
        `;
      }

      const cat = db.categories.find(c => c.id === tx.categoryId);
      const sub = cat?.subcategories?.find(s => s.id === tx.subcategoryId);
      const isIncome = tx.type === 'income';

      return `
        <div class="py-3 flex items-center justify-between gap-2">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-9 h-9 rounded-2xl ${isIncome ? 'bg-sageLight text-sage' : 'bg-coralLight text-coral'} flex items-center justify-center font-extrabold text-xs shrink-0">
              ${isIncome ? '↓' : '↑'}
            </div>
            <div class="min-w-0">
              <div class="text-sm font-bold text-ink truncate">${tx.title || cat?.name || 'Transaksi'}</div>
              <div class="text-[11px] text-slate-400 truncate">
                ${cat?.name || 'Umum'}${sub ? ` (${sub.name})` : ''} • ${pkt?.name || acc?.name || '-'} • ${tx.date}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-sm font-extrabold ${isIncome ? 'text-sage' : 'text-coral'}">
              ${isIncome ? '+' : '-'}${formatCurrency(tx.amount, cur)}
            </span>
            <button onclick="deleteTransaction('${tx.id}')" title="Hapus" class="text-slate-300 hover:text-coral p-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. VIEW 4: HUTANG & PIUTANG (TERINTEGRASI LANGSUNG KE SALDO AKUN)
    // =========================================================================
    function renderHutangView() {
      const totalPayable = db.debts
        .filter(d => d.type === 'payable')
        .reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);

      const totalReceivable = db.debts
        .filter(d => d.type === 'receivable')
        .reduce((s, d) => s + Math.max(0, d.totalAmount - d.paidAmount), 0);

      const list = db.debts.filter(d => {
        if (ui.debtFilter === 'all') return true;
        return d.type === ui.debtFilter;
      });

      return `
        <div class="p-4 space-y-4">
          <div class="rounded-3xl p-4 shadow-sm border space-y-3" style="background-color: #FBE9BE; border-color: #F3D082;">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-xl font-extrabold text-ink tracking-tight">Hutang & Piutang</h1>
                <p class="text-xs text-slate-700">Otomatis menambah/mengurangi saldo akun terkait</p>
              </div>
              <button onclick="openDebtModal()" class="px-3.5 py-2 rounded-2xl bg-ink text-white text-xs font-bold shadow-sm hover:bg-slate-800">
                + Catat
              </button>
            </div>

            <!-- Ringkasan Hutang & Piutang -->
            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <div class="bg-coralLight rounded-2xl p-3 border border-coral/20">
                <span class="text-[11px] font-bold text-coral">Sisa Hutang Saya</span>
                <div class="text-base font-extrabold text-ink mt-0.5">${formatCurrency(totalPayable)}</div>
                <span class="text-[10px] text-slate-500">Wajib dibayar</span>
              </div>
              <div class="bg-sageLight rounded-2xl p-3 border border-sage/20">
                <span class="text-[11px] font-bold text-sage">Sisa Piutang Orang</span>
                <div class="text-base font-extrabold text-ink mt-0.5">${formatCurrency(totalReceivable)}</div>
                <span class="text-[10px] text-slate-500">Akan diterima</span>
              </div>
            </div>

            <!-- Filter Tab -->
            <div class="flex gap-1.5 pt-1">
              ${[
                { id: 'all', label: 'Semua' },
                { id: 'payable', label: 'Hutang Saya' },
                { id: 'receivable', label: 'Piutang (Pinjaman)' }
              ].map(t => `
                <button onclick="setDebtFilter('${t.id}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold ${ui.debtFilter === t.id ? 'bg-ink text-white' : 'bg-stone-100 text-slate-600'}">
                  ${t.label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Daftar Kartu Hutang / Piutang -->
          <div class="space-y-3">
            ${list.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center text-xs text-slate-400 border border-stone-200/70">
                Belum ada catatan hutang atau piutang.
              </div>
            ` : list.map(d => {
              const remaining = Math.max(0, d.totalAmount - d.paidAmount);
              const pct = d.totalAmount > 0 ? Math.min(100, Math.round((d.paidAmount / d.totalAmount) * 100)) : 100;
              const isPaidOff = remaining === 0;
              const isPayable = d.type === 'payable';
              const acc = db.accounts.find(a => a.id === d.accountId);
              const pkt = acc?.pockets?.find(p => p.id === d.pocketId);

              return `
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${isPayable ? 'bg-coralLight text-coral' : 'bg-sageLight text-sage'}">
                        ${isPayable ? 'HUTANG SAYA' : 'PIUTANG'}
                      </span>
                      <h3 class="text-base font-extrabold text-ink mt-1">${d.person}</h3>
                      <p class="text-xs text-slate-500">${d.note || 'Tanpa catatan'} • Jatuh tempo: ${d.dueDate || '-'}</p>
                      <p class="text-[11px] text-slate-400 mt-0.5">Akun: ${acc?.name || '-'} (${pkt?.name || '-'})</p>
                    </div>
                    <div class="text-right">
                      <div class="text-[11px] text-slate-400">Sisa</div>
                      <div class="text-base font-extrabold ${isPaidOff ? 'text-sage' : (isPayable ? 'text-coral' : 'text-ink')}">
                        ${isPaidOff ? 'LUNAS' : formatCurrency(remaining)}
                      </div>
                      <div class="text-[11px] text-slate-400">dari ${formatCurrency(d.totalAmount)}</div>
                    </div>
                  </div>

                  <div class="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
                    <div class="h-full ${isPayable ? 'bg-coral' : 'bg-sage'} rounded-full" style="width: ${pct}%"></div>
                  </div>

                  <div class="flex items-center justify-between pt-1">
                    <span class="text-[11px] font-semibold text-slate-500">Terbayar: ${formatCurrency(d.paidAmount)} (${pct}%)</span>
                    <div class="flex items-center gap-2">
                      ${!isPaidOff ? `
                        <button onclick="openSettleDebtModal('${d.id}')"
                          class="px-3 py-1.5 rounded-xl bg-ink text-white text-xs font-bold hover:bg-slate-800">
                          ${isPayable ? 'Bayar / Cicil' : 'Terima Pelunasan'}
                        </button>
                      ` : ''}
                      <button onclick="deleteDebt('${d.id}')" class="p-1.5 text-slate-300 hover:text-coral" title="Hapus">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setDebtFilter(f) {
      ui.debtFilter = f;
      render();
    }

    // =========================================================================
    // 8B. VIEW TABUNGAN (TARGET CELENGAN NON-BABI, SETOR, TARIK & RIWAYAT)
    // =========================================================================
    function renderTabunganView() {
      if (ui.selectedSavingGoalId) {
        return renderSavingGoalDetailView();
      }

      const goals = db.savingsGoals || [];
      const totalSaved = goals.reduce((s, g) => s + getSavingGoalBalanceIDR(g), 0);
      const totalTarget = goals.reduce((s, g) => s + (Number(g.targetAmount) || 0), 0);
      const overallPct = totalTarget > 0 ? Math.min(100, Math.round((totalSaved / totalTarget) * 100)) : 0;

      return `
        <div class="p-4 space-y-4">
          <!-- Header Tabungan (Medium-Soft Pine/Sage Pastel - Lebih Pekat & Kontras) -->
          <div class="rounded-3xl p-4 shadow-sm border flex items-center justify-between gap-2" style="background-color: #D0EAD9; border-color: #A4D3B6;">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-white/95 text-sage flex items-center justify-center shrink-0 border border-[#A4D3B6]">
                ${ICONS.celengan}
              </div>
              <div>
                <h1 class="text-xl font-extrabold text-ink tracking-tight">Tabungan</h1>
                <p class="text-xs text-slate-700">Terhubung ke Akun & masuk dalam Total Aset</p>
              </div>
            </div>
            <button onclick="openSavingGoalModal()" class="px-3.5 py-2 rounded-2xl bg-sage text-white text-xs font-bold shadow-sm hover:opacity-95 active:scale-95 transition-all shrink-0">
              + Target
            </button>
          </div>

          <!-- Kartu Ringkasan Total Tabungan (Cream-Mint Sangat Lembut agar kontras dengan header atas) -->
          <div class="rounded-3xl p-5 shadow-sm border relative overflow-hidden" style="background: linear-gradient(135deg, #F3FAF6 0%, #E7F4ED 100%); border-color: #C7E3D2; color: #1A2433;">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 rounded-full bg-white/60 pointer-events-none"></div>
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-700">Total Tabungan (Bagian dari Aset)</span>
              <span class="px-2.5 py-0.5 rounded-full bg-white text-[#1F5C42] border border-[#C7E3D2] text-[11px] font-extrabold">${overallPct}% dari Target</span>
            </div>
            <div class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-1 text-ink">
              ${formatCurrency(totalSaved)}
            </div>
            <div class="text-xs text-slate-600 mt-1">
              Target Keseluruhan: <strong class="text-ink">${formatCurrency(totalTarget)}</strong> (${goals.length} celengan)
            </div>
            <div class="w-full h-2 bg-white rounded-full overflow-hidden mt-3 border border-[#C7E3D2]">
              <div class="h-full bg-sage rounded-full transition-all duration-300" style="width: ${overallPct}%"></div>
            </div>
          </div>

          <!-- Daftar Target Tabungan -->
          <div class="space-y-3.5">
            ${goals.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center border border-stone-200/70 space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-creamCard text-sage mx-auto flex items-center justify-center">
                  ${ICONS.celengan}
                </div>
                <div class="text-sm font-bold text-ink">Belum ada celengan tabungan</div>
                <p class="text-xs text-slate-400">Buat target tabungan dan pilih akun penyimpanannya.</p>
              </div>
            ` : goals.map(g => {
              const color = getColorObj(g.colorId || 'emerald');
              const iconSvg = ICONS[g.icon] || ICONS.celengan;
              const currentSavedIDR = getSavingGoalBalanceIDR(g);
              const pct = g.targetAmount > 0 ? Math.min(100, Math.round((currentSavedIDR / g.targetAmount) * 100)) : 0;
              const remaining = Math.max(0, g.targetAmount - currentSavedIDR);
              const isCompleted = currentSavedIDR >= g.targetAmount && g.targetAmount > 0;
              const linkedAcc = db.accounts.find(a => a.id === g.accountId);
              const linkedPkt = linkedAcc?.pockets?.find(p => p.id === g.pocketId);

              return `
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70 space-y-3 transition-all">
                  <div class="flex items-start justify-between gap-2">
                    <button onclick="openSavingGoalDetail('${g.id}')" class="flex items-center gap-3 text-left min-w-0 flex-1 group">
                      <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shrink-0 shadow-xs" style="background-color: ${color.hex};">
                        ${iconSvg}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <h3 class="text-base font-extrabold text-ink group-hover:underline truncate">${g.name}</h3>
                          ${isCompleted ? `<span class="px-2 py-0.5 rounded-full bg-sageLight text-sage text-[10px] font-extrabold">TERCAPAI</span>` : ''}
                        </div>
                        <div class="flex items-center gap-1.5 mt-0.5">
                          <span class="px-2 py-0.5 rounded-md bg-creamCard border border-stone-200/80 text-[10px] font-bold text-ink">
                            🏦 ${linkedAcc ? `${linkedAcc.name}${linkedPkt ? ` • ${linkedPkt.name}` : ''}` : 'Belum ditautkan'}
                          </span>
                        </div>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">${g.note || 'Tabungan target'} • Tenggat: ${g.deadline || '-'}</p>
                      </div>
                    </button>

                    <button onclick="openSavingGoalModal('${g.id}')" title="Edit Target"
                      class="p-2 rounded-xl bg-creamCard hover:bg-stone-200/70 text-slate-600 shrink-0">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                    </button>
                  </div>

                  <!-- Progress Nominal -->
                  <div>
                    <div class="flex items-baseline justify-between text-xs mb-1.5">
                      <div>
                        <span class="text-sm font-extrabold" style="color: ${color.hex};">${formatCurrency(currentSavedIDR)}</span>
                        <span class="text-slate-400"> / ${formatCurrency(g.targetAmount)}</span>
                      </div>
                      <span class="font-extrabold text-ink">${pct}%</span>
                    </div>
                    <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden">
                      <div class="h-full rounded-full transition-all duration-300" style="width: ${pct}%; background-color: ${color.hex};"></div>
                    </div>
                    <div class="text-[11px] text-slate-400 mt-1">
                      ${isCompleted ? 'Target tabungan sudah terpenuhi!' : `Kurang ${formatCurrency(remaining)} lagi`}
                    </div>
                  </div>

                  <!-- Tombol Aksi Setor, Tarik & Riwayat -->
                  <div class="grid grid-cols-3 gap-2 pt-1">
                    <button onclick="openSavingTransferModal('${g.id}', 'deposit')"
                      class="py-2 px-2.5 rounded-2xl text-white text-xs font-extrabold shadow-xs hover:opacity-95 active:scale-95 transition-all"
                      style="background-color: ${color.hex};">
                      + Setor
                    </button>
                    <button onclick="openSavingTransferModal('${g.id}', 'withdraw')"
                      class="py-2 px-2.5 rounded-2xl bg-creamCard hover:bg-stone-200/70 text-ink text-xs font-bold border border-stone-200/80 active:scale-95 transition-all">
                      ↓ Tarik
                    </button>
                    <button onclick="openSavingGoalDetail('${g.id}')"
                      class="py-2 px-2.5 rounded-2xl bg-stone-100 hover:bg-stone-200 text-slate-600 text-xs font-bold active:scale-95 transition-all">
                      Riwayat
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openSavingGoalDetail(goalId) {
      ui.selectedSavingGoalId = goalId;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeSavingGoalDetail() {
      ui.selectedSavingGoalId = null;
      render();
    }

    function renderSavingGoalDetailView() {
      const g = (db.savingsGoals || []).find(item => item.id === ui.selectedSavingGoalId);
      if (!g) {
        ui.selectedSavingGoalId = null;
        return renderTabunganView();
      }
      const color = getColorObj(g.colorId || 'emerald');
      const currentSavedIDR = getSavingGoalBalanceIDR(g);
      const pct = g.targetAmount > 0 ? Math.min(100, Math.round((currentSavedIDR / g.targetAmount) * 100)) : 0;
      const history = [...(g.history || [])].sort((a, b) => b.date.localeCompare(a.date));
      const linkedAcc = db.accounts.find(a => a.id === g.accountId);
      const linkedPkt = linkedAcc?.pockets?.find(p => p.id === g.pocketId);

      return `
        <div class="bg-cream min-h-screen pb-8 animate-fade-in">
          <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <button onclick="closeSavingGoalDetail()" class="p-1.5 -ml-1.5 rounded-xl hover:bg-stone-100 text-ink">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              </button>
              <div class="truncate">
                <h1 class="text-base font-extrabold text-ink truncate">${g.name}</h1>
                <div class="text-[11px] text-slate-500 truncate">Disimpan di: <strong>${linkedAcc?.name || '-'} (${linkedPkt?.name || '-'})</strong></div>
              </div>
            </div>
            <button onclick="openSavingGoalModal('${g.id}')" class="px-3 py-1.5 rounded-xl bg-stone-100 text-xs font-bold text-ink shrink-0">
              Edit Target
            </button>
          </div>

          <div class="p-4 space-y-4">
            <div class="rounded-3xl p-5 text-white shadow-md" style="background-color: ${color.hex};">
              <div class="flex items-center justify-between text-xs text-white/80">
                <span>Saldo Terkumpul (Tercatat di Aset)</span>
                <span class="font-extrabold text-white">${pct}%</span>
              </div>
              <div class="text-3xl font-extrabold mt-1">${formatCurrency(currentSavedIDR)}</div>
              <div class="text-xs text-white/85 mt-0.5">Target: ${formatCurrency(g.targetAmount)} • Tenggat: ${g.deadline || '-'}</div>
              <div class="w-full h-2 bg-black/20 rounded-full overflow-hidden mt-3">
                <div class="h-full bg-white rounded-full" style="width: ${pct}%"></div>
              </div>

              <div class="grid grid-cols-2 gap-2.5 mt-4 pt-3 border-t border-white/20">
                <button onclick="openSavingTransferModal('${g.id}', 'deposit')"
                  class="py-2.5 rounded-2xl bg-white text-ink text-xs font-extrabold shadow-xs">+ Setor Tabungan</button>
                <button onclick="openSavingTransferModal('${g.id}', 'withdraw')"
                  class="py-2.5 rounded-2xl bg-black/25 text-white text-xs font-extrabold">↓ Tarik ke Akun</button>
              </div>
            </div>

            <div class="bg-white rounded-3xl p-4 shadow-sm border border-stone-200/70">
              <h2 class="text-sm font-extrabold text-ink mb-3">Riwayat Setoran & Penarikan (${history.length})</h2>
              ${history.length === 0 ? `
                <div class="py-8 text-center text-xs text-slate-400">Belum ada riwayat mutasi tabungan.</div>
              ` : `
                <div class="divide-y divide-stone-100">
                  ${history.map(h => {
                    const acc = db.accounts.find(a => a.id === h.accountId);
                    const pkt = acc?.pockets?.find(p => p.id === h.pocketId);
                    const isDeposit = h.type === 'deposit';
                    return `
                      <div class="py-3 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                          <div class="w-9 h-9 rounded-2xl ${isDeposit ? 'bg-sageLight text-sage' : 'bg-amber-50 text-amber-700'} flex items-center justify-center font-extrabold text-xs shrink-0">
                            ${isDeposit ? '+' : '↓'}
                          </div>
                          <div class="min-w-0">
                            <div class="text-sm font-bold text-ink truncate">${h.note || (isDeposit ? 'Setor Tabungan' : 'Tarik Tabungan')}</div>
                            <div class="text-[11px] text-slate-400 truncate">
                              ${isDeposit ? 'Dari' : 'Ke'}: ${pkt?.name || acc?.name || 'Akun'} • ${h.date}
                            </div>
                          </div>
                        </div>
                        <span class="text-sm font-extrabold ${isDeposit ? 'text-sage' : 'text-amber-700'} shrink-0">
                          ${isDeposit ? '+' : '-'}${formatCurrency(h.amount)}
                        </span>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. VIEW 5: PENGATURAN (KATEGORI, SUBKATEGORI, KURS LIVE & BACKUP/RESTORE)

          </div>

    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modal-backdrop') {
        closeModal();
      }
    }

    function submitEditCategoryLimit(e, catId) {
      e.preventDefault();
      const cat = db.categories.find(c => c.id === catId);
      if (!cat) return;
      const newLimit = Math.max(0, Number(document.getElementById('input-cat-limit').value) || 0);

      if (cat.subcategories && cat.subcategories.length > 0) {
        const oldSubSum = cat.subcategories.reduce((s, sub) => s + (Number(sub.limit) || 0), 0);
        if (oldSubSum > 0) {
          // Distribusikan secara proporsional ke subkategori agar penjumlahannya tetap sama persis
          let allocated = 0;
          cat.subcategories.forEach((sub, idx) => {
            if (idx === cat.subcategories.length - 1) {
              sub.limit = Math.max(0, newLimit - allocated);
            } else {
              const share = Math.round((sub.limit / oldSubSum) * newLimit);
              sub.limit = share;
              allocated += share;
            }
          });
        } else {
          cat.directLimit = newLimit;
        }
      } else {
        cat.directLimit = newLimit;
      }

      saveData();
      closeModal();
      showToast('Limit kategori diperbarui');
      render();
    }

    function submitEditSubLimit(e, catId, subId) {
      e.preventDefault();
      const cat = db.categories.find(c => c.id === catId);
      const sub = cat?.subcategories?.find(s => s.id === subId);
      if (!cat || !sub) return;

      sub.limit = Math.max(0, Number(document.getElementById('input-sub-limit').value) || 0);
      cat.directLimit = 0; // Karena limit dihitung dari penjumlahan subkategori

      saveData();
      closeModal();
      showToast(`Limit ${sub.name} & total ${cat.name} diperbarui`);
      render();
    }
